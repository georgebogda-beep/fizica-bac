function rlc(U,R,Lh,C,nu){ const w=2*Math.PI*nu, XL=w*Lh, XC=1/(w*C), Z=Math.hypot(R,XL-XC), I=U/Z, phi=Math.atan2(XL-XC,R); return {XL,XC,Z,I,phi,P:U*I*Math.cos(phi),nu0:1/(2*Math.PI*Math.sqrt(Lh*C))}; }
function simCA(){
  $('#simhost').innerHTML=`<div class="stack">`
   +labHTML('Circuit RLC serie',sl('rc-U','Tensiunea efectivă U',10,240,10,220)+sl('rc-R','Rezistența R',5,200,5,40)+sl('rc-L','Inductanța L',10,500,10,100)+sl('rc-C','Capacitatea C',1,200,1,100)+sl('rc-n','Frecvența ν',10,200,1,50)+`<div class="fx">Z = √(R² + (X_L − X_C)²) ;  I = U/Z ;  tg φ = (X_L − X_C)/R</div><p class="hint">Mută frecvența până la ν₀: X_L = X_C, impedanța scade la R și curentul e maxim (rezonanța tensiunilor).</p>`,'rc')
   +labHTML('Transformator ideal',sl('tr-1','Spire în primar N₁',50,2000,50,1000)+sl('tr-2','Spire în secundar N₂',50,2000,50,100)+sl('tr-U','Tensiunea primară U₁',6,400,2,220)+sl('tr-P','Puterea transmisă P',10,2000,10,440)+`<div class="fx">U₁/U₂ = N₁/N₂ = I₂/I₁</div><p class="hint">Transformatorul ideal nu pierde putere: U₁I₁ = U₂I₂. Funcționează doar în curent alternativ.</p>`,'tr')+`</div>`;
  const get=()=>({U:sval('rc-U'),R:sval('rc-R'),Lh:sval('rc-L')*1e-3,C:sval('rc-C')*1e-6,nu:sval('rc-n')});
  const u1=()=>{ const d=get(), r=rlc(d.U,d.R,d.Lh,d.C,d.nu), dx=r.XL-r.XC; setv('rc-U',d.U+' V'); setv('rc-R',d.R+' Ω'); setv('rc-L',fmt(d.Lh*1e3,0)+' mH'); setv('rc-C',fmt(d.C*1e6,0)+' μF'); setv('rc-n',d.nu+' Hz');
    $('#rc-res').innerHTML=tile('Reactanța inductivă X_L',fmt(r.XL,1),'Ω')+tile('Reactanța capacitivă X_C',fmt(r.XC,1),'Ω')+tile('Impedanța Z',fmt(r.Z,1),'Ω')+tile('Intensitatea efectivă I',fmt(r.I),'A',undefined,true)+tile('Defazajul φ',fmt(r.phi*180/Math.PI,1),'°')+tile('Factorul de putere cos φ',fmt(Math.cos(r.phi)),'')+tile('Puterea activă P',fmt(r.P,1),'W')+tile('Frecvența de rezonanță ν₀',fmt(r.nu0,1),'Hz')+ttile('Caracterul circuitului',Math.abs(dx)<0.02*d.R?'Rezonanță: u și i în fază':dx>0?'Inductiv: curentul rămâne în urma tensiunii':'Capacitiv: curentul este înaintea tensiunii'); redraw(); };
  const u2=()=>{ const a=sval('tr-1'),b=sval('tr-2'),U=sval('tr-U'),P=sval('tr-P'),U2=U*b/a; setv('tr-1',a+' spire'); setv('tr-2',b+' spire'); setv('tr-U',U+' V'); setv('tr-P',P+' W');
    $('#tr-res').innerHTML=tile('Raportul de transformare k',fmt(a/b),'')+tile('Tensiunea secundară U₂',fmt(U2,1),'V',undefined,true)+tile('Curentul primar I₁',fmt(P/U),'A')+tile('Curentul secundar I₂',fmt(P/U2),'A')+ttile('Tipul',a>b?'Coborâtor de tensiune':a<b?'Ridicător de tensiune':'Raport 1:1'); };
  u1(); u2();
  liveAnim($('#rc-plots'),'u(t) și i(t): defazajul se vede ca decalaj între curbe (încetinit)',(cv,t)=>{ const d=get(), r=rlc(d.U,d.R,d.Lh,d.C,d.nu); const {ctx,W,H}=prep(cv); const y=H/2+4, A=H*0.34, k=r.I/(d.U/d.R), ph0=t*2.2;
    ctx.strokeStyle=css('--line'); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(14,y); ctx.lineTo(W-14,y); ctx.stroke();
    const curve=(amp,sh,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.beginPath(); for(let j=0;j<=200;j++){ const x=14+(W-28)*j/200, yy=y-amp*Math.sin(4*Math.PI*j/200-ph0-sh); j?ctx.lineTo(x,yy):ctx.moveTo(x,yy); } ctx.stroke(); };
    curve(A,0,css('--c1')); curve(A*Math.max(0.06,k),r.phi,css('--accent'));
    mono(ctx,12); ctx.textAlign='left'; ctx.fillStyle=css('--c1'); ctx.fillText('u(t)',16,14); ctx.fillStyle=css('--accent'); ctx.fillText('i(t)',60,14); ctx.fillStyle=css('--ink'); ctx.textAlign='right'; ctx.fillText('φ = '+fmt(r.phi*180/Math.PI,1)+'°',W-16,14); },0.36);
  wide(addPlot($('#rc-plots'),'Curba de rezonanță I(ν)',cv=>{ const d=get(); const pts=[]; for(let n=10;n<=200;n+=1) pts.push({n,I:rlc(d.U,d.R,d.Lh,d.C,n).I}); plotFn(cv,pts,'n','I','ν (Hz)','I (A)',css('--accent'),{n:d.nu,I:rlc(d.U,d.R,d.Lh,d.C,d.nu).I}); },0.5));
  bindAll(['rc-U','rc-R','rc-L','rc-C','rc-n'],u1); bindAll(['tr-1','tr-2','tr-U','tr-P'],u2);
}

const SERII=['','Lyman (ultraviolet)','Balmer (vizibil și UV apropiat)','Paschen (infraroșu)','Brackett (infraroșu)','Pfund (infraroșu)','Humphreys (infraroșu)'];
function simMod(){
  $('#simhost').innerHTML=`<div class="stack">`
   +labHTML('Relativitate restrânsă',sl('re-b','Viteza v/c',0,0.99,0.01,0.6)+`<div class="fx">γ = 1/√(1 − v²/c²) ;  Δt = γ·Δt₀ ;  l = l₀/γ</div><p class="hint">Nava are 100 m în repaus. Văzută de pe Pământ, se scurtează pe direcția mișcării, iar ceasul ei rămâne în urmă.</p>`,'re')
   +labHTML('Atomul de hidrogen (Bohr)',sl('bo-n','Nivelul de plecare n',2,7,1,3)+sl('bo-m','Nivelul de sosire',1,6,1,2)+`<div class="fx">E_n = −13,6 eV/n² ;  hν = E_n − E_m</div><p class="hint">Electronul coboară pe un nivel mai jos și emite un foton. S-a folosit hc ≈ 1240 eV·nm.</p>`,'bo')
   +labHTML('Dezintegrare radioactivă',sl('dz-T','Timpul de înjumătățire T',1,20,1,8)+sl('dz-t','Timpul scurs t',0,80,1,24)+`<div class="fx">N = N₀·2^(−t/T) = N₀·e^(−λt) ;  λ = ln 2/T</div><p class="hint">Timpii sunt în zile. Fiecare pătrat este un grup de nuclee; cele stinse s-au dezintegrat.</p>`,'dz')
   +labHTML('Dioda semiconductoare',sl('di-U','Tensiunea directă U',0,0.72,0.01,0.62)+`<div class="fx">I = I_s·(e^(U/U_T) − 1)</div><p class="hint">Model pentru o diodă cu siliciu: I_s = 10⁻¹² A, U_T = 26 mV. În polarizare inversă trece doar curentul I_s, practic zero.</p>`,'di')+`</div>`;
  const lev=()=>{ const m=sval('bo-m'); return {m,n:Math.max(sval('bo-n'),m+1)}; };
  const u1=()=>{ const b=sval('re-b'),g=1/Math.sqrt(1-b*b); setv('re-b',fmt(b)+' c');
    $('#re-res').innerHTML=tile('Factorul Lorentz γ',fmt(g,3),'',undefined,true)+tile('1 s pe navă durează pe Pământ',fmt(g,3),'s')+tile('Lungimea navei (l₀ = 100 m)',fmt(100/g,1),'m')+tile('Energia cinetică',fmt(g-1,3),'m₀c²')+tile('Impulsul',fmt(g*b,3),'m₀c'); redraw(); };
  const u2=()=>{ const {n,m}=lev(), e=13.6*(1/(m*m)-1/(n*n)), lam=1240/e; setv('bo-n','n = '+n); setv('bo-m','m = '+m);
    $('#bo-res').innerHTML=tile('E pe nivelul n',fmt(-13.6/(n*n)),'eV')+tile('E pe nivelul m',fmt(-13.6/(m*m)),'eV')+tile('Energia fotonului',fmt(e),'eV',undefined,true)+tile('Lungimea de undă λ',fmt(lam,1),'nm')+ttile('Seria spectrală',SERII[m])+ttile('Domeniul',lam<380?'Ultraviolet':lam<=760?'Vizibil':'Infraroșu'); };
  const u3=()=>{ const T=sval('dz-T'),t=sval('dz-t'),f=Math.pow(2,-t/T); setv('dz-T',T+' zile'); setv('dz-t',t+' zile');
    $('#dz-res').innerHTML=tile('Nuclee rămase N/N₀',fmt(f*100,1),'%',undefined,true)+tile('Nuclee dezintegrate',fmt((1-f)*100,1),'%')+tile('Perioade scurse t/T',fmt(t/T),'')+tile('Constanta λ',fmt(Math.LN2/T,3),'zi⁻¹')+tile('Activitatea Λ/Λ₀',fmt(f*100,1),'%'); redraw(); };
  const dI=U=>1e-12*(Math.exp(U/0.026)-1);
  const u4=()=>{ const U=sval('di-U'),I=dI(U); setv('di-U',fmt(U)+' V');
    $('#di-res').innerHTML=tile('Curentul I',I<1e-3?fmt(I*1e6,3):fmt(I*1e3,1),I<1e-3?'μA':'mA',undefined,true)+ttile('Starea diodei',U<0.5?'Aproape blocată: sub pragul de deschidere':'Deschisă: conduce')+tile('Rezistența statică U/I',I>0?fmt(U/I):'∞','Ω'); redraw(); };
  u1(); u2(); u3(); u4();
  let xs=0; const shipDraw=cv=>{ const b=sval('re-b'),g=1/Math.sqrt(1-b*b); const {ctx,W,H}=prep(cv); const ink=css('--ink'), y=H/2+4, w0=Math.min(170,W*0.34), w=w0/g, x=((xs%1)*(W+w0))-w0/2;
    ctx.strokeStyle=css('--line'); ctx.lineWidth=1; ctx.setLineDash([3,6]); ctx.strokeRect(W/2-w0/2,y-17,w0,34); ctx.setLineDash([]);
    ctx.fillStyle=css('--c4'); ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w*0.2,y-17); ctx.lineTo(x-w/2,y-17); ctx.lineTo(x-w/2,y+17); ctx.lineTo(x+w*0.2,y+17); ctx.closePath(); ctx.fill();
    ctx.fillStyle=ink; mono(ctx,12); ctx.textAlign='left'; ctx.fillText('l = '+fmt(100/g,1)+' m din 100 m (conturul punctat = lungimea de repaus)',14,16); }; const ship=wide(addPlot($('#re-plots'),'Nava văzută de pe Pământ',shipDraw,0.26));

let calcType='izobara'; const calcVals={};
function calculator(arg){
  const cm=k=>CALCS[k].m||'termo';
  if(subj(arg)&&cm(calcType)!==arg) calcType=Object.keys(CALCS).find(k=>cm(k)===arg)||calcType;
  view.innerHTML=`<h1>Calculator pas cu pas</h1><p class="lead">Introdu datele problemei și primești rezolvarea cu numerele înlocuite în formule, ca pe foaia de examen.</p>
  <div class="grid2"><div class="sheet"><div class="field"><label for="calc-sel">Ce calculezi</label><select id="calc-sel">${SUBJ.filter(s=>Object.keys(CALCS).some(k=>cm(k)===s.id)).map(s=>`<optgroup label="${klass(s.cls).s} · ${s.t}">${Object.keys(CALCS).filter(k=>cm(k)===s.id).map(k=>`<option value="${k}"${k===calcType?' selected':''}>${CALCS[k].name}</option>`).join('')}</optgroup>`).join('')}</select></div><div id="calc-fields"></div><p class="hint" id="calc-note"></p></div>
  <div class="sheet"><h2 id="calc-title">Rezolvare</h2><div class="steps" id="calc-steps"></div></div></div>`;
  $('#calc-sel').onchange=e=>{calcType=e.target.value;calcFields();}; calcFields();
}
function calcFields(){
  const box=$('#calc-fields'); box.innerHTML='';
  CALCS[calcType].f.forEach(([k,l,d])=>{
    const id='cf-'+k, v=calcVals[calcType+k]??d; const w=document.createElement('div'); w.className='field';
    w.innerHTML=k==='i'?`<label for="${id}">Grade de libertate i</label><select id="${id}"><option value="3"${v==3?' selected':''}>3 (monoatomic)</option><option value="5"${v==5?' selected':''}>5 (biatomic)</option><option value="6"${v==6?' selected':''}>6 (poliatomic)</option></select>`:`<label for="${id}">${l}</label><input id="${id}" type="number" step="any" value="${v}">`;
    box.appendChild(w); w.querySelector('input,select').addEventListener('input',e=>{calcVals[calcType+k]=e.target.value;calc();});
  });
  $('#calc-note').textContent=CALCS[calcType].note||'R = 8,31 J/(mol·K). Temperaturi în kelvin; la volume contează doar raportul.'; calc();
}
const stp=(n,w,f,r)=>`<div class="step"><span class="n">${n}</span><div><div class="what">${w}</div><div class="f">${f}</div>${r?`<div class="r">${r}</div>`:''}</div></div>`;
function calc(){

    if(m==='p')o.push(stp(n++,'Presiunea','p = νRT/V = '+fmt(nu)+'·8,31·'+fmt(T,1)+'/'+fmt(V,4),'p = '+fmt(nu*R*T/V,1)+' Pa'));

    if(m==='T')o.push(stp(n++,'Temperatura','T = pV/(νR) = '+fmt(p,0)+'·'+fmt(V,4)+'/('+fmt(nu)+'·8,31)','T = '+fmt(p*V/(nu*R),1)+' K'));

    const m1=g('m1'),mu1=g('mu1'),m2=g('m2'),mu2=g('mu2'),T=g('T'),V=g('V'); if(![m1,mu1,m2,mu2,T,V].every(x=>x>0)) return bad('Toate valorile trebuie să fie pozitive.');

  } else if(ct==='calorim'){
    const m1=g('m1'),c1=g('c1'),t1=g('t1'),m2=g('m2'),c2=g('c2'),t2=g('t2'); if(![m1,c1,m2,c2].every(x=>x>0)||!has('t1')||!has('t2')) return bad('Completează toate câmpurile.');
    const th=(m1*c1*t1+m2*c2*t2)/(m1*c1+m2*c2);
    o.push(stp(n++,'Ecuația calorimetrică','m₁c₁(θ − t₁) = m₂c₂(t₂ − θ)',''));
    o.push(stp(n++,'Temperatura de echilibru','θ = (m₁c₁t₁ + m₂c₂t₂)/(m₁c₁ + m₂c₂)','θ = '+fmt(th,2)+' °C'));
    o.push(stp(n++,'Căldura schimbată','Q = m₁c₁(θ − t₁)','Q = '+fmt(m1*c1*(th-t1),0)+' J'));
  } else if(ct==='motor'){
    const Tc=g('Tc'),Tr=g('Tr'),Qp=g('Qp'); if(!(Tc>Tr&&Tr>0&&Qp>0)) return bad('Trebuie T_c > T_r > 0 și Q primit pozitiv.');
    const ec=1-Tr/Tc; if(has('eta')&&!(g('eta')>0&&g('eta')<=100)) return bad('η real se dă în procente, între 0 și 100 (sau lasă câmpul gol).');
    o.push(stp(n++,'Randamentul Carnot (maxim posibil)','η_C = 1 − T_r/T_c = 1 − '+fmt(Tr,0)+'/'+fmt(Tc,0),'η_C = '+fmt(ec*100,1)+' %'));
    const e=has('eta')?g('eta')/100:ec; if(has('eta')&&e>ec) o.push(stp('!','Atenție','η real > η Carnot este imposibil (Principiul II).',''));
    o.push(stp(n++,has('eta')?'Lucrul mecanic cu η dat':'Lucrul mecanic pentru un motor Carnot','L = η·Q_p = '+fmt(e,3)+'·'+fmt(Qp,0),'L = '+fmt(e*Qp,1)+' J'));
    o.push(stp(n++,'Căldura cedată sursei reci','|Q_c| = Q_p − L','|Q_c| = '+fmt(Qp-e*Qp,1)+' J'));
  } else if(ct==='izoterma'){
    const nu=g('nu'),T=g('T'),V1=g('V1'),V2=g('V2'); if(!(nu>0&&T>0&&V1>0&&V2>0)) return bad('Valorile trebuie să fie pozitive.');
    const Lm=nu*R*T*Math.log(V2/V1);
    o.push(stp(n++,'T = ct, deci energia internă nu se schimbă','ΔU = 0','ΔU = 0 J'));
    o.push(stp(n++,'Lucrul mecanic izoterm','L = νRT·ln(V₂/V₁) = '+fmt(nu)+'·8,31·'+fmt(T,0)+'·ln('+fmt(V2)+'/'+fmt(V1)+')','L = '+fmt(Lm,1)+' J'));
    o.push(stp(n++,'Principiul I','Q = ΔU + L','Q = '+fmt(Lm,1)+' J ('+(Lm>0?'primită':'cedată')+')'));
    o.push(stp(n++,'Presiunile','p₁V₁ = p₂V₂ ⇒ p₂/p₁ = V₁/V₂','p₂/p₁ = '+fmt(V1/V2,3)));
  } else {
    const nu=g('nu'),i=g('i'),T1=g('T1'); if(!(nu>0&&T1>0)) return bad('ν și T₁ trebuie să fie pozitive.');
    const Cv=i/2*R,Cp=Cv+R,gm=(i+2)/i; let T2,Lm,Qh;
    o.push(stp(n++,'Căldurile molare','C_V = (i/2)R ; C_p = C_V + R ; γ = (i+2)/i','C_V = '+fmt(Cv)+' · C_p = '+fmt(Cp)+' J/(mol·K) · γ = '+fmt(gm,3)));
    if(ct==='izocora'||ct==='izobara'){T2=g('T2'); if(!(T2>0)) return bad('T₂ trebuie să fie o temperatură absolută pozitivă (în kelvin).');}
    if((ct==='adiabatica'||ct==='pav')&&!(g('V1')>0&&g('V2')>0)) return bad('Volumele V₁ și V₂ trebuie să fie pozitive.');
    if(ct==='adiabatica'){const V1=g('V1'),V2=g('V2');T2=T1*Math.pow(V1/V2,gm-1);o.push(stp(n++,'Temperatura finală din TV^(γ−1) = ct','T₂ = T₁·(V₁/V₂)^(γ−1) = '+fmt(T1,0)+'·('+fmt(V1)+'/'+fmt(V2)+')^'+fmt(gm-1,3),'T₂ = '+fmt(T2,1)+' K'));}
    if(ct==='pav'){const V1=g('V1'),V2=g('V2');T2=T1*(V2/V1)**2;o.push(stp(n++,'Temperatura finală: p = aV ⇒ T ~ V²','T₂ = T₁·(V₂/V₁)² = '+fmt(T1,0)+'·('+fmt(V2)+'/'+fmt(V1)+')²','T₂ = '+fmt(T2,1)+' K'));}
    if(!(T2>0)) return bad('Completează toate câmpurile cu valori pozitive.');
    const dT=T2-T1,dU=nu*Cv*dT;
    o.push(stp(n++,'Variația energiei interne','ΔU = νC_V(T₂ − T₁) = '+fmt(nu)+'·'+fmt(Cv)+'·('+fmt(T2,1)+' − '+fmt(T1,1)+')','ΔU = '+fmt(dU,1)+' J'));
    if(ct==='izocora'){Qh=dU;o.push(stp(n++,'V = ct ⇒ fără lucru mecanic','L = 0','L = 0 J'));o.push(stp(n++,'Principiul I','Q = ΔU','Q = '+fmt(Qh,1)+' J ('+(Qh>0?'primită':'cedată')+')'));}
    if(ct==='izobara'){Lm=nu*R*dT;Qh=nu*Cp*dT;o.push(stp(n++,'Lucrul mecanic izobar','L = νR(T₂ − T₁) = '+fmt(nu)+'·8,31·'+fmt(dT,1),'L = '+fmt(Lm,1)+' J'));o.push(stp(n++,'Căldura izobară','Q = νC_p(T₂ − T₁)','Q = '+fmt(Qh,1)+' J ('+(Qh>0?'primită':'cedată')+')'));}
    if(ct==='adiabatica'){Lm=-dU;o.push(stp(n++,'Q = 0 ⇒ L = −ΔU','L = −('+fmt(dU,1)+')','L = '+fmt(Lm,1)+' J'));o.push(stp(n++,'Căldura','Adiabatic','Q = 0 J'));}
    if(ct==='pav'){Lm=nu*R*dT/2;Qh=dU+Lm;o.push(stp(n++,'Lucrul mecanic, n = −1','L = νR(T₂ − T₁)/(1 − n) = '+fmt(nu)+'·8,31·'+fmt(dT,1)+'/2','L = '+fmt(Lm,1)+' J'));o.push(stp(n++,'Principiul I','Q = ΔU + L','Q = '+fmt(Qh,1)+' J ('+(Qh>0?'primită':'cedată')+')'));}
  }
  $('#calc-steps').innerHTML=o.join('');
}

function probleme(arg){
  const pr=P.find(p=>p.id===arg);
  if(!pr){
    const only=subj(arg)?[arg]:isK(arg)?subjOfClass(arg.slice(1)).map(s=>s.id):null;
    view.innerHTML=`<h1>Probleme rezolvate</h1><p class="lead">Încearcă singur, apoi deschide pașii unul câte unul.</p>
    <div class="seg" role="group" aria-label="Clasă"><a href="#probleme" ${only?'':'aria-current="page"'}>Toate</a>${CLASE.map(c=>`<a href="#probleme-k${c.id}" ${arg==='k'+c.id?'aria-current="page"':''}>${c.t}</a>`).join('')}</div>`
    +SUBJ.filter(s=>!only||only.includes(s.id)).map(s=>{const ps=P.filter(p=>subjOf(p.ch)===s.id);return ps.length?`<section class="group"><div class="group-h"><h2>${s.t}</h2><span>${klass(s.cls).t} · ${ps.length} probleme</span></div><div class="cards">${ps.map(p=>`${row('#probleme-'+p.id,p.id.toUpperCase(),p.t,p.ask,L.find(l=>l.id===p.ch).t)}`).join('')}</div></section>`:'';}).join('');
    return;
  }
  const li=L.findIndex(l=>l.id===pr.ch);
  view.innerHTML=`<div class="crumbs"><a href="#probleme">Probleme</a><span>›</span><span>${pr.src}</span></div><h1>${pr.t}</h1>
   <div class="stack"><div class="sheet"><h2>Enunț</h2><p class="data">${pr.data}</p><p>${pr.ask}</p><a class="badge" href="#lectii-${li+1}">Teorie: ${L[li].t}</a></div>
   <div class="sheet"><h2>Rezolvare</h2><div class="steps" id="psteps"></div><div class="actions"><button class="btn" type="button" id="pnext">Arată pasul următor</button><button class="btn ghost" type="button" id="pall">Arată tot</button></div></div></div>`;
  let shown=0; const box=$('#psteps');
  const draw=()=>{box.innerHTML=pr.steps.slice(0,shown).map((s,k)=>stp(k+1,s[0],s[1],s[2])).join('')||'<p class="empty">Încearcă întâi singur. Apoi deschide pașii unul câte unul.</p>';$('#pnext').disabled=shown>=pr.steps.length;$('#pall').disabled=shown>=pr.steps.length;};
  $('#pnext').onclick=()=>{shown++;draw();}; $('#pall').onclick=()=>{shown=pr.steps.length;draw();}; draw();
}

/* ===== QUIZ ===== */
let qz=null, quizPreset='toate';
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
/* variantele de răspuns se amestecă la fiecare afișare, ca răspunsul corect să nu fie mereu pe aceeași poziție */
function mixQ(q){ const b=q[5]||q, idx=shuffle(b[2].map((_,k)=>k)); return [b[0],b[1],idx.map(k=>b[2][k]),idx.indexOf(b[3]),b[4],b]; }
function noteAnswer(q,ok){ const t=(q[5]||q)[1]; if(ok) delete progress.wrong[t]; else progress.wrong[t]=q[0]; saveP(); }
const wrongQ=()=>Q.filter(q=>progress.wrong[q[1]]);
const inScope=(ch,sel)=>sel==='toate'||(sel.indexOf('m:')===0?subjOf(ch)===sel.slice(2):sel.indexOf('k:')===0?subj(subjOf(ch)).cls===sel.slice(2):ch===sel);
const scopeOptions=(arr,chOf,word)=>`<option value="toate">Toate clasele (${arr.length} ${word})</option><optgroup label="Pe clase">${CLASE.map(c=>`<option value="k:${c.id}">${c.t} (${arr.filter(x=>subj(subjOf(chOf(x))).cls===c.id).length})</option>`).join('')}</optgroup>`+SUBJ.map(s=>`<optgroup label="${klass(s.cls).s} · ${s.t}"><option value="m:${s.id}">Tot capitolul: ${s.t} (${arr.filter(x=>subjOf(chOf(x))===s.id).length})</option>${lessonsOf(s.id).map(l=>`<option value="${l.id}">${sn(l)}. ${l.t} (${arr.filter(x=>chOf(x)===l.id).length})</option>`).join('')}</optgroup>`).join('');
function quiz(arg){
  if(subj(arg)) quizPreset='m:'+arg; else if(isK(arg)) quizPreset='k:'+arg.slice(1); else if(arg==='gresit') quizPreset='gresit';
  view.innerHTML=`<h1>Quiz liber</h1><p class="lead">Alege o lecție, un capitol, o clasă sau tot. Pentru testele cu notă de trecere mergi la finalul fiecărei lecții, al fiecărui modul și al fiecărui capitol.</p>
  <div class="sheet"><div class="row2"><div class="field"><label for="qch">Din ce</label><select id="qch">${wrongQ().length?`<option value="gresit">Greșelile mele (${wrongQ().length})</option>`:''}${scopeOptions(Q,q=>q[0],'întrebări')}</select></div>
  <div class="field"><label for="qn">Număr de întrebări</label><select id="qn"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="999">Toate</option></select></div></div>
  <button class="btn" type="button" id="qstart">Începe testul</button></div>
  <div class="sheet" id="qbox" style="margin-top:16px" hidden></div>`;
  $('#qch').value=quizPreset; if(!$('#qch').value) $('#qch').value='toate';
  $('#qstart').onclick=()=>{const ch=$('#qch').value; quizPreset=ch; const pool=ch==='gresit'?wrongQ():Q.filter(q=>inScope(q[0],ch)); $('#qbox').hidden=false;
    if(!pool.length){ $('#qbox').innerHTML='<p class="empty">Nu ai nicio întrebare greșită de reluat. Bravo!</p>'; return; }
    qz={ch,list:shuffle(pool.slice()).slice(0,+$('#qn').value).map(mixQ),i:0,score:0,wrong:[]}; qRender(); $('#qbox').scrollIntoView({behavior:'smooth',block:'start'});};
}

function qRender(){
  const box=$('#qbox'),z=qz;
  if(z.i>=z.list.length){
    const pct=Math.round(z.score/z.list.length*100);
    const byCh={}; z.list.forEach(q=>{byCh[q[0]]=byCh[q[0]]||[0,0];byCh[q[0]][1]++;if(!z.wrong.includes(q))byCh[q[0]][0]++;});
    Object.entries(byCh).forEach(([c,[a,b]])=>{progress.best[c]=Math.max(progress.best[c]||0,Math.round(a/b*100));}); saveP();
    box.innerHTML=`<h2>Scor: ${z.score} / ${z.list.length} (${pct}%)</h2><p>${pct>=80?'Foarte bine.':pct>=50?'Bine. Recitește explicațiile de mai jos.':'Mai repetă lecțiile, apoi încearcă din nou.'}</p>${testEnd(z,pct)}
    ${z.wrong.length?`<h3>De recitit</h3><ul>${z.wrong.map(q=>{const li=L.findIndex(l=>l.id===q[0]);return `<li>${esc(q[1])} <b>${esc(q[2][q[3]])}</b>. ${esc(q[4])} <a href="#lectii-${li+1}">(${L[li].t})</a></li>`;}).join('')}</ul>`:''}
    <div class="actions"><button class="btn" type="button" id="qagain">Încearcă din nou</button></div>`;
    $('#qagain').onclick=()=>{if(z.key){route();return;}z.list=shuffle(z.list).map(mixQ);z.i=0;z.score=0;z.wrong=[];qRender();}; return;
  }
  const q=z.list[z.i]; let done=false; const li=L.findIndex(l=>l.id===q[0]);
  box.innerHTML=`<div class="top"><span class="mono">Întrebarea ${z.i+1} / ${z.list.length} · ${L[li].t}</span><span class="mono">Scor ${z.score}</span></div><div class="meter" style="margin-bottom:14px"><i style="width:${z.i/z.list.length*100}%"></i></div>
   <div class="qtext">${esc(q[1])}</div><div class="opts">${q[2].map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="L">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="qafter"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return; done=true; const k=+b.dataset.k,ok=k===q[3]; if(ok)z.score++; else z.wrong.push(q); noteAnswer(q,ok);
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q[3])x.classList.add('right');}); if(!ok)b.classList.add('wrong');
    $('#qafter').innerHTML=`<div class="explain"><b>${ok?'Corect.':'Greșit.'}</b> ${esc(q[4])}</div><div class="actions"><button class="btn" type="button" id="qnext">${z.i+1<z.list.length?'Următoarea →':'Vezi scorul'}</button></div>`;
    $('#qnext').onclick=()=>{z.i++;qRender();}; $('#qnext').focus();
  });
}

function fcDraw(){

   <div class="face"><span class="tagl">Știi răspunsul?</span><div class="big">${esc(c.q)}</div><span class="hint">Apasă ca să vezi răspunsul</span></div>
   <div class="face back"><span class="tagl">${esc(c.q)}</span><div class="big" style="font-family:var(--mono);font-size:19px">${esc(c.a)}</div></div></div></div>
   <div class="actions"><button class="btn ghost" type="button" id="fprev">← Înapoi</button><button class="btn" type="button" id="fnext">Următorul →</button><button class="btn ghost" type="button" id="fmix">Amestecă</button></div>`;
  const card=$('#card'),flip=()=>card.classList.toggle('flip');
  card.onclick=flip; card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
  $('#fprev').onclick=()=>{s.i=(s.i-1+s.list.length)%s.list.length;fcDraw();};
  $('#fnext').onclick=()=>{s.i=(s.i+1)%s.list.length;fcDraw();};
  $('#fmix').onclick=()=>{shuffle(s.list);s.i=0;fcDraw();};
}

  <h2 class="rule">Înveți asta în lecțiile</h2>

  <div class="pager"><a href="#natura-${prev.id}"><small>← Fenomenul anterior</small>${prev.t}</a><a class="btn ghost" href="#natura" style="text-align:center">Toate fenomenele</a><a class="next" href="#natura-${next.id}"><small>Următorul →</small>${next.t}</a></div>`;

/* =====================================================================
   PREMIUM: lecții video și audio, deblocate cu un cod.

   Codul nu apare în fișier, doar amprenta lui SHA-256 (PREM_HASH).
   ===================================================================== */
const PREM_HASH='d5534931f099607ef0e49a833a0581a94f9733b19d742a2dc2dd6a7e94d6bc2f';
/* SHA-256 sincron (merge și unde crypto.subtle lipsește: file://, WebView-uri vechi) */
function sha256s(str){
  const r=(n,x)=>(x>>>n)|(x<<(32-n)); const K=[],H=[]; let p=2,c=0; const isP=n=>{for(let f=2;f*f<=n;f++)if(n%f===0)return false;return true;};
  while(c<64){ if(isP(p)){ if(c<8)H[c]=(Math.pow(p,1/2)*4294967296)|0; K[c]=(Math.pow(p,1/3)*4294967296)|0; c++; } p++; }
  const b=unescape(encodeURIComponent(str)), w=[], l=b.length*8; let i,j;
  for(i=0;i<b.length;i++) w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);
  w[l>>5]|=0x80<<(24-l%32); w[((l+64>>9)<<4)+15]=l;
  for(j=0;j<w.length;j+=16){ let a=H.slice(0); const W=[]; for(i=0;i<64;i++){
    if(i<16) W[i]=w[j+i]|0; else { const s0=r(7,W[i-15])^r(18,W[i-15])^(W[i-15]>>>3), s1=r(17,W[i-2])^r(19,W[i-2])^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)|0; }
    const t1=a[7]+(r(6,a[4])^r(11,a[4])^r(25,a[4]))+((a[4]&a[5])^(~a[4]&a[6]))+K[i]+W[i], t2=(r(2,a[0])^r(13,a[0])^r(22,a[0]))+((a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]));
    a=[(t1+t2)|0].concat(a); a[4]=(a[4]+t1)|0; a.pop(); }
    for(i=0;i<8;i++) H[i]=(H[i]+a[i])|0; }
  let o=''; for(i=0;i<8;i++) o+=('00000000'+(H[i]>>>0).toString(16)).slice(-8); return o;
}

const GREEK={'Δ':'delta ','α':'alfa','β':'beta','γ':'gama','δ':'delta','ε':'epsilon','η':'eta','θ':'teta','λ':'lambda','μ':'miu','ν':'niu','π':'pi','ρ':'ro','σ':'sigma','τ':'tau','φ':'fi','ω':'omega','Φ':'fi','Ω':' ohmi','ℓ':'l'};
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
const UNITS=[['m/s²',' metri pe secundă la pătrat'],['m/s','metri pe secundă'],['km/h','kilometri pe oră'],['rad/s','radiani pe secundă'],['kg/m³','kilograme pe metru cub'],['J/(kg·K)','jouli pe kilogram kelvin'],['J/(mol·K)','jouli pe mol kelvin'],['J/kg','jouli pe kilogram'],['J/mol','jouli pe mol'],['N/m','newtoni pe metru'],['J/s','jouli pe secundă'],['°C',' grade Celsius'],['kWh','kilowați oră']];
function say(s){
  s=' '+String(s)+' ';
  UNITS.forEach(([u,w])=>{ s=s.split(u).join(' '+w+' '); });
  const UW={nm:'nanometri',km:'kilometri',kg:'kilograme',kJ:'kilojouli',kHz:'kilohertzi',MHz:'megahertzi',Hz:'hertzi',eV:'electronvolți',μs:'microsecunde',cm:'centimetri',mm:'milimetri',mV:'milivolți',kV:'kilovolți',GW:'gigawați',MW:'megawați',kW:'kilowați',K:'kelvin',V:'volți',A:'amperi',W:'wați',J:'jouli',N:'newtoni',s:'secunde',m:'metri',Ω:'ohmi'};
  s=s.replace(/(\d)\s*(nm|km|kg|kJ|kHz|MHz|Hz|eV|μs|cm|mm|mV|kV|GW|MW|kW|K|V|A|W|J|N|s|m|Ω)(?![\wăâîșț])/g,(x,d,u)=>d+' '+UW[u]);
  s=s.replace(/([⁻]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>{ const neg=m[0]==='⁻', d=[...m.replace('⁻','')].map(c=>SUPD.indexOf(c)).join('');
      if(!neg&&d==='2') return ' la pătrat '; if(!neg&&d==='3') return ' la cub '; return ' la puterea '+(neg?'minus ':'')+d+' '; });
  s=s.replace(/\^(-?\d+)/g,(m,d)=>d==='2'?' la pătrat ':d==='3'?' la cub ':' la puterea '+d.replace('-','minus ')+' ');
  s=s.replace(/√\s*\(/g,' radical din (').replace(/√/g,' radical din ');
  s=s.replace(/[ΔαβγδεηθλμνπρστφωΦΩℓ]/g,c=>' '+(GREEK[c]||c)+' ');
  s=s.replace(/\s*[·×]\s*/g,' ori ').replace(/\s*≈\s*/g,' aproximativ egal cu ').replace(/\s*≠\s*/g,' diferit de ').replace(/\s*≤\s*/g,' mai mic sau egal cu ').replace(/\s*≥\s*/g,' mai mare sau egal cu ')
       .replace(/\s*[⇒→]\s*/g,', deci ').replace(/\s*∝\s*/g,' proporțional cu ').replace(/\s*=\s*/g,' egal ').replace(/\s+<\s+/g,' mai mic decât ').replace(/\s+>\s+/g,' mai mare decât ')
       .replace(/\s*−\s*/g,' minus ').replace(/\s*\+\s*/g,' plus ').replace(/(\S)\s*\/\s*(\S)/g,'$1 supra $2')
       .replace(/(\d)([a-zA-Z])/g,'$1 $2').replace(/(?<!\p{L})[b-df-hj-np-tv-zB-DF-HJ-NP-TV-Z]{2,4}(?!\p{L})/gu,w=>w.split('').join(' ')).replace(/°/g,' grade').replace(/[|]/g,' ').replace(/\s*;\s*/g,'. ').replace(/[_*#]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
const sentences=t=>String(t).replace(/\s+/g,' ').trim().split(/(?<=[.!?:])\s+(?=[A-ZĂÂÎȘȚ„(0-9])/).flatMap(x=>x.length>230?x.split(/(?<=[,;])\s+/):[x]).map(x=>x.trim()).filter(x=>x.length>1);

/* ---- scenariul unei lecții: slide-uri, blocuri și propoziții ---- */
function lessonScript(n){
  const l=L[n-1], g=grp(l.g), s=subj(g.m), c=klass(s.cls);
  const box=document.createElement('div');
  box.innerHTML=l.html.replace(/<sub>(.*?)<\/sub>/g,' $1').replace(/<sup>(.*?)<\/sup>/g,'^$1');
  const slides=[], segs=[];
  const addSlide=(o)=>{ o.blocks=o.blocks||[]; slides.push(o); return o; };
  const addBlock=(sl,type,html,texts)=>{ const b={type,html,segs:[]}; sl.blocks.push(b); (texts||[]).forEach(t=>{ const v=say(t); if(v) { b.segs.push(segs.length); segs.push({slide:slides.indexOf(sl),block:sl.blocks.length-1,say:v,show:t}); } }); return b; };
  const t0=addSlide({kind:'title',kick:`${c.t} · ${s.t}`,h:l.t,p:l.d});
  addBlock(t0,'p','',[`Lecția: ${l.t}.`,l.d.replace(/[.]?$/,'.')]);
  const br=addSlide({kind:'sec',kick:'Pe scurt',h:'Ce reții din lecție'});
  addBlock(br,'p','',['Pe scurt, iată ce trebuie să reții.']);
  l.brief.forEach(b=>addBlock(br,'li',esc(b),[b]));
  let cur=null, count=0;
  const sec=(h)=>{ cur=addSlide({kind:'sec',kick:s.t,h}); count=0; addBlock(cur,'hd','',[h.replace(/[.:]?$/,'.')]); };
  const room=()=>{ if(!cur) sec('Introducere'); else if(count>=5){ const h=cur.h.replace(/ \(continuare\)$/,''); cur=addSlide({kind:'sec',kick:s.t,h:h+' (continuare)'}); count=0; } count++; };
  [...box.childNodes].forEach(el=>{
    if(el.nodeType===3){ const t=el.textContent.trim(); if(t){ room(); addBlock(cur,'p',esc(t),sentences(t)); } return; }
    if(el.nodeType!==1) return;
    const tag=el.tagName, txt=el.textContent.replace(/\s+/g,' ').trim();
    if(/^H[2-4]$/.test(tag)){ sec(txt); return; }
    if(tag==='P'){ if(!txt) return; room(); addBlock(cur,'p',el.innerHTML,sentences(txt)); return; }
    if(tag==='UL'||tag==='OL'){ [...el.children].forEach(li=>{ const t=li.textContent.replace(/\s+/g,' ').trim(); if(!t) return; room(); addBlock(cur,'li',li.innerHTML,sentences(t)); }); return; }
    if(el.classList.contains('fx')){ room(); addBlock(cur,'fx',el.innerHTML,['Formula: '+txt]); return; }
    if(el.classList.contains('keep')){ room(); addBlock(cur,'keep',el.innerHTML,sentences('Reține! '+txt)); return; }
    const tb=el.tagName==='TABLE'?el:el.querySelector('table');
    if(tb){ room(); const rows=[...tb.querySelectorAll('tbody tr')].slice(0,8).map(tr=>[...tr.children].map(td=>td.textContent.trim()).filter(Boolean).join(': '));
      addBlock(cur,'tbl','<div class="tw">'+tb.outerHTML+'</div>',['Uită-te în tabel.',...rows.map(r=>r+'.')]); count+=1; return; }
    if(el.querySelector('svg,canvas,img')){ room(); addBlock(cur,'pic',el.outerHTML,txt?sentences(txt):['Uită-te la desen.']); return; }
    if(txt){ room(); addBlock(cur,'p',el.innerHTML,sentences(txt)); }
  });
  natOf(l.id).slice(0,2).forEach(sc=>{ const sl=addSlide({kind:'sec',kick:'În natură',h:sc.t});
    addBlock(sl,'pic nat',`<div class="nt-frame">${sc.svg}</div>`,[`Unde vezi asta în natură? ${sc.t}.`]);
    sentences(sc.txt).slice(0,3).forEach(t=>addBlock(sl,'p',esc(t),[t])); });
  const end=addSlide({kind:'end',kick:'Recapitulare',h:'Gata! Ai terminat lecția'});
  addBlock(end,'p','',[`Gata, asta a fost lecția ${l.t}.`,'Hai să recapitulăm.']);
  l.brief.forEach(b=>addBlock(end,'li','✓ '+esc(b),[b]));
  addBlock(end,'p','<span class="hint">Acum verifică-te cu testul lecției.</span>',['Acum verifică-te cu testul lecției. Succes!']);
  return {l,g,s,c,slides,segs};
}

const TTS={
  plug(){ const C=window.Capacitor; return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.TextToSpeech||null; },
  platform(){ const C=window.Capacitor; return C&&C.getPlatform?C.getPlatform():'web'; },
  web(){ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined'; },
  isRo:l=>/^ro([-_]|$)/i.test(l||''),
  list:null,
  /* vocile românești de pe dispozitiv: {id, label, idx(nativ), v(web), net} */
  async voices(force){
    if(this.list&&!force) return this.list;
    const P=this.plug(); let out=[];
    if(P){ try{ const r=await P.getSupportedVoices(); (r.voices||[]).forEach((v,idx)=>{ if(this.isRo(v.lang)) out.push({id:v.voiceURI||v.name,name:v.name||v.voiceURI,idx,net:v.localService===false}); }); }catch(e){} }
    else if(this.web()){
      if(!speechSynthesis.getVoices().length) await new Promise(r=>{ speechSynthesis.addEventListener('voiceschanged',r,{once:true}); setTimeout(r,1500); });
      speechSynthesis.getVoices().forEach(v=>{ if(this.isRo(v.lang)) out.push({id:v.voiceURI||v.name,name:v.name,v,net:v.localService===false}); });
    }
    /* nume prietenoase */
    const nice=(x,k)=>{ const n=String(x.name);
      if(/ioana|alina|emil|andrei|carmen/i.test(n)) return n.replace(/^Microsoft\s+/,'').replace(/\s*-\s*Romanian.*$/i,'').replace(/\(Enhanced\)|\(Premium\)/i,m=>/enh/i.test(m)?'(îmbunătățită)':'(premium)');
      if(/google/i.test(n)) return 'Google română';
      return 'Vocea '+(k+1); };
    out.forEach((x,k)=>{ x.label=nice(x,k)+(x.net?' · online, mai naturală':''); });
    out.sort((a,b)=>(b.net-a.net)||a.label.localeCompare(b.label));
    this.list=out; return out;
  },
  chosen(){ const id=store.get('pvoice',null), l=this.list||[]; return l.find(x=>x.id===id)||l[0]||null; },
  timer:0, done:null,
  speak(text,rate){
    const P=this.plug(), ch=this.chosen(), pitch=+store.get('ppitch',1)||1;
    if(P){ const o={text,lang:'ro-RO',rate:rate,pitch,volume:1,category:'playback'}; if(ch&&ch.idx>=0) o.voice=ch.idx; return P.speak(o).then(()=>true,()=>false); }
    if(this.web()){ return new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.lang='ro-RO'; if(ch&&ch.v) u.voice=ch.v; u.rate=rate; u.pitch=pitch;
        let fin=false; const end=ok=>{ if(fin) return; fin=true; clearTimeout(guard); res(ok); };
        u.onend=()=>end(true); u.onerror=()=>end(false);

        speechSynthesis.speak(u); }); }
    return new Promise(res=>{ this.done=res; this.timer=setTimeout(()=>{ this.done=null; res(true); },Math.max(1600,words(text)/2.6/rate*1000)); });
  },
  stop(){ const P=this.plug(); if(P){ try{ P.stop(); }catch(e){} return; } if(this.web()){ try{ speechSynthesis.cancel(); }catch(e){} return; } clearTimeout(this.timer); if(this.done){ const d=this.done; this.done=null; d(false); } },

function pmKill(){ if(pmPlayer){ pmPlayer.destroy(); pmPlayer=null; } }

function makePlayer(segs,{onSeg,onState,onEnd}){
  let i=0, playing=false, token=0, rate=+store.get('prate',1)||1;
  const run=async(my)=>{ while(playing&&my===token&&i<segs.length){ onSeg(i); await TTS.speak(segs[i].say,rate); if(my!==token||!playing) return; i++; }
    if(my===token&&i>=segs.length){ playing=false; onState(false); i=segs.length; onEnd&&onEnd(); } };
  const p={ owner:location.hash,
    get i(){ return i; }, get playing(){ return playing; }, get rate(){ return rate; },
    play(){ if(i>=segs.length) i=0; playing=true; onState(true); run(++token); },
    pause(){ playing=false; token++; TTS.stop(); onState(false); },
    toggle(){ playing?p.pause():p.play(); },
    seek(k){ k=Math.max(0,Math.min(segs.length-1,k)); const was=playing; token++; TTS.stop(); i=k; onSeg(i); if(was){ const my=++token; setTimeout(()=>run(my),80); } },
    setRate(r){ rate=r; store.set('prate',r); if(playing) p.seek(i); },
    destroy(){ playing=false; token++; TTS.stop(); }
  };
  return p;
}

  const h=location.hash.replace('#','')||'acasa', r=h.split('-')[0];
  sd.querySelectorAll('a.si').forEach(a=>{ const d=a.dataset.h; const on = d===h || (d===r&&!['clasa','bac'].includes(r)) || (r==='bac'&&d==='bac') || (r==='materie'&&d==='clasa-'+(subj(h.split('-')[1])||{}).cls) || (r==='lectii'&&(()=>{ const l=L[parseInt(h.split('-')[1],10)-1]; return l&&d==='clasa-'+subj(subjOfL(l)).cls; })());
    on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'); });
}
const progHero=(st,label)=>`<div class="prog"><div class="pc"><span>Lecții citite ${label}</span><b>${st.pct}%</b><span class="meter"><i style="width:${st.pct}%"></i></span><span>${st.r} din ${st.n} lecții</span></div><div class="pc"><span>Teste de lecție trecute</span><b>${st.tn?Math.round(st.tp/st.tn*100):0}%</b><span class="meter"><i style="width:${st.tn?Math.round(st.tp/st.tn*100):0}%"></i></span><span>${st.tp} din ${st.tn} teste, cu cel puțin ${PASS}%</span></div></div>`;
/* feedback animat la răspuns corect/greșit (teste, quiz, verifică-te pe loc) */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.opt'); if(!b||b.closest('.sbarea')) return;
  setTimeout(()=>{ const ok=b.classList.contains('right'), no=b.classList.contains('wrong'); if(!ok&&!no) return;
    document.querySelectorAll('.fbk').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='fbk '+(ok?'ok':'no'); t.setAttribute('role','status'); t.textContent=ok?'Corect! ✓':'Greșit, vezi explicația'; document.body.appendChild(t); setTimeout(()=>t.remove(),1200); },0); });

route();
})();
</script>
<script>
/* ===== integrare nativă (Capacitor: Android / iOS). În browser doar pornește modul offline. ===== */
(function(){
  var C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform()) {
    /* varianta web (iPhone „Adaugă pe ecran”): păstrează aplicația în telefon pentru folosire fără internet */
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
    return;
  }
  var P = C.Plugins || {}, App = P.App, SB = P.StatusBar, Splash = P.SplashScreen;
  var root = document.documentElement;
  root.classList.add('native', 'native-' + C.getPlatform());

  /* bara de stare: text deschis pe teme întunecate, text închis pe cele luminoase */
  function darkNow(){
    var t = root.getAttribute('data-theme');
    if (t) return ['dark','noapte','neon','cafea'].indexOf(t) >= 0;
    return matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function syncBars(){
    var bg = getComputedStyle(root).getPropertyValue('--sheet').trim() || (darkNow() ? '#14151b' : '#ffffff');
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', bg);
    if (!SB) return;
    try { SB.setStyle({ style: darkNow() ? 'DARK' : 'LIGHT' }); } catch(e){}
  }
  syncBars();
  new MutationObserver(syncBars).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBars);

  /* butonul „Înapoi” pe Android: închide întâi panourile deschise, apoi navighează înapoi, apoi iese */
  if (App && App.addListener) {
    App.addListener('backButton', function(ev){
      var tp = document.getElementById('tpanel'); if (tp) { tp.remove(); return; }
      var mn = document.getElementById('mnav');
      if (mn && mn.classList.contains('open')) { document.getElementById('burger').click(); return; }
      var dd = document.querySelector('.dd.open');
      if (dd) { document.body.click(); return; }
      var h = location.hash.replace('#','');
      if (ev && ev.canGoBack && h && h !== 'acasa') { history.back(); return; }
      if (h && h !== 'acasa') { location.hash = 'acasa'; return; }
      App.exitApp();
    });
  }

  /* ascunde ecranul de pornire după ce s-a desenat prima pagină */
  if (Splash && Splash.hide) requestAnimationFrame(function(){ setTimeout(function(){ try{ Splash.hide({ fadeOutDuration: 250 }); }catch(e){} }, 60); });
})();
</script>
