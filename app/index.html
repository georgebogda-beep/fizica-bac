  brief:['pV = νRT se scrie pentru fiecare stare a gazului.','Într-un amestec, presiunile parțiale se adună (Dalton).','La disociere crește numărul de particule: N(1 + α).'], html:`
<p>Ecuația de stare leagă cele patru mărimi ale unui gaz ideal. Scrie-o prima, pentru fiecare stare a gazului.</p>
<div class="fx big">pV = νRT = (m/μ)·RT = (N/N<sub>A</sub>)·RT</div>
<ul>
<li>R = 8,31 J/(mol·K); N<sub>A</sub> = 6,02·10²³ mol⁻¹; k = R/N<sub>A</sub> = 1,38·10⁻²³ J/K.</li>
<li>Formă cu concentrația n = N/V: <b>p = n·k·T</b>.</li>
<li>Pentru ν constant: <b>p₁V₁/T₁ = p₂V₂/T₂</b> (ecuația transformării generale).</li>
</ul>
<h3>Densitatea</h3>
<div class="fx">p = ρRT/μ  ⇒  ρ = pμ/(RT)</div>
<h3>Amestecuri de gaze</h3>
<ul>
<li>Numărul de moli se adună: ν = ν₁ + ν₂.</li>
<li><b>Legea lui Dalton:</b> p = p₁′ + p₂′. Presiunea parțială este presiunea pe care ar avea-o un component dacă ar ocupa singur tot volumul: p₁′V = ν₁RT.</li>
<li><b>Masa molară a amestecului:</b> m/μ<sub>a</sub> = m₁/μ₁ + m₂/μ₂, adică μ<sub>a</sub> = (m₁ + m₂)/(ν₁ + ν₂).</li>
</ul>
<h3>Disocierea (grad de disociere α)</h3>
<p>Din N molecule, αN se disociază, iar N(1 − α) rămân nedisociate.</p>
<ul>
<li>Moleculă biatomică → 2 atomi: N<sub>total</sub> = 2αN + N(1 − α) = <b>N(1 + α)</b>.</li>
<li>Ozon 2O₃ → 3O₂: din αN molecule O₃ ies 1,5αN molecule O₂, deci N<sub>total</sub> = N(1 + 0,5α).</li>
</ul>
<div class="fx">μ<sub>a</sub> = [(1 − α)μ<sub>O₃</sub> + 1,5α·μ<sub>O₂</sub>] / (1 + 0,5α)</div>
<div class="keep"><b>Truc:</b> scrie pV = (N/N<sub>A</sub>)RT înainte și după, apoi împarte ecuațiile. R, V și N<sub>A</sub> se simplifică și rămâne o ecuație în α.</div>` },
{ id:'cinetica', g:'baze', t:'Teoria cinetico-moleculară', d:'Grade de libertate, energia internă, viteza termică',
  brief:['Energia medie a unei molecule: (i/2)kT.','U = (i/2)νRT = (i/2)pV depinde doar de T la gazul ideal.','v_T = √(3RT/μ): gazele ușoare au molecule mai rapide.'], html:`
<p>Gazul ideal: molecule punctiforme, care nu interacționează decât prin ciocniri perfect elastice. Energia cinetică medie a unei molecule depinde doar de temperatură și de numărul de grade de libertate i.</p>
<div class="fx big">m₀·v̄²/2 = (i/2)·kT</div>
<div class="tw"><table><thead><tr><th>Gaz</th><th>i</th><th>C<sub>V</sub></th><th>C<sub>p</sub></th><th>γ</th></tr></thead><tbody>
<tr><td>Monoatomic (He, Ne, Ar)</td><td class="m">3</td><td class="m">3R/2</td><td class="m">5R/2</td><td class="m">5/3</td></tr>
<tr><td>Biatomic (O₂, N₂, H₂, aer)</td><td class="m">5</td><td class="m">5R/2</td><td class="m">7R/2</td><td class="m">7/5</td></tr>
<tr><td>Poliatomic</td><td class="m">6</td><td class="m">3R</td><td class="m">4R</td><td class="m">4/3</td></tr>
</tbody></table></div>
<h3>Presiunea, din punct de vedere molecular</h3>
<div class="fx">p = (1/3)·n·m₀·v̄² = (2/3)·n·ε̄<sub>c</sub></div>
<h3>Energia internă a gazului ideal</h3>
<div class="fx big">U = N·(i/2)·kT = (i/2)·νRT = (i/2)·pV = νC<sub>V</sub>T</div>
<ul><li>La gazul ideal U depinde doar de ν și T, nu și de V.</li><li>La aceleași p și V: U<sub>O₂</sub> = (5/3)·U<sub>He</sub>.</li></ul>
<h3>Viteza termică</h3>
<div class="fx big">v<sub>T</sub> = √(v̄²) = √(3RT/μ) = √(3p/ρ) = √(3kT/m₀)</div>
<ul>
<li>Raport între două gaze la aceeași temperatură: v<sub>T1</sub>/v<sub>T2</sub> = √(μ₂/μ₁).</li>
<li>Dacă se dau v<sub>T</sub>, p și m: ρ = 3p/v<sub>T</sub>², deci V = m·v<sub>T</sub>²/(3p).</li>
<li>Încălzire cu ΔT: Δv<sub>T</sub> = √(3R/μ)·(√(T + ΔT) − √T). Ridici la pătrat ca să scoți T.</li>
</ul>
<h3>Număr de molecule și volum propriu</h3>
<ul><li>N = pVN<sub>A</sub>/(RT).</li><li>Volumul unui atom (sferă de rază r): V₀ = 4πr³/3. Volumul tuturor moleculelor: N·V₀, mult mai mic decât al vasului.</li></ul>` },
{ id:'transformari', g:'energie', t:'Transformări simple și grafice', d:'Izotermă, izobară, izocoră; p = aV; cicluri', graph:'simple',
  brief:['Mărimea constantă dă o dreaptă paralelă cu o axă.','Dreapta prin O: izobară în V–T, izocoră în p–T.','În V–T, panta mai mare înseamnă presiune mai mică.'], html:`
<p>Pentru ν = constant, din pV/T = constant obții toate legile. Graficul îți spune ce mărime rămâne constantă.</p>
<div class="tw"><table><thead><tr><th>Transformare</th><th>Constant</th><th>Lege</th><th>p–V</th><th>p–T</th><th>V–T</th></tr></thead><tbody>
<tr><td>Izotermă (Boyle-Mariotte)</td><td class="m">T</td><td class="m">p₁V₁ = p₂V₂</td><td>hiperbolă</td><td>verticală</td><td>verticală</td></tr>
<tr><td>Izobară (Gay-Lussac)</td><td class="m">p</td><td class="m">V₁/T₁ = V₂/T₂</td><td>orizontală</td><td>orizontală</td><td>dreaptă prin O</td></tr>
<tr><td>Izocoră (Charles)</td><td class="m">V</td><td class="m">p₁/T₁ = p₂/T₂</td><td>verticală</td><td>dreaptă prin O</td><td>orizontală</td></tr>
</tbody></table></div>
<ul>
<li>În p–ρ, izoterma este o dreaptă prin origine (p = ρRT/μ).</li>
<li>În V–T, o dreaptă prin origine este izobară; <b>panta mai mare înseamnă presiune mai mică</b>. În p–T, panta mai mare înseamnă volum mai mic.</li>
<li>Ciclu desenat ca un cerc în V–T: p<sub>max</sub> și p<sub>min</sub> sunt în punctele unde dreptele prin origine ating cercul (tangentele din O).</li>
</ul>
<h3>Transformarea p = aV</h3>
<div class="fx">p₂/p₁ = V₂/V₁ ;  p² = aνRT  ⇒  p₂²/p₁² = V₂²/V₁² = T₂/T₁</div>
<p>Exemplu: V₂ = 2V₁ dă p₂ = 2p₁ și T₂ = 4T₁.</p>
<h3>Ciclu dreptunghiular (două izocore și două izobare)</h3>
<p>Dacă stările 2 și 4 sunt pe aceeași izotermă, temperatura din colțul intermediar este media geometrică:</p>
<div class="fx">T₂ = √(T₁·T₃)</div>
<div class="keep"><b>Exersează:</b> redesenează același ciclu în p–V, V–T, p–T și p–ρ. Folosește Simulatorul ca să verifici forma.</div>` },
{ id:'lucru', g:'energie', t:'Lucrul mecanic', d:'L = pΔV, aria de sub grafic, semne, cicluri', graph:'area',
  brief:['L = aria de sub grafic în p–V.','Destindere: L > 0; comprimare: L < 0; izocor: L = 0.','Pe ciclu, L = aria închisă (pozitiv în sens orar).'], html:`
<p>Lucrul mecanic depinde de drum: este o mărime de <b>proces</b>. În coordonate p–V este egal numeric cu aria de sub grafic.</p>
<div class="fx">L<sub>AB</sub> = F·d·cos α  (α &lt; 90°: L &gt; 0 motor · α &gt; 90°: L &lt; 0 rezistent · α = 90°: L = 0)</div>
<div class="fx big">L = p·(V<sub>f</sub> − V<sub>i</sub>) = p·ΔV  (p = ct) ;  L = ∫p·dV  (general)</div>
<div class="tw"><table><thead><tr><th>Situație</th><th>Semn</th><th>Ce înseamnă</th></tr></thead><tbody>
<tr><td>Destindere (V<sub>f</sub> &gt; V<sub>i</sub>)</td><td class="m">L &gt; 0</td><td>Gazul efectuează lucru asupra mediului: câștigă volum, pierde energie.</td></tr>
<tr><td>Comprimare (V<sub>f</sub> &lt; V<sub>i</sub>)</td><td class="m">L &lt; 0</td><td>Mediul efectuează lucru asupra gazului: pierde volum, primește energie.</td></tr>
<tr><td>Izocor (V = ct)</td><td class="m">L = 0</td><td>Pistonul nu se mișcă.</td></tr>
</tbody></table></div>
<ul>
<li>Sistemul nu poate câștiga simultan și volum, și energie sub formă de lucru mecanic.</li>
<li><b>Ciclu:</b> L<sub>ciclu</sub> = aria din interiorul ciclului; pozitiv în sens orar, negativ în sens trigonometric.</li>
<li>Între aceleași stări 1 și 2, pe drumuri diferite, lucrurile mecanice diferă: L<sub>1a2</sub> ≠ L<sub>1b2</sub>.</li>
<li>Pentru p = aV²: L = a(V₂³ − V₁³)/3. Pentru p = aV: L = aria trapezului = (p₁ + p₂)(V₂ − V₁)/2.</li>
</ul>` },
{ id:'principiu', g:'energie', t:'Energia internă și Principiul I', d:'U mărime de stare, Q = ΔU + L, sisteme',
  brief:['Q = ΔU + L: căldura merge în energie internă și lucru.','U e mărime de stare; L și Q sunt mărimi de proces.','Pe ciclu ΔU = 0, deci Q = L.'], html:`
<p>Principiul I: căldura primită merge în creșterea energiei interne plus lucrul mecanic efectuat.</p>
<div class="fx big">Q = ΔU + L  (ΔU = Q − L)</div>
<h3>Noțiuni de bază</h3>
<ul>
<li><b>Sistem termodinamic (ST)</b> și <b>mediu exterior (ME)</b> schimbă masă și/sau energie, sub formă de lucru mecanic L sau de căldură Q.</li>
<li>ST <b>izolat</b>: nu schimbă nici masă, nici energie. <b>Închis</b>: nu schimbă masă, schimbă energie. <b>Deschis</b>: schimbă și masă, și energie.</li>
<li><b>Energia internă</b> U = E<sub>c,int</sub> + E<sub>p,int</sub> = f(ν, T, V). E<sub>c</sub> depinde de ν și T; E<sub>p</sub> vine din interacțiunile electrice dintre molecule și depinde de ν și V. La gazul ideal E<sub>p</sub> = 0, deci U = f(ν, T).</li>
<li><b>U este mărime de stare:</b> ΔU = U₂ − U₁ nu depinde de drum. <b>L și Q sunt mărimi de proces.</b></li>
</ul>
<h3>Convenția de semne</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>&gt; 0</th><th>&lt; 0</th></tr></thead><tbody>
<tr><td class="m">Q</td><td>căldură primită de ST de la ME</td><td>căldură cedată de ST</td></tr>
<tr><td class="m">L</td><td>efectuat de ST (destindere)</td><td>efectuat de ME asupra ST (comprimare)</td></tr>
<tr><td class="m">ΔU</td><td>T crește</td><td>T scade</td></tr>
</tbody></table></div>
<h3>Consecințe</h3>
<ul>
<li>Doar lucru (Q = 0, adiabatic): ΔU = −L. Dacă gazul se destinde, U scade.</li>
<li>Doar căldură (L = 0, izocor): ΔU = Q.</li>
<li><b>Ciclu:</b> U<sub>f</sub> = U<sub>i</sub>, deci ΔU = 0 și Q = L.</li>
<li><b>Perpetuum mobile de speța I este imposibil:</b> un dispozitiv ciclic nu poate produce mai mult lucru mecanic decât căldura absorbită.</li>
<li>Excepție: în adiabatică L = −ΔU, deci acolo L nu depinde de drum.</li>
<li><b>Înveliș adiabatic:</b> nu se schimbă căldură cu exteriorul; dacă nici lucru nu se face, U<sub>inițial</sub> = U<sub>final</sub> pentru tot sistemul.</li>
</ul>` },
{ id:'calorici', g:'energie', t:'Coeficienți calorici', d:'C, c, C_μ; relația Robert-Mayer; γ',
  brief:['C = Q/ΔT, c = Q/(mΔT), C_μ = Q/(νΔT).','Robert-Mayer: C_p = C_V + R.','γ = C_p/C_V = (i + 2)/i.'], html:`
<p>Trei coeficienți leagă căldura de variația temperaturii; diferă doar prin ce pui la numitor.</p>
<div class="tw"><table><thead><tr><th>Coeficient</th><th>Definiție</th><th>Unitate</th><th>Semnificație</th></tr></thead><tbody>
<tr><td>Capacitate calorică C</td><td class="m">C = Q/ΔT</td><td class="m">J/K</td><td>Q pentru 1 K, la tot corpul (caracteristică corpului)</td></tr>
<tr><td>Căldură specifică c</td><td class="m">c = Q/(mΔT)</td><td class="m">J/(kg·K)</td><td>Q pentru 1 kg și 1 K (caracteristică substanței)</td></tr>
<tr><td>Căldură molară C<sub>μ</sub></td><td class="m">C<sub>μ</sub> = Q/(νΔT)</td><td class="m">J/(mol·K)</td><td>Q pentru 1 mol și 1 K</td></tr>
</tbody></table></div>
<ul><li>Legături: C = m·c ; C<sub>μ</sub> = μ·c.</li><li>Căldură schimbată la V = ct → C<sub>V</sub>, c<sub>V</sub>; la p = ct → C<sub>p</sub>, c<sub>p</sub>.</li></ul>
<h3>Relația Robert-Mayer</h3>
<div class="fx big">C<sub>p</sub> = C<sub>V</sub> + R ;  c<sub>p</sub> = c<sub>V</sub> + R/μ ;  C<sub>V</sub> = (i/2)·R</div>
<ul><li>C<sub>p</sub> &gt; C<sub>V</sub>: la presiune constantă gazul mai face și lucru mecanic.</li></ul>
<div class="fx big">γ = C<sub>p</sub>/C<sub>V</sub> = (i + 2)/i &gt; 1</div>
<h3>Amestec de gaze</h3>
<div class="fx">C<sub>V,amestec</sub> = (ν₁C<sub>V1</sub> + ν₂C<sub>V2</sub>)/(ν₁ + ν₂)</div>` },
{ id:'tabel', g:'energie', t:'Q, L, ΔU pe transformări', d:'Tabelul de învățat pe de rost',
  brief:['ΔU = νC_VΔT în orice transformare.','Izoterm: ΔU = 0, Q = L. Adiabatic: Q = 0, L = −ΔU.','Izobar: Q = νC_pΔT; izocor: Q = νC_VΔT.'], html:`
<p>ΔU se calculează la fel în orice transformare; diferă doar L și Q. Patru forme echivalente:</p>
<div class="fx big">ΔU = νC<sub>V</sub>(T₂ − T₁) = (C<sub>V</sub>/R)(p₂V₂ − p₁V₁) = (p₂V₂ − p₁V₁)/(γ − 1) = m·c<sub>V</sub>(T₂ − T₁)</div>
<div class="tw"><table><thead><tr><th>Transformare</th><th>ΔU</th><th>L</th><th>Q</th></tr></thead><tbody>
<tr><td>Izocoră</td><td class="m">νC<sub>V</sub>ΔT</td><td class="m">0</td><td class="m">Q = ΔU</td></tr>
<tr><td>Izobară</td><td class="m">νC<sub>V</sub>ΔT</td><td class="m">p(V₂ − V₁) = νRΔT</td><td class="m">νC<sub>p</sub>ΔT</td></tr>
<tr><td>Izotermă</td><td class="m">0</td><td class="m">νRT·ln(V₂/V₁) = νRT·ln(p₁/p₂)</td><td class="m">Q = L</td></tr>
<tr><td>Adiabatică</td><td class="m">νC<sub>V</sub>ΔT</td><td class="m">−ΔU = (p₁V₁ − p₂V₂)/(γ − 1)</td><td class="m">0</td></tr>
<tr><td>Politropă</td><td class="m">νC<sub>V</sub>ΔT</td><td class="m">(p₂V₂ − p₁V₁)/(1 − n)</td><td class="m">νCΔT</td></tr>
<tr><td>Ciclu</td><td class="m">0</td><td class="m">aria ciclului</td><td class="m">Q = L</td></tr>
</tbody></table></div>
<h3>Izoterma: de unde vine logaritmul</h3>
<div class="fx">L = ∫ (νRT/V)·dV = νRT·ln(V₂/V₁)</div>
<ul><li>Destindere izotermă: L &gt; 0, Q &gt; 0 (primește căldură).</li><li>Comprimare izotermă: L &lt; 0, Q &lt; 0 (cedează căldură).</li></ul>
<div class="keep"><b>Ciclu pe etape:</b> calculezi Q, L, ΔU pe fiecare etapă, apoi verifici că ΔU total = 0. Folosește pV = νRT ca să înlocuiești νT cu pV/R.</div>` },
{ id:'adiabatica', g:'energie', t:'Transformarea adiabatică', d:'Poisson, L = −ΔU, răcire la destindere', graph:'adiab',
  brief:['pV^γ = ct, TV^(γ−1) = ct.','La destindere adiabatică gazul se răcește.','În p–V adiabata e mai abruptă decât izoterma.'], html:`
<p>Adiabatic înseamnă fără schimb de căldură (Q = 0): fie gazul e într-un înveliș adiabatic, fie procesul e foarte rapid (destindere sau comprimare bruscă), pentru că gazul are inerție termică.</p>
<div class="fx big">pV<sup>γ</sup> = ct ;  TV<sup>γ−1</sup> = ct ;  T·p<sup>(1−γ)/γ</sup> = ct</div>
<div class="fx">p·ρ<sup>−γ</sup> = ct ;  T·ρ<sup>1−γ</sup> = ct</div>
<ul>
<li>Celelalte forme se obțin înlocuind p = νRT/V în pV<sup>γ</sup> = ct, respectiv V = m/ρ.</li>
<li>Demonstrație: 0 = dU + dL = νC<sub>V</sub>dT + p·dV; împarți la νRT, integrezi și obții ln(T₂/T₁) = −(R/C<sub>V</sub>)·ln(V₂/V₁).</li>
</ul>
<div class="fx big">Q = 0  ⇒  L = −ΔU = (p₁V₁ − p₂V₂)/(γ − 1)</div>
<ul>
<li><b>Destindere adiabatică</b> (L &gt; 0): T₂ &lt; T₁, gazul se <b>răcește</b>.</li>
<li><b>Comprimare adiabatică</b> (L &lt; 0): T₂ &gt; T₁, gazul se <b>încălzește</b> (pompa de bicicletă, motorul Diesel).</li>
<li>În p–V adiabata este <b>mai abruptă</b> decât izoterma prin același punct: la destindere p scade și pentru că V crește, și pentru că T scade.</li>
<li>γ − 1 = 2/i: 0,67 monoatomic, 0,4 biatomic, 0,33 poliatomic.</li>
</ul>` },
{ id:'politropa', g:'energie', t:'Transformarea politropă', d:'pVⁿ = ct, indice politropic, L și Q',
  brief:['pVⁿ = ct cuprinde toate transformările.','n = (C − C_p)/(C − C_V).','L = (p₂V₂ − p₁V₁)/(1 − n), pentru n ≠ 1.'], html:`
<p>Politropa este forma generală: transformările de mai sus sunt cazuri particulare ale lui pV<sup>n</sup> = ct.</p>
<div class="fx big">pV<sup>n</sup> = ct ;  TV<sup>n−1</sup> = ct ;  T·p<sup>(1−n)/n</sup> = ct</div>
<div class="tw"><table><thead><tr><th>n</th><th>Transformare</th><th>C</th></tr></thead><tbody>
<tr><td class="m">0</td><td>izobară</td><td class="m">C<sub>p</sub></td></tr><tr><td class="m">1</td><td>izotermă</td><td class="m">∞</td></tr><tr><td class="m">γ</td><td>adiabatică</td><td class="m">0</td></tr><tr><td class="m">±∞</td><td>izocoră</td><td class="m">C<sub>V</sub></td></tr><tr><td class="m">−1</td><td>p = aV</td><td class="m">C<sub>V</sub> + R/2</td></tr>
</tbody></table></div>
<div class="fx big">n = (C − C<sub>p</sub>)/(C − C<sub>V</sub>)  ⇔  C = C<sub>V</sub> − R/(n − 1)</div>
<div class="fx big">L = (p₂V₂ − p₁V₁)/(1 − n) = νR(T₂ − T₁)/(1 − n) ;  Q = νCΔT = ΔU + L</div>
<ul><li>Pentru n = γ formula dă exact lucrul mecanic adiabatic.</li><li>Pentru n = 1 formula nu merge (împărțire la 0): folosește izoterma, L = νRT·ln(V<sub>f</sub>/V<sub>i</sub>).</li></ul>` },
{ id:'calorimetrie', g:'motoare', extra:true, t:'Calorimetrie și schimbări de stare', d:'Q = mcΔT, ecuația calorimetrică, căldura latentă', graph:'heating',
  brief:['Q = mcΔT pentru încălzire, Q = mλ pentru schimbarea stării.','Ecuația calorimetrică: Q primit = |Q cedat|.','În timpul topirii sau fierberii temperatura rămâne constantă.'], html:`
<p>Calorimetria studiază schimbul de căldură între corpuri până ajung la echilibru termic.</p>
<div class="fx big">Q = m·c·Δt = C·Δt</div>
<h3>Ecuația calorimetrică</h3>
<p>Într-un sistem izolat, căldura primită de corpurile reci este egală cu căldura cedată de corpurile calde:</p>
<div class="fx big">Q<sub>primit</sub> = |Q<sub>cedat</sub>|  ⇔  m₁c₁(θ − t₁) = m₂c₂(t₂ − θ)</div>
<p>Pentru două corpuri fără schimbare de stare, temperatura de echilibru este:</p>
<div class="fx">θ = (m₁c₁t₁ + m₂c₂t₂)/(m₁c₁ + m₂c₂)</div>
<p>Dacă și calorimetrul (capacitate C<sub>cal</sub>) se încălzește, îl adaugi la cei care primesc sau cedează căldură.</p>
<h3>Schimbări de stare de agregare</h3>
<div class="fx big">Q = m·λ</div>
<ul>
<li><b>λ</b> = căldura latentă specifică (J/kg): de topire λ<sub>t</sub>, de vaporizare λ<sub>v</sub>.</li>
<li>În timpul topirii, solidificării, fierberii sau condensării, <b>temperatura rămâne constantă</b>; căldura schimbă doar starea.</li>
<li>Topire și vaporizare: corpul primește căldură. Solidificare și condensare: cedează aceeași cantitate.</li>
</ul>
<div class="tw"><table><thead><tr><th>Valori uzuale (apă)</th><th>Valoare</th></tr></thead><tbody>
<tr><td>c apă</td><td class="m">4180 J/(kg·K)</td></tr>
<tr><td>c gheață</td><td class="m">2100 J/(kg·K)</td></tr>
<tr><td>λ topire gheață</td><td class="m">3,34·10⁵ J/kg</td></tr>
<tr><td>λ vaporizare apă (100 °C)</td><td class="m">2,26·10⁶ J/kg</td></tr>
</tbody></table></div>
<div class="keep"><b>Metodă:</b> verifică întâi dacă căldura cedată de corpul cald ajunge să topească toată gheața. Dacă nu ajunge, echilibrul este la 0 °C, cu gheață netopită.</div>` },
{ id:'principiul2', g:'motoare', extra:true, t:'Principiul II și motoare termice', d:'Randament, ciclul Carnot, Otto, Diesel', graph:'carnot',
  brief:['Un motor termic are nevoie de o sursă caldă și una rece.','η = L/Q_p = 1 − |Q_c|/Q_p < 1.','Ciclul Carnot are randamentul maxim: η = 1 − T_r/T_c.'], html:`
<p>Principiul I spune că energia se conservă. Principiul II spune <b>în ce sens</b> pot avea loc transformările: căldura nu se transformă integral în lucru mecanic.</p>
<h3>Formulări</h3>
<ul>
<li><b>Kelvin:</b> nu se poate construi un motor care, funcționând ciclic, să transforme integral în lucru mecanic căldura primită de la o singură sursă (perpetuum mobile de speța a II-a este imposibil).</li>
<li><b>Clausius:</b> căldura nu trece spontan de la un corp rece la un corp cald.</li>
</ul>
<h3>Motorul termic</h3>
<p>Primește Q<sub>p</sub> de la sursa caldă (T<sub>c</sub>), efectuează L și cedează |Q<sub>c</sub>| sursei reci (T<sub>r</sub>). Pe un ciclu ΔU = 0, deci L = Q<sub>p</sub> − |Q<sub>c</sub>|.</p>
<div class="fx big">η = L/Q<sub>p</sub> = 1 − |Q<sub>c</sub>|/Q<sub>p</sub></div>
<h3>Ciclul Carnot</h3>
<p>Două izoterme (la T<sub>c</sub> și T<sub>r</sub>) și două adiabate. Are cel mai mare randament posibil între aceleași două temperaturi:</p>
<div class="fx big">η<sub>Carnot</sub> = 1 − T<sub>r</sub>/T<sub>c</sub></div>
<ul><li>Temperaturile se pun în <b>kelvin</b>.</li><li>Orice motor real între aceleași temperaturi are η &lt; η<sub>Carnot</sub>.</li><li>Pentru Carnot: |Q<sub>c</sub>|/Q<sub>p</sub> = T<sub>r</sub>/T<sub>c</sub>.</li></ul>
<h3>Motorul Otto (cu aprindere prin scânteie)</h3>
<p>Două adiabate și două izocore. ε = V<sub>max</sub>/V<sub>min</sub> este raportul de compresie.</p>
<div class="fx big">η<sub>Otto</sub> = 1 − 1/ε<sup>γ−1</sup></div>
<h3>Motorul Diesel</h3>
<p>Două adiabate, o izobară (arderea) și o izocoră. ρ = V₃/V₂ este raportul de destindere prealabilă.</p>
<div class="fx">η<sub>Diesel</sub> = 1 − (ρ<sup>γ</sup> − 1)/[γ·ε<sup>γ−1</sup>·(ρ − 1)]</div>
<h3>Mașina frigorifică</h3>
<p>Funcționează invers: primește lucru mecanic și scoate căldură de la sursa rece. Eficiența: e = Q<sub>r</sub>/|L|.</p>` },
{ id:'randament', g:'motoare', extra:true, t:'Randamentul unui ciclu', d:'Cum găsești căldura primită pe un ciclu oarecare',
  brief:['Q_p = suma căldurilor pozitive, etapă cu etapă.','L_ciclu = suma lucrurilor = aria ciclului.','Verifică: ΔU total = 0 și η < η_Carnot.'], html:`
<p>La BAC, ciclurile sunt formate din transformări simple. Randamentul îl afli etapă cu etapă.</p>
<ol>
<li>Calculează p, V, T în fiecare stare (ecuația de stare și legile transformărilor).</li>
<li>Pe fiecare etapă calculează Q cu tabelul: νC<sub>V</sub>ΔT, νC<sub>p</sub>ΔT, νRT·ln(V<sub>f</sub>/V<sub>i</sub>) sau 0.</li>
<li><b>Q<sub>p</sub> = suma căldurilor pozitive</b>; |Q<sub>c</sub>| = suma valorilor absolute ale celor negative.</li>
<li>L<sub>ciclu</sub> = Q<sub>p</sub> − |Q<sub>c</sub>| (sau direct aria ciclului).</li>
<li>η = L<sub>ciclu</sub>/Q<sub>p</sub>.</li>
</ol>
<h3>Cum vezi semnul lui Q pe fiecare etapă</h3>
<div class="tw"><table><thead><tr><th>Etapă</th><th>Q &gt; 0 (primit) când…</th></tr></thead><tbody>
<tr><td>Izocoră</td><td>p crește (încălzire)</td></tr>
<tr><td>Izobară</td><td>V crește (destindere)</td></tr>
<tr><td>Izotermă</td><td>V crește (destindere)</td></tr>
<tr><td>Adiabatică</td><td>niciodată (Q = 0)</td></tr>
</tbody></table></div>
<div class="keep"><b>Verificări rapide:</b> ΔU pe tot ciclul trebuie să iasă 0; randamentul trebuie să fie mai mic decât al unui ciclu Carnot între T<sub>max</sub> și T<sub>min</sub> ale ciclului.</div>
<p>Exemplu complet: problema <a href="#probleme-p10">randamentul ciclului 18.32</a>.</p>` },
{ id:'probleme', g:'recap', t:'Tipuri de probleme', d:'Pistoane, cilindri, amestecuri, gaz care iese',
  brief:['Echilibrul pistonului + pV = νRT pentru fiecare gaz.','Împarte ecuațiile ca să dispară R și ν.','Totul în SI înainte de calcul.'], html:`
<p>Aproape toate se rezolvă cu același plan: echilibrul forțelor pe piston + pV = νRT pentru fiecare gaz și stare + ce rămâne constant.</p>
<ol>
<li><b>Piston vertical cu masă M:</b> echilibrul dă presiunea gazului, care rămâne constantă la încălzire (izobar).<div class="fx">p<sub>g</sub>S = p₀S + Mg  ⇒  p<sub>g</sub> = p₀ + Mg/S</div></li>
<li><b>Cilindru împărțit de un piston mobil:</b> la echilibru presiunile sunt egale de o parte și de alta; ν e constant în fiecare compartiment. Cu deplasarea x, volumele devin (L/2 − x)S și (L/2 + x)S; împarți ecuațiile de stare ca să scoți x.</li>
<li><b>Două pistoane legate cu o tijă:</b> echilibrul pe fiecare piston (p₁S₁ = p₀S₁ + R, p₂S₂ = p₀S₂ + R) dă (p₁ − p₀)S₁ = (p₂ − p₀)S₂. Rezultat tipic: ΔT₁S₁ = ΔT₂S₂.</li>
<li><b>Perete permeabil:</b> unul dintre gaze trece prin perete în proporție f; folosește presiunile parțiale (Dalton) în fiecare compartiment.</li>
<li><b>Două gaze în înveliș adiabatic:</b> U<sub>i</sub> = U<sub>f</sub>, deci temperatura finală e o medie ponderată.<div class="fx">T = (i₁ν₁T₁ + i₂ν₂T₂)/(i₁ν₁ + i₂ν₂)</div></li>
<li><b>Gaz care iese din vas sau cameră:</b> la p și V constante, U = (C<sub>V</sub>/R)·pV nu se schimbă când încălzești camera; se schimbă doar masa.<div class="fx">Δm = (p₀Vμ/R)·(1/T₁ − 1/T₂)</div></li>
<li><b>Vas care explodează:</b> scrii p₁ − p₂ = Δp cu ambele presiuni din pV = νRT și scoți temperatura.</li>
<li><b>Tub cu coloană de mercur:</b> presiunea gazului = p₀ ± ρgh (după cum coloana apasă sau nu pe gaz); la răsturnare T = ct, deci p₁V₁ = p₂V₂.</li>
<li><b>Procente:</b> la izobară, (T₂ − T₁)/T₁ = V₂/V₁ − 1 (ex. V₂/V₁ = 5/4 → T crește cu 25%).</li>
</ol>
<div class="keep"><b>Sfaturi:</b> notează stările 1, 2, 3; scrie ce e constant pe fiecare etapă; împarte ecuațiile ca să dispară R și ν; transformă în SI (cm → m, L → m³, °C → K, g/mol → kg/mol).</div>` }
];
const L_MEC = [
{ id:'m-marimi', g:'mcin', t:'Mărimi fizice și vectori', d:'Scalari, vectori, compunere, unități SI',
  brief:['Mărimile vectoriale au modul, direcție și sens.','Vectorii se adună cu regula paralelogramului; pe axe se adună proiecțiile.','Înainte de calcul treci totul în SI: 36 km/h = 10 m/s.'], html:`
<p>În mecanică lucrezi cu două feluri de mărimi. Cele <b>scalare</b> au doar valoare (masa, timpul, energia, puterea). Cele <b>vectoriale</b> au modul, direcție și sens (viteza, accelerația, forța, impulsul, deplasarea).</p>
<h3>Compunerea a doi vectori</h3>
<div class="fx big">R² = a² + b² + 2ab·cos α</div>
<div class="tw"><table><thead><tr><th>Caz</th><th>Rezultanta</th></tr></thead><tbody>
<tr><td>Același sens (α = 0°)</td><td class="m">R = a + b</td></tr>
<tr><td>Sensuri opuse (α = 180°)</td><td class="m">R = |a − b|</td></tr>
<tr><td>Perpendiculari (α = 90°)</td><td class="m">R = √(a² + b²)</td></tr>
</tbody></table></div>
<h3>Descompunerea pe axe</h3>
<div class="fx">F<sub>x</sub> = F·cos α ;  F<sub>y</sub> = F·sin α  (α = unghiul cu axa Ox)</div>
<p>Pe fiecare axă aduni proiecțiile cu semn: plus în sensul axei, minus invers.</p>
<h3>Unități de măsură</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Unitate SI</th><th>Legătură</th></tr></thead><tbody>
<tr><td>Viteză</td><td class="m">m/s</td><td class="m">1 km/h = 1/3,6 m/s</td></tr>
<tr><td>Accelerație</td><td class="m">m/s²</td><td></td></tr>
<tr><td>Forță</td><td class="m">N</td><td class="m">1 N = 1 kg·m/s²</td></tr>
<tr><td>Lucru mecanic, energie</td><td class="m">J</td><td class="m">1 J = 1 N·m ; 1 kWh = 3,6·10⁶ J</td></tr>
<tr><td>Putere</td><td class="m">W</td><td class="m">1 W = 1 J/s ; 1 CP ≈ 736 W</td></tr>
<tr><td>Impuls</td><td class="m">kg·m/s</td><td class="m">= N·s</td></tr>
</tbody></table></div>
<div class="keep"><b>De reținut:</b> din km/h în m/s împarți la 3,6 (72 km/h = 20 m/s). Din g în kg împarți la 1000, din cm în m la 100.</div>` },
{ id:'m-cin', g:'mcin', t:'Mișcarea: viteză și accelerație', d:'MRU, MRUV, grafice, mișcare pe verticală', graph:'mruv',
  brief:['MRU: x = x₀ + vt. MRUV: v = v₀ + at, x = x₀ + v₀t + at²/2.','Galilei: v² = v₀² + 2a·Δx, când nu se dă timpul.','În graficul v(t), panta este accelerația, iar aria este deplasarea.'], html:`
<p>Mișcarea se descrie față de un <b>sistem de referință</b>. Traiectoria este linia descrisă de mobil. <b>Deplasarea</b> este vectorul dintre poziția inițială și cea finală; <b>distanța</b> este lungimea drumului parcurs.</p>
<h3>Viteza și accelerația</h3>
<div class="fx big">v<sub>m</sub> = Δx/Δt ;  a = Δv/Δt</div>
<ul>
<li>Viteza medie pe tot drumul = distanța totală / timpul total. <b>Nu</b> este media vitezelor.</li>
<li>Accelerația are sensul vitezei când mobilul accelerează și sens opus când frânează.</li>
</ul>
<h3>Mișcarea rectilinie uniformă (MRU)</h3>
<div class="fx">v = ct ;  x = x₀ + v·t</div>
<h3>Mișcarea rectilinie uniform variată (MRUV)</h3>
<div class="fx big">v = v₀ + at ;  x = x₀ + v₀t + at²/2 ;  v² = v₀² + 2a·Δx</div>
<ul>
<li>Viteza medie în MRUV: v<sub>m</sub> = (v₀ + v)/2.</li>
<li>Frânare până la oprire: t = v₀/|a| și d = v₀²/(2|a|).</li>
</ul>
<h3>Grafice</h3>
<div class="tw"><table><thead><tr><th>Grafic</th><th>MRU</th><th>MRUV</th><th>Ce citești</th></tr></thead><tbody>
<tr><td class="m">x(t)</td><td>dreaptă</td><td>parabolă</td><td>panta = viteza</td></tr>
<tr><td class="m">v(t)</td><td>orizontală</td><td>dreaptă înclinată</td><td>panta = accelerația, aria = deplasarea</td></tr>
<tr><td class="m">a(t)</td><td>zero</td><td>orizontală</td><td>aria = variația vitezei</td></tr>
</tbody></table></div>
<h3>Mișcarea pe verticală (g = 10 m/s²)</h3>
<div class="tw"><table><thead><tr><th>Situație</th><th>Formule</th></tr></thead><tbody>
<tr><td>Cădere liberă de la h</td><td class="m">h = gt²/2 ; v = gt = √(2gh)</td></tr>
<tr><td>Aruncare în sus cu v₀</td><td class="m">v = v₀ − gt ; y = v₀t − gt²/2</td></tr>
<tr><td>Timpul de urcare</td><td class="m">t<sub>u</sub> = v₀/g</td></tr>
<tr><td>Înălțimea maximă</td><td class="m">h<sub>max</sub> = v₀²/(2g)</td></tr>
</tbody></table></div>
<div class="keep"><b>De reținut:</b> corpul aruncat în sus revine în punctul de lansare cu aceeași viteză (în modul), iar timpul de coborâre este egal cu cel de urcare, dacă neglijezi frecarea cu aerul.</div>` },
{ id:'m-princ', g:'mcin', t:'Principiile mecanicii', d:'Inerție, F = ma, acțiune și reacțiune',
  brief:['I: fără forță rezultantă, corpul rămâne în repaus sau în MRU.','II: rezultanta forțelor = m·a (vectorial).','III: acțiunea și reacțiunea sunt egale, opuse și acționează pe corpuri diferite.'], html:`
<h3>Principiul I (al inerției)</h3>
<p>Un corp își păstrează starea de repaus sau de mișcare rectilinie uniformă cât timp rezultanta forțelor care acționează asupra lui este zero. <b>Masa</b> este măsura inerției.</p>
<h3>Principiul II (fundamental)</h3>
<div class="fx big">F<sub>rezultantă</sub> = m·a</div>
<ul><li>Accelerația are direcția și sensul forței rezultante.</li><li>1 N este forța care imprimă unui corp de 1 kg accelerația de 1 m/s².</li></ul>
<h3>Principiul III (al acțiunii și reacțiunii)</h3>
<p>Dacă un corp acționează asupra altuia cu o forță, al doilea acționează asupra primului cu o forță egală în modul și de sens opus. Cele două forțe <b>nu se anulează</b>, pentru că acționează asupra unor corpuri diferite.</p>
<h3>Forțe întâlnite des</h3>
<div class="tw"><table><thead><tr><th>Forță</th><th>Expresie</th><th>Orientare</th></tr></thead><tbody>
<tr><td>Greutatea</td><td class="m">G = mg</td><td>vertical în jos</td></tr>
<tr><td>Reacțiunea normală</td><td class="m">N</td><td>perpendiculară pe suprafață</td></tr>
<tr><td>Tensiunea în fir</td><td class="m">T</td><td>de-a lungul firului</td></tr>
<tr><td>Frecarea la alunecare</td><td class="m">F<sub>f</sub> = μN</td><td>opusă mișcării</td></tr>
<tr><td>Forța elastică</td><td class="m">F<sub>e</sub> = k·Δl</td><td>opusă deformării</td></tr>
</tbody></table></div>
<h3>Metoda de rezolvare</h3>
<ol><li>Desenezi corpul și toate forțele care acționează asupra lui.</li><li>Alegi axele: Ox pe direcția mișcării, Oy perpendicular.</li><li>Scrii principiul II pe fiecare axă: pe Oy de obicei suma este zero, pe Ox este m·a.</li><li>Rezolvi sistemul.</li></ol>
<h3>Corp în lift</h3>
<div class="fx">N = m(g + a) la urcare accelerată ;  N = m(g − a) la coborâre accelerată</div>
<div class="keep"><b>De reținut:</b> greutatea aparentă este apăsarea pe suport (N), nu mg. În cădere liberă N = 0 (imponderabilitate).</div>` },
{ id:'m-forte', g:'mcin', t:'Forța elastică, tensiunea și frecarea', d:'Legea lui Hooke, fire, legile frecării',
  brief:['Hooke: F/S₀ = E·Δl/l₀, adică F = k·Δl cu k = ES₀/l₀.','Într-un fir ideal tensiunea este aceeași în tot firul.','F_f = μN: nu depinde de aria de contact.'], html:`
<h3>Legea lui Hooke</h3>
<div class="fx big">F/S₀ = E·Δl/l₀  ⇔  σ = E·ε</div>
<ul>
<li>σ = F/S₀ este efortul unitar (N/m²); ε = Δl/l₀ este alungirea relativă; E este modulul lui Young (N/m²).</li>
<li>Forța elastică: <b>F<sub>e</sub> = k·Δl</b>, cu constanta elastică k = E·S₀/l₀ (N/m).</li>
<li>Legea e valabilă doar în limitele de elasticitate.</li>
</ul>
<div class="tw"><table><thead><tr><th>Grupare de resorturi</th><th>Constanta echivalentă</th></tr></thead><tbody>
<tr><td>Serie</td><td class="m">1/k = 1/k₁ + 1/k₂</td></tr>
<tr><td>Paralel</td><td class="m">k = k₁ + k₂</td></tr>
</tbody></table></div>
<h3>Tensiunea în fir</h3>
<ul><li>Fir ideal: inextensibil și fără masă. Tensiunea are aceeași valoare în orice punct al firului.</li><li>Scripetele ideal schimbă doar direcția forței, nu și valoarea ei.</li><li>Corpurile legate prin fir întins au aceeași accelerație (în modul).</li></ul>
<h3>Legile frecării la alunecare</h3>
<div class="fx big">F<sub>f</sub> = μ·N</div>
<ul>
<li>Forța de frecare nu depinde de aria suprafeței de contact.</li>
<li>Este proporțională cu apăsarea normală; μ depinde de natura și de starea suprafețelor.</li>
<li>Frecarea statică poate lua orice valoare până la μN; corpul pornește doar când forța aplicată o depășește.</li>
</ul>
<h3>Corp tras pe orizontală cu o forță sub unghiul α</h3>
<div class="fx">N = mg − F·sin α ;  a = (F·cos α − μN)/m</div>
<div class="keep"><b>Atenție:</b> N nu este mereu mg. Dacă tragi în sus sub un unghi, apăsarea scade; dacă împingi în jos, crește (N = mg + F·sin α).</div>` },
{ id:'m-plan', g:'mcin', t:'Plan înclinat și sisteme de corpuri', d:'Accelerații, unghi de frecare, Atwood', graph:'incline',
  brief:['Pe plan: G_t = mg·sin α, N = mg·cos α.','Coborâre: a = g(sin α − μcos α). Urcare liberă: |a| = g(sin α + μcos α).','Sisteme: scrii principiul II pentru fiecare corp și aduni ecuațiile.'], html:`
<h3>Descompunerea greutății</h3>
<div class="fx big">G<sub>t</sub> = mg·sin α ;  G<sub>n</sub> = mg·cos α ;  N = mg·cos α</div>
<div class="tw"><table><thead><tr><th>Situație</th><th>Accelerație sau forță</th></tr></thead><tbody>
<tr><td>Coborâre liberă cu frecare</td><td class="m">a = g(sin α − μ·cos α)</td></tr>
<tr><td>Urcare liberă după lansare</td><td class="m">|a| = g(sin α + μ·cos α), frânare</td></tr>
<tr><td>Fără frecare</td><td class="m">a = g·sin α</td></tr>
<tr><td>Alunecare uniformă la coborâre</td><td class="m">μ = tg α (unghi de frecare)</td></tr>
<tr><td>Tras uniform în sus, paralel cu planul</td><td class="m">F = mg(sin α + μ·cos α)</td></tr>
<tr><td>Ținut în echilibru (fără frecare)</td><td class="m">F = mg·sin α</td></tr>
</tbody></table></div>
<ul><li>Corpul lăsat liber alunecă doar dacă tg α &gt; μ.</li><li>Lungimea planului, înălțimea și unghiul: sin α = h/l.</li></ul>
<h3>Sisteme de corpuri</h3>
<div class="tw"><table><thead><tr><th>Sistem</th><th>Rezultat</th></tr></thead><tbody>
<tr><td>Mașina Atwood (m₁ &gt; m₂)</td><td class="m">a = (m₁ − m₂)g/(m₁ + m₂) ; T = 2m₁m₂g/(m₁ + m₂)</td></tr>
<tr><td>m₁ pe masă (μ), m₂ atârnat</td><td class="m">a = (m₂ − μm₁)g/(m₁ + m₂)</td></tr>
<tr><td>Două corpuri împinse cu F</td><td class="m">a = F/(m₁ + m₂) ; forța de contact = m₂·a</td></tr>
</tbody></table></div>
<div class="keep"><b>Metodă:</b> pentru fiecare corp scrii m·a = suma forțelor pe direcția mișcării. Adunând ecuațiile, tensiunile se reduc și rămâne accelerația. Apoi afli tensiunea dintr-o singură ecuație.</div>` },
{ id:'m-lucru', g:'men', t:'Lucrul mecanic și puterea', d:'L = F·d·cos α, putere, randament',
  brief:['L = F·d·cos α; forța perpendiculară pe deplasare nu face lucru.','Greutatea: L = ±mgh, indiferent de drum. Frecarea: L = −μN·d.','P = L/t = F·v; randamentul η = L_util/L_consumat.'], html:`
<div class="fx big">L = F·d·cos α</div>
<ul>
<li>α &lt; 90°: lucru motor (L &gt; 0); α &gt; 90°: lucru rezistent (L &lt; 0); α = 90°: L = 0.</li>
<li>Pentru o forță variabilă, L este aria de sub graficul F(x).</li>
</ul>
<div class="tw"><table><thead><tr><th>Forța</th><th>Lucrul mecanic</th><th>Observație</th></tr></thead><tbody>
<tr><td>Greutatea</td><td class="m">L = mgh la coborâre, −mgh la urcare</td><td>nu depinde de drum (conservativă)</td></tr>
<tr><td>Forța elastică</td><td class="m">L = −k(x₂² − x₁²)/2</td><td>conservativă</td></tr>
<tr><td>Frecarea</td><td class="m">L = −μN·d</td><td>depinde de drum (neconservativă)</td></tr>
<tr><td>Reacțiunea normală</td><td class="m">L = 0</td><td>perpendiculară pe deplasare</td></tr>
</tbody></table></div>
<h3>Puterea</h3>
<div class="fx big">P = L/Δt ;  P = F·v</div>
<ul><li>La viteză constantă, forța de tracțiune este egală cu forța de rezistență, deci P = F<sub>rez</sub>·v.</li><li>Viteza maximă a unui vehicul: v<sub>max</sub> = P/F<sub>rez</sub>.</li></ul>
<h3>Randamentul</h3>
<div class="fx big">η = L<sub>util</sub>/L<sub>consumat</sub> = P<sub>util</sub>/P<sub>consumată</sub></div>
<p>Pentru planul înclinat (ridici uniform un corp trăgând paralel cu planul):</p>
<div class="fx">η = mgh/(F·l) = sin α/(sin α + μ·cos α)</div>` },
{ id:'m-energie', g:'men', t:'Energia mecanică și conservarea ei', d:'E_c, E_p, teorema variației, conservare',
  brief:['ΔE_c = L_total (toate forțele).','E_p = mgh și E_p elastică = kx²/2.','Fără frecare, E_c + E_p = constant; cu frecare, ΔE = L_frecare.'], html:`
<h3>Energia cinetică</h3>
<div class="fx big">E<sub>c</sub> = mv²/2 ;  ΔE<sub>c</sub> = L<sub>total</sub></div>
<p>Teorema variației energiei cinetice: variația energiei cinetice a unui corp este egală cu lucrul mecanic al <b>tuturor</b> forțelor care acționează asupra lui.</p>
<h3>Energia potențială</h3>
<div class="fx big">E<sub>p</sub> = mgh ;  E<sub>p,elastică</sub> = kx²/2 ;  ΔE<sub>p</sub> = −L<sub>conservativ</sub></div>
<ul><li>Nivelul de referință (unde E<sub>p</sub> = 0) îl alegi tu, de obicei la sol sau în punctul cel mai de jos.</li></ul>
<h3>Legea conservării energiei mecanice</h3>
<div class="fx big">E<sub>c1</sub> + E<sub>p1</sub> = E<sub>c2</sub> + E<sub>p2</sub></div>
<p>Este valabilă când acționează doar forțe conservative (greutate, forță elastică) sau când celelalte forțe nu fac lucru mecanic.</p>
<h3>Când există frecare</h3>
<div class="fx big">E<sub>final</sub> − E<sub>inițial</sub> = L<sub>neconservativ</sub>  (negativ pentru frecare)</div>
<h3>Aplicații tipice</h3>
<div class="tw"><table><thead><tr><th>Situație</th><th>Relație</th></tr></thead><tbody>
<tr><td>Cădere de la h (sau plan fără frecare)</td><td class="m">v = √(2gh)</td></tr>
<tr><td>Pendul deviat cu α</td><td class="m">h = l(1 − cos α) ; v = √(2gh)</td></tr>
<tr><td>Coboară de la h fără frecare, apoi orizontală cu μ</td><td class="m">mgh = μmg·d ⇒ d = h/μ</td></tr>
<tr><td>Corp oprit de un resort</td><td class="m">mv²/2 = kx²/2</td></tr>
<tr><td>Înălțimea la care E_c = E_p</td><td class="m">h = H/2</td></tr>
</tbody></table></div>
<div class="keep"><b>De reținut:</b> când în enunț nu apare timpul, încearcă întâi cu energii. E mai scurt decât cu accelerații.</div>` },
{ id:'m-impuls', g:'men', t:'Impulsul și ciocnirile', d:'p = mv, teorema impulsului, conservare',
  brief:['p = mv este vector; F·Δt = Δp.','În sisteme izolate impulsul total se conservă.','Plastică: corpurile rămân lipite și se pierde energie. Elastică: se conservă și E_c.'], html:`
<div class="fx big">p = m·v ;  F = Δp/Δt</div>
<h3>Teorema variației impulsului</h3>
<div class="fx big">F<sub>med</sub>·Δt = Δp = m·v₂ − m·v₁</div>
<ul><li>F·Δt se numește impulsul forței; este aria de sub graficul F(t).</li><li>Impulsul este vector: alegi o axă și pui semne vitezelor.</li><li>Minge care lovește perpendicular un perete și se întoarce cu aceeași viteză: |Δp| = 2mv.</li></ul>
<h3>Legea conservării impulsului</h3>
<p>Dacă rezultanta forțelor exterioare este zero (sistem izolat), impulsul total rămâne constant:</p>
<div class="fx big">m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′</div>
<h3>Ciocnirea plastică</h3>
<div class="fx big">v = (m₁v₁ + m₂v₂)/(m₁ + m₂)</div>
<div class="fx">Q = E<sub>c,inițial</sub> − E<sub>c,final</sub> = m₁m₂(v₁ − v₂)²/[2(m₁ + m₂)]</div>
<h3>Ciocnirea perfect elastică (unidimensională)</h3>
<div class="fx">v₁′ = 2v<sub>c</sub> − v₁ ;  v₂′ = 2v<sub>c</sub> − v₂ ,  cu v<sub>c</sub> = (m₁v₁ + m₂v₂)/(m₁ + m₂)</div>
<ul><li>Mase egale: corpurile își schimbă vitezele între ele.</li></ul>
<h3>Recul și explozii</h3>
<div class="fx">0 = m₁v₁ + m₂v₂  ⇒  corpurile pleacă în sensuri opuse, cu m₁|v₁| = m₂|v₂|</div>
<div class="keep"><b>Atenție la semne:</b> dacă al doilea corp vine din sens opus, viteza lui se pune cu minus în formule.</div>` },
{ id:'m-probleme', g:'men', t:'Tipuri de probleme', d:'Plan înclinat, sisteme, energie, ciocniri',
  brief:['Dacă apare timpul: cinematică și principiul II.','Dacă apar înălțimi și viteze: energii.','La ciocniri: întâi impulsul, apoi energia.'], html:`
<ol>
<li><b>Corp pe plan înclinat, apoi pe orizontală:</b> afli viteza la baza planului (cu accelerația sau cu energia), apoi distanța de oprire: d = v²/(2μg).</li>
<li><b>Corp lansat în sus pe plan:</b> la urcare |a| = g(sin α + μcos α); distanța urcată: d = v₀²/(2|a|). Coboară înapoi doar dacă tg α &gt; μ, cu a = g(sin α − μcos α).</li>
<li><b>Sisteme legate prin fir:</b> principiul II pentru fiecare corp; aceeași accelerație, aceeași tensiune.</li>
<li><b>Grafice v(t) sau F(x):</b> panta și aria. Din v(t) citești accelerația pe fiecare porțiune și distanța (aria). Din F(x) citești lucrul mecanic.</li>
<li><b>Putere:</b> la viteză constantă P = F<sub>rez</sub>·v; pe rampă se adaugă mg·sin α la forța de tracțiune.</li>
<li><b>Pendul:</b> h = l(1 − cos α), apoi conservarea energiei. În punctul cel mai de jos: T − mg = mv²/l.</li>
<li><b>Resort:</b> la echilibru k·Δl = mg; energia potențială elastică kx²/2.</li>
<li><b>Ciocnire plastică, apoi mișcare:</b> impulsul dă viteza comună; după ciocnire folosești energia sau cinematica.</li>
</ol>
<div class="keep"><b>Sfaturi:</b> desenul cu forțele aduce puncte la barem. Scrie formula literală, apoi înlocuiește numeric. Verifică unitățile și treci km/h în m/s.</div>` }
];
const L_ELEC = [
{ id:'e-curent', g:'ecirc', t:'Curentul electric și tensiunea', d:'Intensitate, t.e.m., aparate de măsură',
  brief:['I = Δq/Δt; sensul convențional este de la + la − prin circuitul exterior.','E = U + u: t.e.m. se împarte între circuitul exterior și cel interior.','Ampermetrul se leagă în serie, voltmetrul în paralel.'], html:`
<p>Curentul electric este mișcarea ordonată a purtătorilor de sarcină. În metale, purtătorii sunt electronii liberi.</p>
<div class="fx big">I = Δq/Δt ;  q = N·e</div>
<ul>
<li>Unitatea: amperul (1 A = 1 C/s). Sarcina electronului: e = 1,6·10⁻¹⁹ C.</li>
<li><b>Sensul convențional:</b> de la borna + la borna − prin circuitul exterior (invers față de electroni).</li>
<li>Legătura cu mișcarea electronilor: I = n·e·v·S (n = concentrația electronilor, v = viteza de drift, S = aria secțiunii).</li>
</ul>
<h3>Tensiunea și tensiunea electromotoare</h3>
<div class="fx big">U = L/q ;  E = L<sub>total</sub>/q ;  E = U + u</div>
<ul>
<li>U = tensiunea la bornele generatorului (pe circuitul exterior); u = căderea de tensiune în interiorul generatorului.</li>
<li>Unitatea: voltul (1 V = 1 J/C).</li>
</ul>
<h3>Circuitul electric simplu</h3>
<p>Generator (E, r), consumator (R), conductoare de legătură și întrerupător. Curentul circulă doar în circuit închis.</p>
<div class="tw"><table><thead><tr><th>Aparat</th><th>Cum se leagă</th><th>Rezistența ideală</th></tr></thead><tbody>
<tr><td>Ampermetru</td><td>în serie cu consumatorul</td><td class="m">R<sub>A</sub> = 0</td></tr>
<tr><td>Voltmetru</td><td>în paralel cu consumatorul</td><td class="m">R<sub>V</sub> → ∞</td></tr>
</tbody></table></div>` },
{ id:'e-ohm', g:'ecirc', t:'Rezistența și legea lui Ohm', d:'R = ρl/S, circuit întreg, scurtcircuit', graph:'ui',
  brief:['R = ρ·l/S; la metale rezistența crește cu temperatura.','Circuit întreg: I = E/(R + r); la borne U = E − I·r.','Scurtcircuit: I_sc = E/r. Mers în gol: U = E.'], html:`
<h3>Rezistența electrică</h3>
<div class="fx big">R = U/I ;  R = ρ·l/S</div>
<ul><li>ρ = rezistivitatea materialului (Ω·m); l = lungimea; S = aria secțiunii.</li></ul>
<h3>Dependența de temperatură</h3>
<div class="fx">ρ = ρ₀(1 + α·t) ;  R = R₀(1 + α·t)</div>
<p>R₀ este rezistența la 0 °C, α este coeficientul de temperatură al rezistivității, t este temperatura în °C. Între două temperaturi: R₂/R₁ = (1 + αt₂)/(1 + αt₁).</p>
<h3>Legea lui Ohm</h3>
<div class="fx big">I = U/R  (porțiune de circuit) ;  I = E/(R + r)  (circuit întreg)</div>
<div class="fx">U = I·R = E − I·r ;  u = I·r</div>
<div class="tw"><table><thead><tr><th>Regim</th><th>Condiție</th><th>Rezultat</th></tr></thead><tbody>
<tr><td>Scurtcircuit</td><td class="m">R = 0</td><td class="m">I<sub>sc</sub> = E/r ; U = 0</td></tr>
<tr><td>Mers în gol</td><td class="m">I = 0 (circuit deschis)</td><td class="m">U = E</td></tr>
</tbody></table></div>
<h3>Caracteristica generatorului U(I)</h3>
<p>U = E − r·I este o dreaptă descrescătoare: taie axa U la E, axa I la I<sub>sc</sub>, iar panta ei este −r.</p>
<h3>Aflarea lui E și r din două măsurători</h3>
<div class="fx">E = I₁(R₁ + r) = I₂(R₂ + r)  ⇒  r = (I₂R₂ − I₁R₁)/(I₁ − I₂)</div>
<div class="keep"><b>De reținut:</b> un voltmetru ideal legat direct la bornele unui generator în gol arată E. Cu circuitul închis arată U = E − I·r.</div>` },
{ id:'e-kirchhoff', g:'ecirc', t:'Legile lui Kirchhoff', d:'Noduri, ochiuri, convenții de semn',
  brief:['Legea I (noduri): suma curenților care intră = suma celor care ies.','Legea II (ochiuri): ΣE = Σ(I·R), cu semne după sensul de parcurgere.','Un curent ieșit negativ are sensul real opus celui ales.'], html:`
<p>O rețea electrică are <b>noduri</b> (puncte unde se întâlnesc cel puțin trei conductoare), <b>ramuri</b> (porțiuni dintre două noduri) și <b>ochiuri</b> (contururi închise).</p>
<h3>Legea I (a nodurilor)</h3>
<div class="fx big">Σ I<sub>intră</sub> = Σ I<sub>ies</sub></div>
<p>Exprimă conservarea sarcinii electrice. Pentru n noduri scrii n − 1 ecuații independente.</p>
<h3>Legea II (a ochiurilor)</h3>
<div class="fx big">Σ E = Σ I·R  (R include și rezistențele interne)</div>
<p>Exprimă conservarea energiei. Convenția de semne, după ce alegi un sens de parcurgere a ochiului:</p>
<ul>
<li><b>E pozitiv</b> dacă sensul de parcurgere trece prin generator de la borna − la borna +.</li>
<li><b>I·R pozitiv</b> dacă sensul curentului coincide cu sensul de parcurgere.</li>
</ul>
<h3>Pași de rezolvare</h3>
<ol>
<li>Alegi câte un sens pentru curentul din fiecare ramură și îl desenezi.</li>
<li>Scrii legea I pentru n − 1 noduri.</li>
<li>Alegi ochiuri independente și un sens de parcurgere; scrii legea II.</li>
<li>Rezolvi sistemul. Curent negativ = sens real opus celui ales.</li>
</ol>
<h3>Tensiunea între două puncte</h3>
<p>Mergi de la A la B pe orice drum: U<sub>AB</sub> = V<sub>A</sub> − V<sub>B</sub>. Aduni I·R când mergi în sensul curentului și scazi E când treci prin generator de la − la +.</p>
<div class="keep"><b>De reținut:</b> un generator prin care curentul circulă de la + la − în interior se încarcă (funcționează ca receptor): la bornele lui U = E + I·r.</div>` },
{ id:'e-grupare', g:'ecirc', t:'Gruparea rezistoarelor și a generatoarelor', d:'Serie, paralel, șunt, rezistență adițională',
  brief:['Serie: același curent, R_s = R₁ + R₂. Paralel: aceeași tensiune, 1/R_p = 1/R₁ + 1/R₂.','n generatoare identice: în serie (nE, nr), în paralel (E, r/n).','Șunt: R_s = R_A/(n − 1). Adițională: R_a = R_V(n − 1).'], html:`
<h3>Rezistoare</h3>
<div class="tw"><table><thead><tr><th></th><th>Serie</th><th>Paralel</th></tr></thead><tbody>
<tr><td>Ce e comun</td><td>intensitatea</td><td>tensiunea</td></tr>
<tr><td>Ce se adună</td><td>tensiunile</td><td>intensitățile</td></tr>
<tr><td>Rezistența echivalentă</td><td class="m">R<sub>s</sub> = R₁ + R₂ + …</td><td class="m">1/R<sub>p</sub> = 1/R₁ + 1/R₂ + …</td></tr>
<tr><td>n rezistoare identice</td><td class="m">n·R</td><td class="m">R/n</td></tr>
<tr><td>Două rezistoare</td><td class="m">R₁ + R₂</td><td class="m">R₁R₂/(R₁ + R₂)</td></tr>
</tbody></table></div>
<ul>
<li>R<sub>p</sub> este mai mică decât cea mai mică dintre rezistențe.</li>
<li>Divizor de tensiune (serie): U₁ = U·R₁/(R₁ + R₂).</li>
<li>Divizor de curent (paralel): I₁ = I·R₂/(R₁ + R₂).</li>
</ul>
<h3>Generatoare</h3>
<div class="tw"><table><thead><tr><th>Grupare</th><th>Echivalent</th><th>Curentul prin R</th></tr></thead><tbody>
<tr><td>n identice în serie</td><td class="m">E<sub>s</sub> = nE ; r<sub>s</sub> = nr</td><td class="m">I = nE/(R + nr)</td></tr>
<tr><td>n identice în paralel</td><td class="m">E<sub>p</sub> = E ; r<sub>p</sub> = r/n</td><td class="m">I = E/(R + r/n)</td></tr>
<tr><td>Două diferite în paralel</td><td class="m">E<sub>p</sub> = (E₁/r₁ + E₂/r₂)/(1/r₁ + 1/r₂)</td><td class="m">1/r<sub>p</sub> = 1/r₁ + 1/r₂</td></tr>
</tbody></table></div>
<h3>Extinderea domeniului aparatelor</h3>
<div class="tw"><table><thead><tr><th>Aparat</th><th>Ce adaugi</th><th>Valoare</th></tr></thead><tbody>
<tr><td>Ampermetru (de n ori)</td><td>șunt în paralel</td><td class="m">R<sub>s</sub> = R<sub>A</sub>/(n − 1)</td></tr>
<tr><td>Voltmetru (de n ori)</td><td>rezistență adițională în serie</td><td class="m">R<sub>a</sub> = R<sub>V</sub>(n − 1)</td></tr>
</tbody></table></div>
<div class="keep"><b>Metodă pentru circuite mixte:</b> reduci grupările din interior spre exterior până rămâne o singură rezistență, afli curentul total, apoi te întorci pas cu pas ca să afli curenții și tensiunile pe fiecare rezistor.</div>` },
{ id:'e-energie', g:'een', t:'Energia și puterea electrică', d:'Legea lui Joule, kWh, valori nominale',
  brief:['W = U·I·t = I²R·t = U²t/R.','P = U·I; pe tot circuitul P_total = E·I.','Din valorile nominale: R = U_n²/P_n și I_n = P_n/U_n.'], html:`
<div class="fx big">W = U·I·t = I²·R·t = U²·t/R</div>
<p><b>Legea lui Joule:</b> căldura degajată într-un conductor parcurs de curent este Q = I²·R·t.</p>
<h3>Puterea electrică</h3>
<div class="fx big">P = U·I = I²·R = U²/R</div>
<div class="tw"><table><thead><tr><th>Puterea</th><th>Expresie</th></tr></thead><tbody>
<tr><td>Totală (dezvoltată de generator)</td><td class="m">P<sub>t</sub> = E·I</td></tr>
<tr><td>Pe circuitul exterior (utilă)</td><td class="m">P = U·I = I²R</td></tr>
<tr><td>Pe circuitul interior (pierdută)</td><td class="m">P<sub>int</sub> = I²r</td></tr>
<tr><td>Bilanț</td><td class="m">E·I = U·I + I²r</td></tr>
</tbody></table></div>
<h3>Unități</h3>
<div class="fx">1 kWh = 1000 W · 3600 s = 3,6·10⁶ J</div>
<h3>Valori nominale</h3>
<p>Pe un bec scrie tensiunea și puterea nominală (de exemplu 220 V, 100 W). De aici afli:</p>
<div class="fx">R = U<sub>n</sub>²/P<sub>n</sub> ;  I<sub>n</sub> = P<sub>n</sub>/U<sub>n</sub></div>
<ul>
<li>Becul funcționează normal doar dacă la bornele lui este tensiunea nominală.</li>
<li>În serie (același I): disipă mai mult rezistorul cu R mai mare (P = I²R).</li>
<li>În paralel (aceeași U): disipă mai mult rezistorul cu R mai mică (P = U²/R).</li>
</ul>` },
{ id:'e-transfer', g:'een', t:'Randamentul circuitului și puterea maximă', d:'η = R/(R + r), transfer maxim la R = r', graph:'pr',
  brief:['η = U/E = R/(R + r).','Puterea pe circuitul exterior e maximă când R = r: P_max = E²/(4r).','Aceeași putere pe R₁ și R₂ dacă R₁·R₂ = r².'], html:`
<h3>Randamentul circuitului simplu</h3>
<div class="fx big">η = P<sub>util</sub>/P<sub>total</sub> = U/E = R/(R + r)</div>
<h3>Puterea pe circuitul exterior</h3>
<div class="fx big">P(R) = E²·R/(R + r)²</div>
<ul>
<li>P este maximă pentru <b>R = r</b>: P<sub>max</sub> = E²/(4r). În acest caz η = 50%.</li>
<li>Pentru R ≫ r randamentul se apropie de 100%, dar puterea transferată scade.</li>
<li>La scurtcircuit (R = 0) toată puterea se pierde în generator.</li>
</ul>
<h3>Aceeași putere pe două rezistoare diferite</h3>
<div class="fx big">P(R₁) = P(R₂)  ⇔  R₁·R₂ = r²</div>
<p>Dacă un generator debitează aceeași putere pe R₁ și apoi pe R₂, rezistența lui internă este r = √(R₁R₂). Randamentele sunt diferite: mai mare pentru rezistența mai mare.</p>
<div class="keep"><b>De reținut:</b> „putere maximă” înseamnă R = r. „Randament maxim” înseamnă R cât mai mare față de r. Nu sunt același lucru.</div>` },
{ id:'e-probleme', g:'een', t:'Tipuri de probleme', d:'Circuite mixte, becuri, aparate, grafice',
  brief:['Redu circuitul la o rezistență echivalentă, apoi întoarce-te pas cu pas.','Becurile se tratează ca rezistoare cu R = U_n²/P_n.','Din graficul U(I) citești E, I_sc și r.'], html:`
<ol>
<li><b>Circuit mixt:</b> R echivalent → I = E/(R<sub>e</sub> + r) → tensiunea pe fiecare grupare → curenții din ramuri.</li>
<li><b>Becuri cu valori nominale:</b> R = U<sub>n</sub>²/P<sub>n</sub>. Ca un bec să funcționeze normal de la o tensiune mai mare, legi în serie un rezistor pe care cade diferența: R<sub>x</sub> = (U − U<sub>n</sub>)/I<sub>n</sub>.</li>
<li><b>Întrerupător închis sau deschis:</b> rezolvi circuitul de două ori; un întrerupător închis în paralel cu un rezistor îl scurtcircuitează.</li>
<li><b>Două regimuri (R₁, I₁) și (R₂, I₂):</b> scrii legea lui Ohm de două ori și afli E și r.</li>
<li><b>Grafic U(I):</b> intersecția cu axa U este E, cu axa I este I<sub>sc</sub>; r = E/I<sub>sc</sub>.</li>
<li><b>Fir conductor:</b> R = ρl/S, cu S = πd²/4. Dacă tai firul în n bucăți egale și le legi în paralel: R/n².</li>
<li><b>Încălzirea apei:</b> η·U·I·t = m·c·Δt.</li>
<li><b>Aparate reale:</b> ampermetrul (R<sub>A</sub>) se adaugă în serie, voltmetrul (R<sub>V</sub>) în paralel la calculul rezistenței echivalente.</li>
</ol>
<div class="keep"><b>Sfaturi:</b> redesenează circuitul după fiecare simplificare. Verifică la final bilanțul: E·I = suma puterilor pe toate rezistoarele, inclusiv pe r.</div>` }
];
const L_OPT = [
{ id:'o-reflexie', g:'ogeo', t:'Reflexia și refracția luminii', d:'Legi, indice de refracție, reflexie totală',
  brief:['Reflexie: unghiul de reflexie = unghiul de incidență.','Refracție: n₁·sin i = n₂·sin r, cu n = c/v.','Reflexie totală: din mediul mai dens, pentru i > l, cu sin l = n₂/n₁.'], html:`
<p>În optica geometrică lumina se propagă în linie dreaptă, sub formă de raze. Unghiurile se măsoară față de <b>normala</b> la suprafață.</p>
<h3>Indicele de refracție</h3>
<div class="fx big">n = c/v  (c = 3·10⁸ m/s)</div>
<ul><li>n ≥ 1: aer ≈ 1, apă ≈ 1,33 = 4/3, sticlă ≈ 1,5.</li><li>La trecerea în alt mediu <b>frecvența nu se schimbă</b>; se schimbă viteza și lungimea de undă: λ = λ₀/n.</li></ul>
<h3>Legile reflexiei</h3>
<ul><li>Raza incidentă, normala și raza reflectată sunt în același plan.</li><li>Unghiul de reflexie este egal cu unghiul de incidență: i′ = i.</li><li>Oglinda plană dă o imagine virtuală, dreaptă, egală cu obiectul și simetrică față de oglindă.</li></ul>
<h3>Legile refracției</h3>
<div class="fx big">n₁·sin i = n₂·sin r</div>
<ul><li>Într-un mediu mai dens optic (n mai mare) raza se apropie de normală.</li><li>Indicele relativ: n₂₁ = n₂/n₁ = v₁/v₂.</li></ul>
<h3>Reflexia totală</h3>
<div class="fx big">sin l = n₂/n₁  (n₁ &gt; n₂)</div>
<p>Apare doar când lumina trece dintr-un mediu mai dens într-unul mai puțin dens și unghiul de incidență depășește unghiul limită l. Pentru apă–aer, l ≈ 48,6°. Aplicație: fibra optică.</p>
<h3>Cazuri utile</h3>
<div class="tw"><table><thead><tr><th>Situație</th><th>Relație</th></tr></thead><tbody>
<tr><td>Lamă cu fețe plan-paralele</td><td>raza emergentă este paralelă cu raza incidentă, dar deplasată</td></tr>
<tr><td>Adâncime aparentă (privire pe verticală)</td><td class="m">h′ = h/n</td></tr>
<tr><td>Raza reflectată ⟂ raza refractată</td><td class="m">tg i = n₂/n₁</td></tr>
</tbody></table></div>` },
{ id:'o-lentile', g:'ogeo', t:'Lentile subțiri', d:'Formula lentilelor, mărire, construcția imaginii', graph:'lens',
  brief:['1/x₂ − 1/x₁ = 1/f, cu x₁ < 0 pentru obiect real.','β = y₂/y₁ = x₂/x₁; C = 1/f, în dioptrii (f în metri).','x₂ > 0: imagine reală. β < 0: imagine răsturnată.'], html:`
<p>Lentilele <b>convergente</b> (mai groase la mijloc) au f &gt; 0; lentilele <b>divergente</b> (mai subțiri la mijloc) au f &lt; 0.</p>
<h3>Convenția de semne</h3>
<ul><li>Lumina vine din stânga. Distanțele se măsoară de la lentilă: pozitive spre dreapta, negative spre stânga.</li><li>Obiect real: x₁ &lt; 0. Înălțimile sunt pozitive deasupra axei optice.</li></ul>
<div class="fx big">1/x₂ − 1/x₁ = 1/f ;  β = y₂/y₁ = x₂/x₁ ;  C = 1/f</div>
<ul><li>Convergența C se măsoară în dioptrii (1 δ = 1 m⁻¹), cu f în metri: f = 25 cm înseamnă C = 4 δ.</li></ul>
<h3>Formula constructorilor de lentile</h3>
<div class="fx">1/f = (n/n<sub>mediu</sub> − 1)·(1/R₁ − 1/R₂)</div>
<p>În aer n<sub>mediu</sub> = 1. Razele de curbură au semn după aceeași convenție. Scufundată într-un lichid, lentila își schimbă distanța focală.</p>
<h3>Construcția imaginii</h3>
<ul><li>Raza paralelă cu axa optică trece, după lentilă, prin focarul imagine.</li><li>Raza care trece prin centrul optic nu este deviată.</li><li>Raza care trece prin focarul obiect iese paralelă cu axa optică.</li></ul>
<div class="tw"><table><thead><tr><th>Lentilă convergentă: obiectul este…</th><th>Imaginea</th></tr></thead><tbody>
<tr><td>dincolo de 2f</td><td>reală, răsturnată, micșorată</td></tr>
<tr><td>la 2f</td><td>reală, răsturnată, egală (la 2f)</td></tr>
<tr><td>între f și 2f</td><td>reală, răsturnată, mărită</td></tr>
<tr><td>în focar</td><td>la infinit</td></tr>
<tr><td>între focar și lentilă</td><td>virtuală, dreaptă, mărită (lupa)</td></tr>
</tbody></table></div>
<p><b>Lentila divergentă</b> dă, pentru orice obiect real, o imagine virtuală, dreaptă și micșorată.</p>
<div class="keep"><b>De reținut:</b> imaginea reală se poate prinde pe un ecran; cea virtuală nu. Distanța minimă dintre un obiect real și imaginea lui reală este 4f.</div>` },
{ id:'o-sisteme', g:'ogeo', t:'Sisteme de lentile', d:'Lentile alipite, sisteme la distanță, sistem afocal',
  brief:['Lentile alipite: C = C₁ + C₂.','La distanța d: imaginea primei lentile este obiect pentru a doua, cu x₁′ = x₂ − d.','Mărirea totală: β = β₁·β₂.'], html:`
<h3>Lentile alipite (acolate)</h3>
<div class="fx big">C = C₁ + C₂  ⇔  1/F = 1/f₁ + 1/f₂</div>
<p>Convergențele se adună cu semn: o lentilă divergentă (C &lt; 0) micșorează convergența sistemului.</p>
<h3>Lentile aflate la distanța d</h3>
<ol>
<li>Calculezi imaginea dată de prima lentilă: 1/x₂ − 1/x₁ = 1/f₁.</li>
<li>Această imagine este obiect pentru a doua lentilă: <b>x₁′ = x₂ − d</b>.</li>
<li>Calculezi imaginea finală: 1/x₂′ − 1/x₁′ = 1/f₂.</li>
<li>Mărirea totală: β = β₁·β₂.</li>
</ol>
<p>Dacă x₁′ iese pozitiv, obiectul pentru a doua lentilă este virtual (razele ajung la ea înainte să se întâlnească).</p>
<h3>Sistemul afocal (telescopic)</h3>
<div class="fx big">d = f₁ + f₂ ;  β = −f₂/f₁</div>
<p>Focarul imagine al primei lentile coincide cu focarul obiect al celei de-a doua. Un fascicul paralel care intră iese tot paralel.</p>
<div class="keep"><b>Atenție:</b> poziția finală x₂′ este măsurată față de a doua lentilă, nu față de prima.</div>` },
{ id:'o-interferenta', g:'oond', t:'Interferența luminii. Dispozitivul Young', d:'Coerență, interfranjă, lame subțiri', graph:'young',
  brief:['Maxime: δ = kλ. Minime: δ = (2k + 1)λ/2.','Young: i = λD/(2l), cu 2l distanța dintre fante.','Într-un mediu cu indice n, interfranja scade de n ori.'], html:`
<p>Lumina este o undă electromagnetică. Lungimea de undă în vid: λ = c/ν. Domeniul vizibil: aproximativ 400 nm (violet) – 750 nm (roșu). Într-un mediu cu indicele n: λ<sub>n</sub> = λ/n.</p>
<h3>Condiții de interferență</h3>
<ul><li>Undele trebuie să fie <b>coerente</b>: aceeași frecvență și diferență de fază constantă în timp.</li><li>Drumul optic: (L) = n·d. Diferența de drum optic se notează δ.</li></ul>
<div class="fx big">maxime: δ = k·λ ;  minime: δ = (2k + 1)·λ/2</div>
<h3>Dispozitivul Young</h3>
<p>Două fante paralele aflate la distanța 2l, iluminate de aceeași sursă; ecranul este la distanța D ≫ 2l.</p>
<div class="fx big">δ = 2l·x/D ;  x<sub>max</sub> = k·λD/(2l) ;  i = λD/(2l)</div>
<ul>
<li>Interfranja i este distanța dintre două maxime (sau două minime) vecine.</li>
<li>Minimul de ordin k: x<sub>min</sub> = (2k + 1)·λD/(4l).</li>
<li>Dispozitiv scufundat într-un lichid cu indicele n: i′ = i/n.</li>
<li>În lumină albă: maximul central este alb, celelalte sunt colorate, cu violetul spre centru.</li>
<li>O lamă subțire (grosime e, indice n) pusă în fața unei fante deplasează tot sistemul de franje spre acea fantă cu Δx = (n − 1)·e·D/(2l).</li>
</ul>
<h3>Interferența localizată</h3>
<div class="tw"><table><thead><tr><th>Dispozitiv</th><th>Relație</th></tr></thead><tbody>
<tr><td>Lamă subțire (în lumină reflectată)</td><td class="m">δ = 2n·e·cos r + λ/2</td></tr>
<tr><td>Pană optică (unghi α mic)</td><td class="m">i = λ/(2n·α)</td></tr>
</tbody></table></div>
<p>Culorile baloanelor de săpun și ale petelor de ulei pe apă sunt franje de interferență pe lame subțiri.</p>` },
{ id:'o-foto', g:'oond', t:'Efectul fotoelectric extern', d:'Legi, fotoni, ecuația lui Einstein', graph:'foto',
  brief:['Fotonul are energia ε = hν = hc/λ.','Einstein: hν = L + E_c,max; pragul este ν₀ = L/h.','Tensiunea de stopare: e·U_s = E_c,max.'], html:`
<p>Efectul fotoelectric extern este emisia de electroni de către un metal sub acțiunea radiațiilor electromagnetice.</p>
<h3>Legile efectului fotoelectric</h3>
<ol>
<li>Intensitatea curentului de saturație este proporțională cu fluxul radiației incidente.</li>
<li>Energia cinetică maximă a fotoelectronilor crește liniar cu frecvența și nu depinde de flux.</li>
<li>Efectul apare doar dacă frecvența este cel puțin egală cu frecvența de prag ν₀, specifică fiecărui metal.</li>
<li>Efectul se produce practic instantaneu.</li>
</ol>
<h3>Ipoteza lui Planck și fotonul</h3>
<div class="fx big">ε = h·ν = h·c/λ  (h = 6,63·10⁻³⁴ J·s)</div>
<ul><li>Fotonul are masa de repaus zero și impulsul p = h/λ.</li><li>1 eV = 1,6·10⁻¹⁹ J. Util la calcule: h·c ≈ 1240 eV·nm.</li></ul>
<h3>Ecuația lui Einstein</h3>
<div class="fx big">h·ν = L + E<sub>c,max</sub></div>
<ul>
<li>L = lucrul mecanic de extracție: L = h·ν₀ = h·c/λ₀.</li>
<li>Efectul are loc pentru ν ≥ ν₀, adică λ ≤ λ₀.</li>
</ul>
<h3>Tensiunea de stopare</h3>
<div class="fx big">e·U<sub>s</sub> = E<sub>c,max</sub>  ⇒  U<sub>s</sub> = (h/e)·ν − L/e</div>
<p>Graficul U<sub>s</sub>(ν) este o dreaptă cu panta h/e, care taie axa frecvențelor în ν₀. Graficul E<sub>c</sub>(ν) are panta h.</p>
<div class="keep"><b>De reținut:</b> mai multă lumină (flux mai mare) înseamnă mai mulți electroni, nu electroni mai rapizi. Viteza lor depinde doar de frecvență.</div>` },
{ id:'o-probleme', g:'oond', t:'Tipuri de probleme', d:'Lentile, Young, efect fotoelectric',
  brief:['Lentile: semnele lui x₁, x₂ și f decid totul.','Young: transformă nm și mm în metri înainte de calcul.','Fotoelectric: lucrează în eV cu hc ≈ 1240 eV·nm.'], html:`
<ol>
<li><b>Imagine pe ecran:</b> imaginea e reală, deci x₂ &gt; 0. Dacă se dă distanța obiect–ecran d: −x₁ + x₂ = d.</li>
<li><b>Imagine de n ori mai mare:</b> reală → β = −n; virtuală → β = +n. Apoi x₂ = β·x₁ în formula lentilelor.</li>
<li><b>Lentilă în lichid:</b> formula constructorilor cu n/n<sub>mediu</sub>; raportul f<sub>lichid</sub>/f<sub>aer</sub> = (n − 1)/(n/n<sub>mediu</sub> − 1).</li>
<li><b>Sistem de lentile:</b> pas cu pas, cu x₁′ = x₂ − d și β = β₁β₂.</li>
<li><b>Refracție și reflexie totală:</b> desenezi normala, aplici n₁sin i = n₂sin r; verifici dacă i depășește unghiul limită.</li>
<li><b>Young:</b> i = λD/(2l); poziția maximului de ordin k este k·i; distanța dintre maximul de ordin k₁ și cel de ordin k₂ de aceeași parte este (k₂ − k₁)·i.</li>
<li><b>Efect fotoelectric:</b> ε = hc/λ; E<sub>c</sub> = ε − L; U<sub>s</sub> = E<sub>c</sub>/e; λ₀ = hc/L. Viteza: v = √(2E<sub>c</sub>/m), cu m = 9,1·10⁻³¹ kg.</li>
<li><b>Număr de fotoni:</b> N = E/(hν) = P·t·λ/(hc).</li>
</ol>
<div class="keep"><b>Sfaturi:</b> la lentile scrie de la început x₁ cu minus. La fotoelectric, dacă ε &lt; L, nu se emit electroni, oricât de intens ar fi fasciculul.</div>` }
];
const L_A = [
{ id:'m-circular', g:'mext', nb:true, t:'Mișcarea circulară și atracția universală', d:'Viteză unghiulară, forță centripetă, sateliți',
  brief:['În mișcarea circulară uniformă modulul vitezei e constant, dar direcția ei se schimbă: există accelerație centripetă.','Forța centripetă nu este o forță nouă, ci rezultanta forțelor spre centru.','Atracția universală scade cu pătratul distanței dintre centre.'], html:`
<p>Un corp are <b>mișcare circulară uniformă</b> când descrie un cerc cu viteză de modul constant. Vectorul viteză este tangent la cerc și își schimbă mereu direcția.</p>
<h3>Mărimi</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Relație</th><th>Unitate</th></tr></thead><tbody>
<tr><td>Perioada (durata unei rotații)</td><td class="m">T</td><td class="m">s</td></tr>
<tr><td>Frecvența</td><td class="m">ν = 1/T</td><td class="m">Hz (rot/s)</td></tr>
<tr><td>Viteza unghiulară</td><td class="m">ω = 2π/T = 2πν</td><td class="m">rad/s</td></tr>
<tr><td>Viteza liniară</td><td class="m">v = ω·R = 2πR/T</td><td class="m">m/s</td></tr>
<tr><td>Accelerația centripetă</td><td class="m">a<sub>cp</sub> = v²/R = ω²R</td><td class="m">m/s²</td></tr>
</tbody></table></div>
<h3>Forța centripetă</h3>
<div class="fx big">F<sub>cp</sub> = m·v²/R = m·ω²·R</div>
<p>Este îndreptată spre centrul cercului. Rolul ei îl joacă, după caz, frecarea (mașina în curbă), tensiunea din fir (piatra legată), greutatea (satelitul).</p>
<ul><li><b>Mașină în curbă orizontală:</b> μmg ≥ mv²/R, deci v<sub>max</sub> = √(μgR).</li>
<li><b>Punctul de sus al unei bucle verticale:</b> mg + N = mv²/R; viteza minimă (N = 0) este v = √(gR).</li>
<li><b>Punctul de jos:</b> N − mg = mv²/R, deci apăsarea este mai mare decât greutatea.</li></ul>
<h3>Legea atracției universale</h3>
<div class="fx big">F = K·m₁·m₂/r² ,  K = 6,67·10⁻¹¹ N·m²/kg²</div>
<p>La suprafața unei planete de masă M și rază R: g = K·M/R². Un satelit pe orbită circulară de rază r are viteza v = √(KM/r). Lângă suprafața Pământului rezultă prima viteză cosmică, v = √(gR) ≈ 7,9 km/s.</p>
<div class="keep"><b>Atenție:</b> r se măsoară între centrele corpurilor. La înălțimea h deasupra solului, r = R + h.</div>` },
{ id:'m-statica', g:'mext', nb:true, t:'Elemente de statică', d:'Momentul forței, condiții de echilibru, pârghii',
  brief:['Un corp este în echilibru dacă rezultanta forțelor este zero și suma momentelor este zero.','Momentul forței este produsul dintre forță și brațul ei.','La pârghie: forța mică are brațul mare.'], html:`
<p>Statica studiază corpurile aflate în <b>echilibru</b>: în repaus sau în mișcare rectilinie uniformă, fără rotație accelerată.</p>
<h3>Momentul forței</h3>
<div class="fx big">M = F·b</div>
<p>b este <b>brațul forței</b>: distanța de la axa de rotație la dreapta suport a forței (perpendiculara dusă din axă). Unitatea este N·m. Momentele care rotesc într-un sens se iau cu plus, celelalte cu minus.</p>
<h3>Condițiile de echilibru</h3>
<div class="tw"><table><thead><tr><th>Echilibru de</th><th>Condiție</th></tr></thead><tbody>
<tr><td>translație</td><td class="m">ΣF = 0 (pe Ox și pe Oy)</td></tr>
<tr><td>rotație</td><td class="m">ΣM = 0 (față de orice axă)</td></tr>
</tbody></table></div>
<h3>Aplicații</h3>
<ul><li><b>Pârghia:</b> F₁·b₁ = F₂·b₂. Cu un braț de 4 ori mai lung ridici o greutate de 4 ori mai mare.</li>
<li><b>Cuplul de forțe:</b> două forțe egale, paralele, de sens opus; momentul cuplului este M = F·d, cu d distanța dintre ele.</li>
<li><b>Centrul de greutate:</b> x<sub>C</sub> = (m₁x₁ + m₂x₂ + …)/(m₁ + m₂ + …).</li>
<li><b>Bară sprijinită la capete:</b> scrii ΣM = 0 față de un capăt, ca să dispară reacțiunea de acolo.</li></ul>
<h3>Tipuri de echilibru</h3>
<p><b>Stabil:</b> scos puțin din poziție, corpul revine (centrul de greutate urcă). <b>Instabil:</b> se îndepărtează (centrul de greutate coboară). <b>Indiferent:</b> rămâne în noua poziție.</p>
<div class="keep"><b>Metodă:</b> desenezi toate forțele, alegi axa de rotație în punctul prin care trec cele mai multe forțe necunoscute, scrii ΣM = 0, apoi ΣF = 0.</div>` },
{ id:'o-oglinzi', g:'oinst', nb:true, t:'Oglinzi plane și sferice', d:'Imagini în oglinzi, formula oglinzilor sferice',
  brief:['Oglinda plană dă o imagine virtuală, dreaptă, egală cu obiectul și simetrică față de oglindă.','La oglinda sferică focarul este la jumătatea razei: f = R/2.','Formula oglinzilor: 1/x₁ + 1/x₂ = 1/f, cu β = −x₂/x₁.'], html:`
<h3>Oglinda plană</h3>
<p>Imaginea este <b>virtuală</b>, dreaptă, de aceeași mărime cu obiectul și așezată simetric: la aceeași distanță în spatele oglinzii. Dacă oglinda se rotește cu unghiul α, raza reflectată se rotește cu 2α.</p>
<h3>Oglinzi sferice</h3>
<p>Oglinda <b>concavă</b> are suprafața reflectătoare în interiorul sferei și strânge razele paralele în focar. Oglinda <b>convexă</b> le împrăștie; focarul ei este virtual.</p>
<div class="fx big">1/x₁ + 1/x₂ = 2/R = 1/f ;  β = y₂/y₁ = −x₂/x₁</div>
<p>Distanțele se măsoară de la vârful oglinzii, cu plus în sensul luminii incidente. Obiectul real are x₁ &lt; 0. Pentru oglinda concavă R &lt; 0 și f &lt; 0; pentru cea convexă R &gt; 0 și f &gt; 0.</p>
<div class="tw"><table><thead><tr><th>Oglinda concavă, obiectul</th><th>Imaginea</th></tr></thead><tbody>
<tr><td>dincolo de centru</td><td>reală, răsturnată, micșorată</td></tr>
<tr><td>între centru și focar</td><td>reală, răsturnată, mărită</td></tr>
<tr><td>între focar și oglindă</td><td>virtuală, dreaptă, mărită</td></tr>
</tbody></table></div>
<p>Oglinda convexă dă mereu o imagine virtuală, dreaptă și micșorată (oglinzile retrovizoare, cele din intersecții).</p>
<h3>Exemplu</h3>
<p>Oglindă concavă cu R = −40 cm (f = −20 cm), obiect la 60 cm: x₁ = −60 cm. 1/x₂ = 1/f − 1/x₁ = −1/20 + 1/60, deci x₂ = −30 cm: imagine reală, în fața oglinzii. β = −x₂/x₁ = −0,5: răsturnată, de două ori mai mică.</p>` },
{ id:'o-instrumente', g:'oinst', nb:true, t:'Ochiul și instrumentele optice', d:'Defecte de vedere, lupa, microscopul, luneta',
  brief:['Ochiul formează pe retină o imagine reală, răsturnată și micșorată.','Miopia se corectează cu lentile divergente, hipermetropia cu lentile convergente.','Lupa, microscopul și luneta măresc unghiul sub care se vede obiectul.'], html:`
<h3>Ochiul</h3>
<p>Cristalinul este o lentilă convergentă cu distanță focală variabilă (<b>acomodare</b>). Imaginea se formează pe retină. Pentru ochiul normal, punctul proxim este la δ = 25 cm, iar punctul remot la infinit.</p>
<div class="tw"><table><thead><tr><th>Defect</th><th>Ce se întâmplă</th><th>Corecție</th></tr></thead><tbody>
<tr><td>Miopie</td><td>imaginea obiectelor depărtate se formează în fața retinei</td><td>lentile divergente (C &lt; 0)</td></tr>
<tr><td>Hipermetropie</td><td>imaginea obiectelor apropiate s-ar forma în spatele retinei</td><td>lentile convergente (C &gt; 0)</td></tr>
<tr><td>Prezbitism</td><td>cristalinul își pierde elasticitatea cu vârsta</td><td>lentile convergente pentru citit</td></tr>
</tbody></table></div>
<p>Lentila pentru miop aduce în punctul lui remot imaginea obiectelor de la infinit: f = −d<sub>remot</sub>.</p>
<h3>Lupa</h3>
<div class="fx">G = δ/f = δ·C , cu δ = 0,25 m</div>
<p>Obiectul stă între focar și lentilă; imaginea este virtuală, dreaptă și mărită.</p>
<h3>Microscopul</h3>
<div class="fx">G = δ·e/(f<sub>ob</sub>·f<sub>oc</sub>)</div>
<p>Obiectivul (f mic) dă o imagine reală mărită, privită apoi prin ocular ca printr-o lupă. e este intervalul optic, adică distanța dintre focarul imagine al obiectivului și focarul obiect al ocularului.</p>
<h3>Luneta astronomică</h3>
<div class="fx">G = f<sub>ob</sub>/f<sub>oc</sub> ;  lungimea ≈ f<sub>ob</sub> + f<sub>oc</sub></div>
<p>Este un sistem afocal: focarul imagine al obiectivului coincide cu focarul obiect al ocularului.</p>
<h3>Aparatul fotografic</h3>
<p>Obiectivul convergent formează pe senzor o imagine reală, răsturnată și micșorată. Diafragma reglează cantitatea de lumină.</p>` },
{ id:'ca-magnetic', g:'cmag', t:'Câmpul magnetic și forța electromagnetică', d:'Inducția B, forța pe conductor, forța Lorentz',
  brief:['Curentul electric creează câmp magnetic; mărimea care îl descrie este inducția B, în tesla.','Pe un conductor parcurs de curent, aflat în câmp, acționează F = B·I·l·sin α.','Pe o sarcină în mișcare acționează forța Lorentz, perpendiculară pe viteză.'], html:`
<p>În jurul magneților și al conductoarelor parcurse de curent există <b>câmp magnetic</b>. El se descrie prin <b>inducția magnetică</b> B, măsurată în tesla (T), și se reprezintă prin linii de câmp închise.</p>
<h3>Câmpul creat de curenți</h3>
<div class="tw"><table><thead><tr><th>Conductor</th><th>Inducția</th></tr></thead><tbody>
<tr><td>Fir rectiliniu lung, la distanța r</td><td class="m">B = μ·I/(2π·r)</td></tr>
<tr><td>Centrul unei spire de rază R</td><td class="m">B = μ·I/(2R)</td></tr>
<tr><td>Interiorul unui solenoid (N spire, lungime l)</td><td class="m">B = μ·N·I/l</td></tr>
</tbody></table></div>
<p>μ = μ₀·μ<sub>r</sub>, cu μ₀ = 4π·10⁻⁷ N/A². Sensul liniilor de câmp se află cu regula burghiului (a mâinii drepte).</p>
<h3>Forța electromagnetică</h3>
<div class="fx big">F = B·I·l·sin α</div>
<p>α este unghiul dintre conductor și liniile de câmp. Forța este perpendiculară și pe conductor, și pe B; sensul se află cu regula mâinii stângi. Dacă firul este paralel cu liniile de câmp, F = 0.</p>
<h3>Doi conductori paraleli</h3>
<div class="fx">F = μ·I₁·I₂·l/(2π·d)</div>
<p>Curenții de același sens se atrag, cei de sens opus se resping. Pe această forță se bazează definiția amperului.</p>
<h3>Forța Lorentz</h3>
<div class="fx big">f = q·v·B·sin α</div>
<p>Fiind perpendiculară pe viteză, nu efectuează lucru mecanic: schimbă doar direcția vitezei. O particulă intrată perpendicular pe câmp descrie un cerc:</p>
<div class="fx">r = m·v/(q·B) ;  T = 2π·m/(q·B)</div>
<div class="keep"><b>De reținut:</b> perioada nu depinde de viteză. Pe asta se bazează ciclotronul.</div>` },
{ id:'ca-inductie', g:'cmag', t:'Inducția electromagnetică', d:'Flux magnetic, legea lui Faraday, regula lui Lenz, autoinducție',
  brief:['Tensiunea indusă apare doar cât timp fluxul magnetic variază.','e = −ΔΦ/Δt; minusul exprimă regula lui Lenz.','Bobina se opune variației curentului prin ea: autoinducție.'], html:`
<h3>Fluxul magnetic</h3>
<div class="fx big">Φ = B·S·cos α</div>
<p>α este unghiul dintre B și normala la suprafață. Unitatea este weberul: 1 Wb = 1 T·m².</p>
<h3>Legea lui Faraday</h3>
<div class="fx big">e = −ΔΦ/Δt ;  pentru N spire: e = −N·ΔΦ/Δt</div>
<p>Fluxul poate varia prin schimbarea lui B, a ariei sau a orientării. <b>Regula lui Lenz:</b> curentul indus are un asemenea sens încât câmpul lui se opune variației fluxului care l-a produs.</p>
<h3>Conductor care se mișcă în câmp</h3>
<div class="fx">e = B·l·v</div>
<p>Valabil când conductorul, viteza și B sunt perpendiculare între ele. Curentul din circuit este I = e/(R + r).</p>
<h3>Autoinducția</h3>
<div class="fx big">Φ = L·I ;  e = −L·ΔI/Δt</div>
<p>L este <b>inductanța</b> bobinei, în henry (H). Pentru un solenoid: L = μ·N²·S/l. La închiderea circuitului, curentul crește treptat; la deschidere apare o tensiune mare (scânteia de la întrerupător).</p>
<h3>Energia câmpului magnetic</h3>
<div class="fx">W = L·I²/2</div>
<h3>Exemplu</h3>
<p>O bobină cu 200 de spire este străbătută de un flux care scade de la 5 mWb la 1 mWb în 0,02 s. |e| = N·|ΔΦ|/Δt = 200·4·10⁻³/0,02 = 40 V.</p>` },
{ id:'ca-marimi', g:'calt', t:'Curentul alternativ: mărimi', d:'Producere, frecvență, valori maxime și efective',
  brief:['Tensiunea alternativă variază sinusoidal: u = U_m·sin ωt.','Aparatele de măsură arată valorile efective: U = U_m/√2.','În rețea: 230 V efectiv, 50 Hz.'], html:`
<p>O spiră care se rotește uniform într-un câmp magnetic este străbătută de un flux variabil, deci în ea se induce o tensiune <b>alternativă sinusoidală</b>.</p>
<div class="fx big">e = E<sub>m</sub>·sin ωt ,  E<sub>m</sub> = N·B·S·ω</div>
<h3>Mărimi caracteristice</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Relație</th></tr></thead><tbody>
<tr><td>Valoarea instantanee</td><td class="m">u = U<sub>m</sub>·sin ωt ; i = I<sub>m</sub>·sin(ωt − φ)</td></tr>
<tr><td>Pulsația</td><td class="m">ω = 2π·ν = 2π/T</td></tr>
<tr><td>Valoarea efectivă</td><td class="m">U = U<sub>m</sub>/√2 ; I = I<sub>m</sub>/√2</td></tr>
<tr><td>Defazajul</td><td class="m">φ = unghiul cu care tensiunea este înaintea curentului</td></tr>
</tbody></table></div>
<p><b>Valoarea efectivă</b> a curentului alternativ este intensitatea curentului continuu care degajă aceeași căldură în același rezistor, în același timp.</p>
<h3>Rețeaua casnică</h3>
<p>U = 230 V și ν = 50 Hz. Rezultă U<sub>m</sub> = 230·√2 ≈ 325 V, T = 0,02 s și ω = 100π ≈ 314 rad/s.</p>
<h3>Fazori</h3>
<p>O mărime sinusoidală se reprezintă printr-un vector rotitor (fazor) cu lungimea egală cu valoarea maximă sau efectivă. Mărimile de aceeași frecvență se adună vectorial, ținând cont de defazaje.</p>
<div class="keep"><b>Atenție:</b> în formulele de putere și în legea lui Ohm în curent alternativ se folosesc valorile efective.</div>` },
{ id:'ca-rlc', g:'calt', t:'Circuite RLC', d:'Reactanțe, impedanță, defazaj, rezonanță',
  brief:['Bobina are reactanța X_L = ωL, condensatorul X_C = 1/(ωC).','În RLC serie: Z = √(R² + (X_L − X_C)²) și I = U/Z.','La rezonanță X_L = X_C, impedanța este minimă (Z = R) și curentul maxim.'], html:`
<h3>Elemente simple</h3>
<div class="tw"><table><thead><tr><th>Element</th><th>„Rezistența”</th><th>Defazaj</th></tr></thead><tbody>
<tr><td>Rezistor</td><td class="m">R</td><td>u și i în fază</td></tr>
<tr><td>Bobină ideală</td><td class="m">X<sub>L</sub> = ω·L</td><td>u înaintea lui i cu π/2</td></tr>
<tr><td>Condensator</td><td class="m">X<sub>C</sub> = 1/(ω·C)</td><td>u în urma lui i cu π/2</td></tr>
</tbody></table></div>
<p>Reactanța bobinei crește cu frecvența; a condensatorului scade. În curent continuu (ω = 0) condensatorul întrerupe circuitul, iar bobina ideală nu opune nimic.</p>
<h3>Circuitul RLC serie</h3>
<div class="fx big">Z = √(R² + (X<sub>L</sub> − X<sub>C</sub>)²) ;  I = U/Z</div>
<div class="fx">tg φ = (X<sub>L</sub> − X<sub>C</sub>)/R ;  U² = U<sub>R</sub>² + (U<sub>L</sub> − U<sub>C</sub>)²</div>
<p>Tensiunile nu se adună aritmetic, ci vectorial. Dacă X<sub>L</sub> &gt; X<sub>C</sub> circuitul este inductiv (φ &gt; 0); altfel este capacitiv.</p>
<h3>Rezonanța tensiunilor</h3>
<div class="fx big">X<sub>L</sub> = X<sub>C</sub> ⇒ ω₀ = 1/√(L·C) ;  ν₀ = 1/(2π√(L·C))</div>
<p>La rezonanță Z = R, curentul este maxim (I = U/R), φ = 0, iar U<sub>L</sub> = U<sub>C</sub> pot depăși mult tensiunea sursei. Factorul de calitate: Q = U<sub>L</sub>/U = ω₀L/R = (1/R)·√(L/C).</p>
<h3>Circuitul RLC paralel</h3>
<p>Se adună vectorial curenții: I² = I<sub>R</sub>² + (I<sub>C</sub> − I<sub>L</sub>)². La rezonanța curenților (tot la ω₀), curentul total este minim.</p>
<h3>Exemplu</h3>
<p>R = 30 Ω, X<sub>L</sub> = 80 Ω, X<sub>C</sub> = 40 Ω, U = 100 V. Z = √(30² + 40²) = 50 Ω; I = 2 A; tg φ = 40/30, deci cos φ = R/Z = 0,6.</p>` },
{ id:'ca-putere', g:'calt', t:'Puterea în curent alternativ și transformatorul', d:'Putere activă, reactivă, aparentă; transportul energiei',
  brief:['Puterea activă este P = U·I·cos φ; doar rezistorul consumă energie.','S² = P² + Q²; factorul de putere este cos φ = R/Z.','Transformatorul: U₁/U₂ = N₁/N₂. Energia se transportă la tensiune înaltă ca să scadă pierderile.'], html:`
<h3>Puteri</h3>
<div class="tw"><table><thead><tr><th>Putere</th><th>Formulă</th><th>Unitate</th></tr></thead><tbody>
<tr><td>Activă</td><td class="m">P = U·I·cos φ = R·I²</td><td class="m">W</td></tr>
<tr><td>Reactivă</td><td class="m">Q = U·I·sin φ</td><td class="m">VAR</td></tr>
<tr><td>Aparentă</td><td class="m">S = U·I = Z·I²</td><td class="m">VA</td></tr>
</tbody></table></div>
<div class="fx">S² = P² + Q² ;  cos φ = P/S = R/Z</div>
<p>Bobina și condensatorul ideale nu consumă energie: o iau și o dau înapoi de două ori pe perioadă. <b>Factorul de putere</b> cos φ trebuie să fie cât mai aproape de 1, altfel pe linie circulă curent mare pentru aceeași putere utilă.</p>
<h3>Transformatorul</h3>
<div class="fx big">U₁/U₂ = N₁/N₂ = k</div>
<p>Funcționează doar în curent alternativ, pe baza inducției electromagnetice. Pentru transformatorul ideal U₁·I₁ = U₂·I₂, deci I₁/I₂ = N₂/N₁: unde tensiunea crește, curentul scade. Randamentul real: η = P₂/P₁.</p>
<h3>Transportul energiei</h3>
<p>Pierderile pe linie sunt P<sub>p</sub> = R<sub>linie</sub>·I² = R<sub>linie</sub>·P²/U². Ridicând tensiunea de 10 ori, pierderile scad de 100 de ori. De aceea la centrală se folosește un transformator ridicător, iar la consumator unul coborâtor.</p>
<h3>Exemplu</h3>
<p>Un transformator ideal are N₁ = 1000 și N₂ = 50 de spire și primește 230 V. U₂ = 230·50/1000 = 11,5 V. Dacă în secundar I₂ = 4 A, în primar I₁ = 4·50/1000 = 0,2 A.</p>` }
];
const L_B = [
{ id:'os-armonic', g:'oosc', t:'Oscilatorul armonic', d:'Elongație, viteză, accelerație, perioadă, energie',
  brief:['Mișcarea este armonică atunci când forța de revenire este proporțională cu elongația: F = −kx.','x = A·sin(ωt + φ₀), cu ω = √(k/m) și T = 2π√(m/k).','Energia totală E = kA²/2 se conservă; trece din cinetică în potențială și înapoi.'], html:`
<p>O <b>oscilație</b> este o mișcare care se repetă de o parte și de alta a poziției de echilibru. Dacă forța care readuce corpul este de tip elastic, F = −k·x, oscilația este <b>armonică</b>.</p>
<h3>Legile mișcării</h3>
<div class="fx big">x = A·sin(ωt + φ₀)</div>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Lege</th><th>Valoare maximă</th></tr></thead><tbody>
<tr><td>Elongația</td><td class="m">x = A·sin(ωt + φ₀)</td><td class="m">A (amplitudinea)</td></tr>
