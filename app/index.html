<tr><td>Viteza</td><td class="m">v = ωA·cos(ωt + φ₀)</td><td class="m">v<sub>max</sub> = ωA</td></tr>
<tr><td>Accelerația</td><td class="m">a = −ω²·x</td><td class="m">a<sub>max</sub> = ω²A</td></tr>
</tbody></table></div>
<p>Viteza este maximă la trecerea prin poziția de echilibru și zero la capete. Accelerația este maximă la capete și zero la echilibru. Legătura fără timp: v = ω·√(A² − x²).</p>
<h3>Perioada</h3>
<div class="fx big">ω = √(k/m) ;  T = 2π·√(m/k) ;  ν = 1/T</div>
<p>Perioada nu depinde de amplitudine. Faza este ωt + φ₀, iar φ₀ este faza inițială (fixată de poziția la t = 0).</p>
<h3>Energia</h3>
<div class="fx">E<sub>p</sub> = k·x²/2 ;  E<sub>c</sub> = m·v²/2 ;  E = k·A²/2 = m·ω²·A²/2</div>
<p>E<sub>c</sub> = E<sub>p</sub> când x = A/√2.</p>
<h3>Exemplu</h3>
<p>m = 0,1 kg, k = 10 N/m, A = 5 cm. ω = √(10/0,1) = 10 rad/s; T = 2π/10 ≈ 0,63 s; v<sub>max</sub> = 10·0,05 = 0,5 m/s; E = 10·0,05²/2 = 12,5 mJ.</p>` },
{ id:'os-pendul', g:'oosc', t:'Pendulul, compunerea oscilațiilor și rezonanța', d:'T = 2π√(l/g), oscilații amortizate și forțate',
  brief:['Pendulul gravitațional are T = 2π√(l/g) la unghiuri mici; perioada nu depinde de masă.','Două oscilații paralele de aceeași frecvență dau A² = A₁² + A₂² + 2A₁A₂cos Δφ.','Rezonanța: amplitudinea este maximă când frecvența forței exterioare este egală cu frecvența proprie.'], html:`
<h3>Pendulul gravitațional</h3>
<div class="fx big">T = 2π·√(l/g)</div>
<p>Formula este valabilă pentru unghiuri mici (sub aproximativ 5°). Perioada nu depinde de masă și nici de amplitudine. Într-un lift accelerat, g se înlocuiește cu g ± a.</p>
<h3>Compunerea oscilațiilor paralele de aceeași frecvență</h3>
<div class="fx">A² = A₁² + A₂² + 2·A₁·A₂·cos Δφ</div>
<div class="tw"><table><thead><tr><th>Defazaj</th><th>Amplitudinea rezultantă</th></tr></thead><tbody>
<tr><td>Δφ = 0 (în fază)</td><td class="m">A = A₁ + A₂</td></tr>
<tr><td>Δφ = π (în opoziție)</td><td class="m">A = |A₁ − A₂|</td></tr>
<tr><td>Δφ = π/2 (în cuadratură)</td><td class="m">A = √(A₁² + A₂²)</td></tr>
</tbody></table></div>
<h3>Oscilații amortizate</h3>
<p>Din cauza frecărilor, energia scade, iar amplitudinea se micșorează în timp: A(t) = A₀·e<sup>−δt</sup>. Oscilatorul pierde energie sub formă de căldură.</p>
<h3>Oscilații forțate și rezonanță</h3>
<p>O forță exterioară periodică întreține oscilațiile; sistemul oscilează cu frecvența forței. Când această frecvență este egală cu <b>frecvența proprie</b>, amplitudinea devine maximă: <b>rezonanță</b>. Cu cât amortizarea este mai mică, cu atât maximul este mai înalt și mai îngust.</p>
<p>Exemple: leagănul împins în ritmul lui, podurile sub pas cadențat, acordarea unui aparat radio.</p>
<h3>Exemplu</h3>
<p>Un pendul cu l = 1 m, la g = 10 m/s²: T = 2π·√0,1 ≈ 1,99 s. Dacă lungimea crește de 4 ori, perioada se dublează.</p>` },
{ id:'os-unde', g:'ound', t:'Unde mecanice', d:'Lungime de undă, ecuația undei plane, viteză, reflexie și refracție',
  brief:['Unda transportă energie, nu substanță.','λ = v·T = v/ν; frecvența este dată de sursă, viteza de mediu.','Ecuația undei plane: y = A·sin 2π(t/T − x/λ).'], html:`
<p>O <b>undă mecanică</b> este propagarea unei perturbații printr-un mediu elastic. Particulele oscilează în jurul pozițiilor lor; se transmite energia, nu substanța.</p>
<ul><li><b>Transversale:</b> oscilația este perpendiculară pe direcția de propagare (coarda, suprafața apei).</li>
<li><b>Longitudinale:</b> oscilația este pe direcția de propagare (sunetul în aer).</li></ul>
<h3>Lungimea de undă</h3>
<div class="fx big">λ = v·T = v/ν</div>
<p>λ este distanța parcursă de undă într-o perioadă, adică distanța dintre două puncte vecine care oscilează în fază.</p>
<h3>Ecuația undei plane</h3>
<div class="fx big">y(x, t) = A·sin 2π(t/T − x/λ)</div>
<p>Punctul aflat la distanța x de sursă repetă oscilația sursei cu întârzierea x/v. Două puncte la distanța Δx au defazajul Δφ = 2π·Δx/λ.</p>
<h3>Viteza de propagare</h3>
<div class="tw"><table><thead><tr><th>Mediu</th><th>Viteza</th></tr></thead><tbody>
<tr><td>Coardă întinsă (unde transversale)</td><td class="m">v = √(F/μ), F = forța de tensiune, μ = m/l</td></tr>
<tr><td>Bară solidă (unde longitudinale)</td><td class="m">v = √(E/ρ)</td></tr>
<tr><td>Sunetul în aer, la 15–20 °C</td><td class="m">v ≈ 340 m/s</td></tr>
</tbody></table></div>
<h3>Reflexia și refracția</h3>
<p>La suprafața dintre două medii unda se reflectă (unghiul de reflexie este egal cu cel de incidență) și se refractă:</p>
<div class="fx">sin i / sin r = v₁/v₂</div>
<p>La trecerea în alt mediu <b>frecvența rămâne aceeași</b>; se schimbă viteza și lungimea de undă. Principiul lui Huygens: fiecare punct atins de undă devine sursă de unde secundare.</p>` },
{ id:'os-interf', g:'ound', t:'Interferența undelor, unde staționare, acustică', d:'Maxime și minime, noduri și ventre, calitățile sunetului',
  brief:['Maxim de interferență: diferența de drum este kλ. Minim: (2k + 1)λ/2.','În unda staționară, distanța dintre două noduri vecine este λ/2.','Coarda fixată la capete: ν_n = n·v/(2l).'], html:`
<h3>Interferența</h3>
<p>Două unde <b>coerente</b> (aceeași frecvență, defazaj constant) se suprapun și dau o distribuție stabilă de maxime și minime.</p>
<div class="tw"><table><thead><tr><th>Rezultat</th><th>Diferența de drum Δ = |r₂ − r₁|</th></tr></thead><tbody>
<tr><td>Maxim (A = A₁ + A₂)</td><td class="m">Δ = k·λ</td></tr>
<tr><td>Minim (A = |A₁ − A₂|)</td><td class="m">Δ = (2k + 1)·λ/2</td></tr>
</tbody></table></div>
<h3>Unde staționare</h3>
<p>Apar când unda incidentă se suprapune cu cea reflectată. <b>Nodurile</b> nu oscilează deloc; <b>ventrele</b> oscilează cu amplitudine maximă. Distanța dintre două noduri vecine este λ/2, iar dintre un nod și ventrul vecin λ/4.</p>
<div class="tw"><table><thead><tr><th>Sistem</th><th>Condiție</th><th>Frecvențe proprii</th></tr></thead><tbody>
<tr><td>Coardă fixată la ambele capete</td><td class="m">l = n·λ/2</td><td class="m">ν<sub>n</sub> = n·v/(2l)</td></tr>
<tr><td>Tub închis la un capăt</td><td class="m">l = (2n − 1)·λ/4</td><td class="m">ν<sub>n</sub> = (2n − 1)·v/(4l)</td></tr>
</tbody></table></div>
<p>n = 1 dă sunetul fundamental; celelalte sunt armonicele superioare.</p>
<h3>Difracția</h3>
<p>Unda ocolește obstacolele și pătrunde în spatele lor. Efectul este vizibil când dimensiunea obstacolului sau a fantei este comparabilă cu λ.</p>
<h3>Acustică</h3>
<p>Urechea percepe sunete între 16 Hz și 20 000 Hz. Sub 16 Hz sunt infrasunete, peste 20 kHz ultrasunete.</p>
<ul><li><b>Înălțimea</b> este dată de frecvență.</li><li><b>Intensitatea</b> este energia transportată în unitatea de timp prin unitatea de arie (W/m²).</li><li><b>Timbrul</b> depinde de armonicele care însoțesc sunetul fundamental.</li></ul>
<div class="fx">Nivelul de intensitate: N = 10·lg(I/I₀) dB , I₀ = 10⁻¹² W/m²</div>` },
{ id:'em-circuit', g:'eem', t:'Circuitul oscilant', d:'Formula lui Thomson, energia în circuitul LC',
  brief:['Într-un circuit LC energia trece periodic din condensator în bobină și înapoi.','Perioada proprie: T = 2π√(LC).','q_m²/(2C) = L·I_m²/2 și I_m = ω·q_m.'], html:`
<p>Un condensator încărcat, legat la o bobină, se descarcă prin ea. Bobina se opune variației curentului, așa că sarcina trece „dincolo” și condensatorul se reîncarcă invers. Procesul se repetă: apar <b>oscilații electromagnetice</b>.</p>
<h3>Formula lui Thomson</h3>
<div class="fx big">T = 2π·√(L·C) ;  ν₀ = 1/(2π√(L·C)) ;  ω₀ = 1/√(L·C)</div>
<h3>Legile oscilației</h3>
<div class="fx">q = q<sub>m</sub>·cos ω₀t ;  i = −ω₀·q<sub>m</sub>·sin ω₀t ;  I<sub>m</sub> = ω₀·q<sub>m</sub></div>
<h3>Energia</h3>
<div class="fx">W = q²/(2C) + L·i²/2 = q<sub>m</sub>²/(2C) = L·I<sub>m</sub>²/2</div>
<p>Când condensatorul este încărcat la maximum, curentul este zero și toată energia este electrică. După un sfert de perioadă condensatorul este descărcat, curentul este maxim și toată energia este magnetică.</p>
<h3>Analogia cu oscilatorul mecanic</h3>
<div class="tw"><table><thead><tr><th>Mecanic</th><th>Electric</th></tr></thead><tbody>
<tr><td>elongația x</td><td>sarcina q</td></tr><tr><td>viteza v</td><td>intensitatea i</td></tr>
<tr><td>masa m</td><td>inductanța L</td></tr><tr><td>constanta elastică k</td><td>1/C</td></tr>
<tr><td>kx²/2 și mv²/2</td><td>q²/(2C) și Li²/2</td></tr>
</tbody></table></div>
<p>În circuitul real, rezistența R transformă treptat energia în căldură și oscilațiile se amortizează. Ele pot fi întreținute cu o sursă exterioară.</p>
<h3>Exemplu</h3>
<p>L = 1 mH, C = 10 nF: √(LC) = √(10⁻¹¹) ≈ 3,16·10⁻⁶ s, deci T ≈ 19,9 µs și ν₀ ≈ 50 kHz.</p>` },
{ id:'em-unde', g:'eem', t:'Unde electromagnetice', d:'Proprietăți, viteză, spectrul electromagnetic',
  brief:['Unda electromagnetică este formată din câmp electric și câmp magnetic variabile, perpendiculare între ele și pe direcția de propagare.','În vid se propagă cu c = 3·10⁸ m/s; λ = c/ν.','Spectrul: radio, microunde, infraroșu, vizibil, ultraviolet, X, gama.'], html:`
<p>Un câmp magnetic variabil generează câmp electric, iar un câmp electric variabil generează câmp magnetic (Maxwell). Cele două se întrețin reciproc și se propagă sub formă de <b>undă electromagnetică</b>, care nu are nevoie de mediu.</p>
<h3>Proprietăți</h3>
<ul><li>Este o undă transversală: E ⊥ B și amândouă perpendiculare pe direcția de propagare.</li>
<li>E și B oscilează în fază; E = c·B.</li>
<li>Se reflectă, se refractă, interferă, se difractă și se polarizează.</li></ul>
<div class="fx big">c = 1/√(ε₀·μ₀) = 3·10⁸ m/s ;  λ = c/ν = c·T</div>
<p>Într-un mediu: v = c/√(ε<sub>r</sub>·μ<sub>r</sub>) = c/n.</p>
<h3>Emisia și recepția</h3>
<p>Un circuit oscilant deschis (antena) radiază unde cu lungimea de undă λ = c·T = 2π·c·√(L·C). Receptorul se acordă prin rezonanță, modificând C sau L până când frecvența proprie devine egală cu a postului.</p>
<h3>Spectrul electromagnetic</h3>
<div class="tw"><table><thead><tr><th>Domeniu</th><th>λ aproximativ</th><th>Utilizări</th></tr></thead><tbody>
<tr><td>Unde radio</td><td class="m">km … 1 m</td><td>radio, televiziune</td></tr>
<tr><td>Microunde</td><td class="m">1 m … 1 mm</td><td>radar, telefonie, cuptor</td></tr>
<tr><td>Infraroșu</td><td class="m">1 mm … 750 nm</td><td>telecomenzi, termoviziune</td></tr>
<tr><td>Vizibil</td><td class="m">750 … 400 nm</td><td>vedere</td></tr>
<tr><td>Ultraviolet</td><td class="m">400 … 10 nm</td><td>sterilizare</td></tr>
<tr><td>Raze X</td><td class="m">10 nm … 10 pm</td><td>radiografii</td></tr>
<tr><td>Raze γ</td><td class="m">sub 10 pm</td><td>radioterapie</td></tr>
</tbody></table></div>
<div class="keep"><b>De reținut:</b> cu cât λ este mai mică, cu atât frecvența și energia fotonilor sunt mai mari.</div>` },
{ id:'on-dispersie', g:'oond', o:-1, t:'Dispersia luminii și prisma optică', d:'n depinde de λ, deviație minimă, spectru',
  brief:['Indicele de refracție depinde de lungimea de undă: violetul este deviat cel mai mult.','La prismă: A = r₁ + r₂ și δ = i₁ + i₂ − A.','La trecerea în alt mediu frecvența nu se schimbă; λ = λ₀/n.'], html:`
<p><b>Dispersia</b> este dependența indicelui de refracție de lungimea de undă. În sticlă, n crește când λ scade: lumina violetă are indice mai mare decât cea roșie, deci este deviată mai mult. De aceea prisma descompune lumina albă în spectru (roșu, oranj, galben, verde, albastru, indigo, violet).</p>
<h3>Lumina într-un mediu</h3>
<div class="fx big">v = c/n ;  λ = λ₀/n ;  ν rămâne neschimbată</div>
<h3>Prisma optică</h3>
<div class="fx big">A = r₁ + r₂ ;  δ = i₁ + i₂ − A</div>
<p>A este unghiul refringent (dintre fețele prin care trece lumina), iar δ este unghiul de deviație dintre raza incidentă și cea emergentă. La fiecare față: sin i = n·sin r.</p>
<h3>Deviația minimă</h3>
<p>Deviația este minimă când mersul razei este simetric: i₁ = i₂ și r₁ = r₂ = A/2.</p>
<div class="fx big">n = sin((A + δ<sub>m</sub>)/2) / sin(A/2)</div>
<p>Pentru o prismă subțire (A mic) și incidență aproape normală: δ = (n − 1)·A.</p>
<h3>Condiția de emergență</h3>
<p>Raza iese din prismă doar dacă pe fața a doua r₂ este mai mic decât unghiul limită. Altfel are loc reflexie totală (prismele cu reflexie totală din binoclu și periscop).</p>
<h3>Exemplu</h3>
<p>Prismă cu A = 60° și deviație minimă δ<sub>m</sub> = 30°: n = sin 45°/sin 30° = 0,707/0,5 ≈ 1,41.</p>
<p>Curcubeul apare prin refracția, reflexia și dispersia luminii în picăturile de apă.</p>` },
{ id:'on-lame', g:'oond', o:1, t:'Interferența în lame subțiri', d:'Lama cu fețe paralele, pana optică, straturi antireflex',
  brief:['Culorile baloanelor de săpun vin din interferența razelor reflectate pe cele două fețe.','Reflexia pe un mediu mai dens optic adaugă λ/2 la diferența de drum.','Pana optică: i = λ/(2nα), cu α în radiani.'], html:`
<p>Lumina reflectată pe fața de sus a unei pelicule subțiri interferă cu cea reflectată pe fața de jos. Fiind obținute din aceeași rază, undele sunt coerente. Franjele sunt <b>localizate</b> pe lamă sau la infinit.</p>
<h3>Lama cu fețe plan-paralele, în lumină reflectată</h3>
<div class="fx big">Δ = 2·n·d·cos r + λ/2</div>
<p>d este grosimea, n indicele lamei, r unghiul de refracție. Termenul λ/2 apare pentru că la reflexia pe un mediu mai dens optic unda își schimbă faza cu π.</p>
<div class="tw"><table><thead><tr><th>În reflexie</th><th>Condiție</th></tr></thead><tbody>
<tr><td>Maxim</td><td class="m">2·n·d·cos r = (2k − 1)·λ/2</td></tr>
<tr><td>Minim</td><td class="m">2·n·d·cos r = k·λ</td></tr>
</tbody></table></div>
<p>În lumină transmisă situația se inversează: unde în reflexie este maxim, în transmisie este minim.</p>
<h3>Pana optică</h3>
<div class="fx big">i = λ/(2·n·α)</div>
<p>Grosimea variază liniar, iar franjele sunt drepte, paralele cu muchia și echidistante. Pentru pana de aer, n = 1. Între două franje vecine grosimea crește cu λ/(2n).</p>
<h3>Aplicații</h3>
<ul><li><b>Straturi antireflex:</b> grosimea minimă este d = λ/(4n), astfel încât razele reflectate să se anuleze.</li>
<li><b>Inelele lui Newton:</b> franje circulare între o lentilă plan-convexă și o placă plană.</li>
<li>Controlul planeității suprafețelor.</li></ul>
<h3>Exemplu</h3>
<p>Pană de aer cu α = 10⁻⁴ rad, luminată cu λ = 600 nm: i = 600·10⁻⁹/(2·10⁻⁴) = 3 mm.</p>` },
{ id:'on-difractie', g:'odif', t:'Difracția și rețeaua de difracție', d:'Fanta, rețeaua, ordinul maxim, spectre',
  brief:['Difracția este abaterea luminii de la propagarea rectilinie la trecerea pe lângă obstacole mici.','Rețeaua de difracție: d·sin α = kλ, cu d = 1/n constanta rețelei.','Ordinul maxim: cel mai mare k întreg cu k ≤ d/λ.'], html:`
<p><b>Difracția</b> este pătrunderea luminii în zona de umbră geometrică. Se observă când fanta sau obstacolul au dimensiuni comparabile cu lungimea de undă. Se explică prin principiul Huygens–Fresnel: undele secundare interferă între ele.</p>
<h3>Difracția pe o fantă</h3>
<div class="fx">Minime: b·sin α = k·λ , k = ±1, ±2, …</div>
<p>b este lățimea fantei. Maximul central este de două ori mai lat decât celelalte și mult mai intens. Cu cât fanta este mai îngustă, cu atât figura se lățește.</p>
<h3>Rețeaua de difracție</h3>
<p>Este un șir de fante paralele, echidistante. <b>Constanta rețelei</b> d este distanța dintre două fante vecine: d = l/N = 1/n, unde n este numărul de trăsături pe unitatea de lungime.</p>
<div class="fx big">d·sin α = k·λ  (incidență normală)</div>
<div class="fx">d·(sin α ± sin i) = k·λ  (incidență sub unghiul i)</div>
<h3>Ordinul maxim și numărul de maxime</h3>
<p>Din sin α ≤ 1 rezultă k ≤ d/λ. Se ia partea întreagă: k<sub>max</sub>. Numărul total de maxime este 2·k<sub>max</sub> + 1.</p>
<h3>Spectre de difracție</h3>
<p>În lumină albă, maximul central rămâne alb, iar celelalte se desfac în spectre. Spre deosebire de prismă, <b>roșul este deviat mai mult</b> decât violetul, pentru că are λ mai mare.</p>
<h3>Exemplu</h3>
<p>Rețea cu 500 de trăsături/mm: d = 2 µm. Pentru λ = 600 nm, maximul de ordinul 2 este la sin α = 2·0,6/2 = 0,6, adică α ≈ 37°. d/λ = 3,33, deci k<sub>max</sub> = 3 și se văd 2·3 + 1 = 7 maxime.</p>` },
{ id:'on-polarizare', g:'odif', t:'Polarizarea luminii', d:'Legea lui Brewster, legea lui Malus',
  brief:['Polarizarea arată că lumina este o undă transversală.','La incidența Brewster, tg i_B = n, raza reflectată este total polarizată și perpendiculară pe cea refractată.','Legea lui Malus: I = I₀·cos²α.'], html:`
<p>În <b>lumina naturală</b> vectorul E oscilează în toate direcțiile perpendiculare pe rază. În lumina <b>liniar polarizată</b> oscilează într-o singură direcție. Doar undele transversale pot fi polarizate.</p>
<h3>Polarizarea prin reflexie. Legea lui Brewster</h3>
<div class="fx big">tg i<sub>B</sub> = n₂/n₁</div>
<p>La acest unghi de incidență lumina reflectată este total polarizată, iar raza reflectată este perpendiculară pe cea refractată: i<sub>B</sub> + r = 90°. Pentru sticlă cu n = 1,5 în aer, i<sub>B</sub> ≈ 56,3°; pentru apă (n = 4/3), i<sub>B</sub> ≈ 53°.</p>
<h3>Polarizori. Legea lui Malus</h3>
<div class="fx big">I = I₀·cos²α</div>
<p>I₀ este intensitatea luminii polarizate care ajunge pe analizor, iar α unghiul dintre direcția ei de polarizare și direcția de transmisie a analizorului.</p>
<div class="tw"><table><thead><tr><th>Situație</th><th>Intensitatea transmisă</th></tr></thead><tbody>
<tr><td>Lumină naturală printr-un polarizor</td><td class="m">I₀/2</td></tr>
<tr><td>Polarizori paraleli (α = 0°)</td><td class="m">maximă</td></tr>
<tr><td>α = 60°</td><td class="m">un sfert din cea incidentă pe analizor</td></tr>
<tr><td>Polarizori încrucișați (α = 90°)</td><td class="m">zero</td></tr>
</tbody></table></div>
<h3>Aplicații</h3>
<p>Ochelarii polarizanți taie reflexiile de pe apă și șosea, ecranele LCD folosesc doi polarizori și cristale lichide, iar în laborator se măsoară concentrația soluțiilor optic active.</p>` }
];
const L_C = [
{ id:'r-postulate', g:'rrel', t:'Postulatele relativității și consecințele lor', d:'Dilatarea duratelor, contracția lungimilor, compunerea vitezelor',
  brief:['Viteza luminii în vid este aceeași în orice sistem de referință inerțial.','Ceasul în mișcare merge mai încet: Δt = γ·Δt₀. Rigla în mișcare este mai scurtă: l = l₀/γ.','γ = 1/√(1 − v²/c²) este mereu cel puțin 1.'], html:`
<p>Mecanica lui Newton nu mai descrie corect corpurile cu viteze apropiate de viteza luminii. Experimentul Michelson–Morley a arătat că viteza luminii nu depinde de mișcarea Pământului. Einstein (1905) a construit teoria pe două postulate.</p>
<h3>Postulatele</h3>
<ol><li><b>Principiul relativității:</b> legile fizicii au aceeași formă în toate sistemele de referință inerțiale.</li>
<li><b>Constanța vitezei luminii:</b> c = 3·10⁸ m/s este aceeași în toate sistemele inerțiale, indiferent de mișcarea sursei sau a observatorului.</li></ol>
<h3>Factorul Lorentz</h3>
<div class="fx big">β = v/c ;  γ = 1/√(1 − β²)</div>
<div class="tw"><table><thead><tr><th>v</th><th>0,6c</th><th>0,8c</th><th>0,866c</th><th>0,99c</th></tr></thead><tbody><tr><td>γ</td><td class="m">1,25</td><td class="m">1,67</td><td class="m">2</td><td class="m">7,09</td></tr></tbody></table></div>
<h3>Consecințe</h3>
<div class="tw"><table><thead><tr><th>Efect</th><th>Relație</th></tr></thead><tbody>
<tr><td>Dilatarea duratelor</td><td class="m">Δt = γ·Δt₀</td></tr>
<tr><td>Contracția lungimilor (pe direcția mișcării)</td><td class="m">l = l₀/γ = l₀·√(1 − β²)</td></tr>
<tr><td>Compunerea vitezelor</td><td class="m">u = (u′ + v)/(1 + u′·v/c²)</td></tr>
</tbody></table></div>
<p>Δt₀ este <b>durata proprie</b>, măsurată de ceasul aflat în repaus față de fenomen. l₀ este <b>lungimea proprie</b>, măsurată în sistemul în care corpul stă pe loc. Două evenimente simultane într-un sistem nu sunt simultane în altul.</p>
<h3>Transformările Lorentz</h3>
<div class="fx">x′ = γ·(x − v·t) ;  t′ = γ·(t − v·x/c²)</div>
<h3>Exemplu</h3>
<p>Miuonii au durata proprie de viață de 2,2 µs. La v = 0,99c, pentru un observator de pe sol trăiesc 7,09·2,2 ≈ 15,6 µs, de aceea ajung la suprafața Pământului.</p>
<div class="keep"><b>Verificare:</b> din compunerea vitezelor nu rezultă niciodată o viteză mai mare decât c. Pentru u′ = c obții u = c.</div>` },
{ id:'r-dinamica', g:'rrel', t:'Dinamica relativistă', d:'Masă, impuls, energie de repaus, energie cinetică',
  brief:['Energia totală: E = γ·m₀c². Energia de repaus: E₀ = m₀c².','Energia cinetică este E_c = (γ − 1)·m₀c², nu mv²/2.','E² = p²c² + m₀²c⁴; pentru foton E = p·c.'], html:`
<h3>Masa și impulsul</h3>
<div class="fx big">m = γ·m₀ ;  p = m·v = γ·m₀·v</div>
<p>m₀ este masa de repaus. Pe măsură ce viteza se apropie de c, γ crește nelimitat: un corp cu masă de repaus nu poate atinge viteza luminii. Principiul fundamental se scrie F = Δp/Δt.</p>
<h3>Energia</h3>
<div class="tw"><table><thead><tr><th>Energie</th><th>Relație</th></tr></thead><tbody>
<tr><td>de repaus</td><td class="m">E₀ = m₀·c²</td></tr>
<tr><td>totală</td><td class="m">E = m·c² = γ·m₀·c²</td></tr>
<tr><td>cinetică</td><td class="m">E<sub>c</sub> = E − E₀ = (γ − 1)·m₀·c²</td></tr>
</tbody></table></div>
<p>La viteze mici, (γ − 1)·m₀c² se reduce la m₀v²/2. Relația E₀ = m₀c² arată echivalența dintre masă și energie: o variație de energie ΔE înseamnă o variație de masă Δm = ΔE/c².</p>
<h3>Legătura energie–impuls</h3>
<div class="fx big">E² = p²·c² + m₀²·c⁴</div>
<p>Pentru foton m₀ = 0, deci E = p·c.</p>
<h3>Valori utile</h3>
<div class="tw"><table><thead><tr><th>Particulă</th><th>m₀c²</th></tr></thead><tbody>
<tr><td>Electron</td><td class="m">0,511 MeV</td></tr><tr><td>Proton</td><td class="m">938 MeV</td></tr><tr><td>1 u</td><td class="m">931,5 MeV</td></tr>
</tbody></table></div>
<h3>Exemplu</h3>
<p>Un electron are v = 0,8c, deci γ = 1,67. E = 1,67·0,511 ≈ 0,852 MeV; E<sub>c</sub> = 0,852 − 0,511 ≈ 0,341 MeV. Dacă energia cinetică este egală cu energia de repaus, γ = 2 și v = 0,866c.</p>` },
{ id:'q-compton', g:'qcu', t:'Fotonul și efectul Compton', d:'Impulsul fotonului, împrăștierea pe electroni liberi',
  brief:['Fotonul are energia ε = hν și impulsul p = h/λ; masa lui de repaus este zero.','În efectul Compton lungimea de undă crește: Δλ = Λ(1 − cos θ), cu Λ = 2,43 pm.','Efectul confirmă că fotonul se ciocnește ca o particulă.'], html:`
<h3>Fotonul</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Relație</th></tr></thead><tbody>
<tr><td>Energia</td><td class="m">ε = h·ν = h·c/λ</td></tr>
<tr><td>Impulsul</td><td class="m">p = h/λ = h·ν/c</td></tr>
<tr><td>Masa de repaus</td><td class="m">0</td></tr>
<tr><td>Masa de mișcare</td><td class="m">m = h·ν/c²</td></tr>
</tbody></table></div>
<p>h = 6,626·10⁻³⁴ J·s. În calcule rapide: h·c ≈ 1240 eV·nm.</p>
<h3>Efectul Compton</h3>
<p>Când raze X sunt împrăștiate pe electroni liberi (sau slab legați), radiația împrăștiată are lungimea de undă <b>mai mare</b> decât cea incidentă. Creșterea depinde numai de unghiul de împrăștiere θ:</p>
<div class="fx big">Δλ = λ′ − λ = Λ·(1 − cos θ) ,  Λ = h/(m₀·c) = 2,43 pm</div>
<div class="tw"><table><thead><tr><th>θ</th><th>0°</th><th>90°</th><th>180°</th></tr></thead><tbody><tr><td>Δλ</td><td class="m">0</td><td class="m">Λ = 2,43 pm</td><td class="m">2Λ = 4,86 pm</td></tr></tbody></table></div>
<h3>Explicația</h3>
<p>Procesul este o ciocnire elastică între un foton și un electron. Se conservă energia și impulsul. Fotonul cedează o parte din energie electronului de recul, deci pleacă cu energie mai mică și λ mai mare:</p>
<div class="fx">E<sub>c, electron</sub> = h·c/λ − h·c/λ′</div>
<p>Teoria ondulatorie nu poate explica schimbarea lungimii de undă; efectul este o dovadă a naturii corpusculare a radiației.</p>
<h3>Exemplu</h3>
<p>Raze X cu λ = 71 pm, împrăștiate la 90°: λ′ = 71 + 2,43 = 73,43 pm.</p>` },
{ id:'q-broglie', g:'qcu', t:'Undele de Broglie și principiul de nedeterminare', d:'Dualismul undă–corpuscul, difracția electronilor',
  brief:['Orice particulă cu impulsul p are asociată o undă cu λ = h/p.','Electron accelerat la tensiunea U: λ = h/√(2·m·e·U).','Nu poți cunoaște simultan, oricât de precis, poziția și impulsul: Δx·Δp ≥ ħ/2.'], html:`
<h3>Ipoteza lui de Broglie</h3>
<p>Dacă lumina are și comportare de particulă, atunci și particulele au comportare de undă.</p>
<div class="fx big">λ = h/p = h/(m·v)</div>
<p>Pentru corpurile obișnuite λ este prea mică pentru a fi observată. Pentru electroni este de ordinul distanțelor dintre atomii unui cristal.</p>
<h3>Electron accelerat</h3>
<p>Un electron pornit din repaus și accelerat la tensiunea U capătă e·U = p²/(2m), deci:</p>
<div class="fx big">λ = h/√(2·m·e·U) ≈ 1,226/√U nm  (U în volți)</div>
<p>La U = 150 V rezultă λ ≈ 0,1 nm.</p>
<h3>Confirmarea experimentală</h3>
<p>Davisson și Germer (1927) au obținut difracția electronilor pe un cristal de nichel, cu maxime exact unde prevede relația lui de Broglie. Pe acest fapt se bazează <b>microscopul electronic</b>, care are rezoluție mult mai bună decât cel optic, pentru că λ este mult mai mică.</p>
<h3>Dualismul undă–corpuscul</h3>
<p>Lumina și particulele au ambele aspecte. În propagare (interferență, difracție) se manifestă aspectul ondulatoriu; în interacțiunea cu substanța (efect fotoelectric, Compton) cel corpuscular.</p>
<h3>Relațiile de nedeterminare (Heisenberg)</h3>
<div class="fx big">Δx·Δp<sub>x</sub> ≥ ħ/2 ,  ħ = h/(2π)</div>
<p>Cu cât poziția este mai bine precizată, cu atât impulsul este mai imprecis. Nu este o limită a aparatelor, ci o proprietate a naturii. De aceea în atom nu se poate vorbi de traiectoria electronului, ci de probabilitatea de a-l găsi într-o regiune.</p>` },
{ id:'a-bohr', g:'abohr', t:'Modelul atomului: Rutherford și Bohr', d:'Postulate, niveluri de energie, spectrul hidrogenului',
  brief:['Atomul are un nucleu mic, pozitiv, în care este aproape toată masa.','Hidrogen: E_n = −13,6/n² eV și r_n = 0,53·n² Å.','La trecerea între două niveluri se emite sau se absoarbe un foton cu hν = E_n − E_m.'], html:`
<h3>Experimentul lui Rutherford</h3>
<p>Particule α trimise spre o foiță de aur trec aproape toate nedeviate, dar câteva sunt întoarse înapoi. Concluzia: sarcina pozitivă și aproape toată masa sunt într-un <b>nucleu</b> foarte mic (10⁻¹⁵–10⁻¹⁴ m), iar electronii se mișcă în jurul lui (model planetar). Clasic, un asemenea atom ar radia continuu și s-ar prăbuși.</p>
<h3>Postulatele lui Bohr</h3>
<ol><li>Atomul există doar în <b>stări staționare</b>, cu energii bine determinate, în care nu radiază.</li>
<li>La trecerea dintr-o stare în alta emite sau absoarbe un foton: h·ν = E<sub>n</sub> − E<sub>m</sub>.</li></ol>
<p>Condiția de cuantificare: m·v·r = n·ħ, cu n = 1, 2, 3, …</p>
<h3>Atomul de hidrogen</h3>
<div class="fx big">r<sub>n</sub> = r₁·n² , r₁ = 0,53·10⁻¹⁰ m ;  E<sub>n</sub> = −13,6/n² eV</div>
<div class="tw"><table><thead><tr><th>n</th><th>1</th><th>2</th><th>3</th><th>4</th><th>∞</th></tr></thead><tbody><tr><td>E (eV)</td><td class="m">−13,6</td><td class="m">−3,4</td><td class="m">−1,51</td><td class="m">−0,85</td><td class="m">0</td></tr></tbody></table></div>
<p>Starea cu n = 1 este <b>starea fundamentală</b>. Energia de ionizare din această stare este 13,6 eV.</p>
<h3>Seriile spectrale</h3>
<div class="fx big">1/λ = R·(1/m² − 1/n²) ,  R = 1,097·10⁷ m⁻¹</div>
<div class="tw"><table><thead><tr><th>Serie</th><th>Nivelul final m</th><th>Domeniu</th></tr></thead><tbody>
<tr><td>Lyman</td><td class="m">1</td><td>ultraviolet</td></tr><tr><td>Balmer</td><td class="m">2</td><td>vizibil</td></tr><tr><td>Paschen</td><td class="m">3</td><td>infraroșu</td></tr>
</tbody></table></div>
<h3>Exemplu</h3>
<p>Tranziția 3 → 2: ΔE = −1,51 − (−3,4) = 1,89 eV; λ = 1240/1,89 ≈ 656 nm (linia roșie H<sub>α</sub>).</p>
<p>Experimentul Franck–Hertz a confirmat direct existența nivelurilor discrete de energie.</p>` },
{ id:'a-raze', g:'abohr', t:'Atomul cu mai mulți electroni, raze X și laser', d:'Numere cuantice, principiul lui Pauli, λ minimă, emisie stimulată',
  brief:['Starea unui electron este dată de patru numere cuantice; doi electroni nu pot avea toate patru identice.','Pe stratul n încap cel mult 2n² electroni.','Raze X de frânare: λ_min = hc/(eU) ≈ 1240/U nm, cu U în volți.'], html:`
<h3>Numerele cuantice</h3>
<div class="tw"><table><thead><tr><th>Număr</th><th>Valori</th><th>Ce descrie</th></tr></thead><tbody>
<tr><td>principal n</td><td class="m">1, 2, 3, …</td><td>stratul (K, L, M, …) și energia</td></tr>
<tr><td>orbital l</td><td class="m">0 … n − 1</td><td>substratul (s, p, d, f)</td></tr>
<tr><td>magnetic m</td><td class="m">−l … +l</td><td>orientarea orbitalului</td></tr>
<tr><td>de spin s</td><td class="m">±1/2</td><td>momentul propriu al electronului</td></tr>
</tbody></table></div>
<p><b>Principiul de excluziune al lui Pauli:</b> într-un atom nu pot exista doi electroni cu toate cele patru numere cuantice identice. Rezultă cel mult 2(2l + 1) electroni pe substrat și <b>2n²</b> pe strat: 2, 8, 18, 32. Așa se explică sistemul periodic.</p>
<h3>Radiațiile X</h3>
<p>Se obțin când electroni accelerați la tensiuni de zeci de kilovolți lovesc un anod metalic.</p>
<ul><li><b>Spectrul continuu (de frânare)</b> are o limită inferioară dată de tensiune:</li></ul>
<div class="fx big">λ<sub>min</sub> = h·c/(e·U) ≈ 1240/U nm  (U în volți)</div>
<ul><li><b>Spectrul caracteristic</b> (linii) depinde de materialul anodului: un electron smuls de pe un strat interior este înlocuit de altul de pe un strat superior. Legea lui Moseley: √ν este proporțional cu (Z − σ).</li></ul>
<p>Atenuarea în substanță: I = I₀·e<sup>−μx</sup>. Aplicații: radiografie, tomografie, studiul cristalelor.</p>
<h3>Laserul</h3>
<p>Funcționează pe baza <b>emisiei stimulate</b>: un foton determină un atom excitat să emită un al doilea foton identic (aceeași frecvență, fază și direcție). Este nevoie de <b>inversie de populație</b> (mai mulți atomi în starea excitată decât în cea de jos), obținută prin pompaj, și de o cavitate rezonantă cu oglinzi.</p>
<p>Lumina laser este monocromatică, coerentă, foarte direcțională și intensă.</p>
<h3>Exemplu</h3>
<p>Tub de raze X la U = 50 kV: λ<sub>min</sub> = 1240/50 000 nm = 0,0248 nm ≈ 24,8 pm.</p>` },
{ id:'s-semi', g:'ssemi', t:'Semiconductoare, dioda și tranzistorul', d:'Conducție intrinsecă și extrinsecă, joncțiunea pn, redresare',
  brief:['Rezistivitatea semiconductorilor scade când temperatura crește, invers decât la metale.','Tip n: impurități donoare (grupa a V-a). Tip p: impurități acceptoare (grupa a III-a).','Joncțiunea pn conduce într-un singur sens; pe asta se bazează dioda.'], html:`
<h3>Benzi de energie</h3>
<p>În solide, nivelurile de energie formează benzi. Între banda de valență și banda de conducție există o <b>bandă interzisă</b>.</p>
<div class="tw"><table><thead><tr><th>Material</th><th>Banda interzisă</th></tr></thead><tbody>
<tr><td>Conductor</td><td>inexistentă (benzile se suprapun)</td></tr>
<tr><td>Semiconductor (Si, Ge)</td><td>îngustă, aproximativ 1 eV</td></tr>
<tr><td>Izolator</td><td>largă, peste 3 eV</td></tr>
</tbody></table></div>
<h3>Semiconductori intrinseci</h3>
<p>Sunt puri. Agitația termică rupe legături și creează perechi <b>electron–gol</b>. Numărul electronilor liberi este egal cu al golurilor. Când temperatura crește apar mai mulți purtători, deci rezistivitatea scade.</p>
<h3>Semiconductori extrinseci</h3>
<div class="tw"><table><thead><tr><th>Tip</th><th>Impuritate</th><th>Purtători majoritari</th></tr></thead><tbody>
<tr><td>n</td><td>donoare, din grupa a V-a (P, As, Sb)</td><td>electroni</td></tr>
<tr><td>p</td><td>acceptoare, din grupa a III-a (B, Ga, In)</td><td>goluri</td></tr>
</tbody></table></div>
<h3>Joncțiunea pn și dioda</h3>
<p>La contactul dintre o zonă p și una n apare un <b>strat de baraj</b>, sărăcit în purtători.</p>
<ul><li><b>Polarizare directă</b> (plusul la p): bariera scade, dioda conduce.</li>
<li><b>Polarizare inversă</b> (plusul la n): bariera crește, trece doar un curent foarte mic.</li></ul>
<p>Dioda este folosită la <b>redresarea</b> curentului alternativ: monoalternanță (o diodă) sau bialternanță (punte de patru diode). Un condensator de filtraj netezește tensiunea. Alte diode: LED, fotodioda, dioda Zener (stabilizator).</p>
<h3>Tranzistorul</h3>
<p>Are două joncțiuni (npn sau pnp) și trei borne: emitor, bază, colector.</p>
<div class="fx big">I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> ;  β = I<sub>C</sub>/I<sub>B</sub></div>
<p>Un curent mic de bază comandă un curent mare de colector: tranzistorul lucrează ca amplificator sau ca întrerupător. Circuitele integrate conțin milioane de tranzistoare pe aceeași plăcuță de siliciu.</p>` },
{ id:'n-nucleu', g:'nnuc', t:'Nucleul atomic și energia de legătură', d:'Protoni, neutroni, izotopi, defect de masă',
  brief:['Nucleul are Z protoni și N neutroni; A = Z + N.','Masa nucleului este mai mică decât suma maselor nucleonilor: diferența este defectul de masă.','W = Δm·c²; 1 u corespunde la 931,5 MeV.'], html:`
<h3>Structura nucleului</h3>
<p>Nucleul este format din <b>nucleoni</b>: protoni (sarcină +e) și neutroni (fără sarcină). Se notează <sup>A</sup><sub>Z</sub>X, unde Z este numărul atomic (numărul de protoni), iar A numărul de masă.</p>
<div class="fx big">A = Z + N ;  R = R₀·A<sup>1/3</sup> , R₀ ≈ 1,2…1,45·10⁻¹⁵ m</div>
<p><b>Izotopii</b> au același Z, dar A diferit (¹H, ²H, ³H). Unitatea atomică de masă: 1 u = 1,66·10⁻²⁷ kg, echivalentă cu 931,5 MeV.</p>
<h3>Forțele nucleare</h3>
<p>Țin nucleonii împreună, învingând respingerea electrică dintre protoni. Sunt foarte intense, atractive, cu rază scurtă de acțiune (de ordinul 10⁻¹⁵ m), nu depind de sarcină și prezintă saturație (un nucleon interacționează doar cu vecinii).</p>
<h3>Defectul de masă și energia de legătură</h3>
<div class="fx big">Δm = Z·m<sub>p</sub> + N·m<sub>n</sub> − m<sub>nucleu</sub> ;  W = Δm·c²</div>
<p>W este energia necesară pentru a desface nucleul în nucleoni liberi. <b>Energia de legătură pe nucleon</b>, B = W/A, măsoară stabilitatea: este maximă, aproximativ 8,7 MeV, pentru nucleele cu A în jur de 56–60 (fier, nichel). De aceea se eliberează energie atât la fisiunea nucleelor grele, cât și la fuziunea celor ușoare.</p>
<h3>Exemplu: heliu-4</h3>
<p>m<sub>p</sub> = 1,00728 u, m<sub>n</sub> = 1,00866 u, m<sub>He</sub> = 4,00151 u. Δm = 2·1,00728 + 2·1,00866 − 4,00151 = 0,03037 u. W = 0,03037·931,5 ≈ 28,3 MeV, adică aproximativ 7,07 MeV pe nucleon.</p>` },
{ id:'n-radio', g:'nnuc', t:'Radioactivitatea', d:'Dezintegrări α, β, γ; legea dezintegrării; activitate',
  brief:['α scade A cu 4 și Z cu 2; β⁻ crește Z cu 1; γ nu schimbă nucleul.','N = N₀·2^(−t/T): după fiecare timp de înjumătățire rămâne jumătate.','Activitatea Λ = λN se măsoară în becquereli.'], html:`
<p><b>Radioactivitatea</b> este transformarea spontană a nucleelor instabile, cu emisie de radiații.</p>
<h3>Tipuri de dezintegrare</h3>
<div class="tw"><table><thead><tr><th>Tip</th><th>Ce se emite</th><th>Nucleul nou</th><th>Oprită de</th></tr></thead><tbody>
<tr><td>α</td><td>nucleu de heliu, ⁴₂He</td><td class="m">A − 4, Z − 2</td><td>o foaie de hârtie</td></tr>
<tr><td>β⁻</td><td>electron și antineutrin</td><td class="m">A, Z + 1</td><td>câțiva mm de aluminiu</td></tr>
<tr><td>β⁺</td><td>pozitron și neutrin</td><td class="m">A, Z − 1</td><td>câțiva mm de aluminiu</td></tr>
<tr><td>γ</td><td>foton de energie mare</td><td class="m">A, Z neschimbate</td><td>plumb gros, beton</td></tr>
</tbody></table></div>
<p>În dezintegrarea β⁻ un neutron din nucleu se transformă în proton. În orice dezintegrare se conservă numărul de nucleoni și sarcina electrică.</p>
<h3>Legea dezintegrării radioactive</h3>
<div class="fx big">N = N₀·e<sup>−λt</sup> = N₀·2<sup>−t/T</sup></div>
<div class="fx">T = ln 2/λ ≈ 0,693/λ ;  τ = 1/λ</div>
<p>λ este constanta radioactivă, T este <b>timpul de înjumătățire</b>, iar τ viața medie. După n perioade rămâne N₀/2ⁿ. Aceeași lege este valabilă pentru masa substanței rămase.</p>
<h3>Activitatea</h3>
<div class="fx big">Λ = λ·N = Λ₀·2<sup>−t/T</sup></div>
<p>Este numărul de dezintegrări pe secundă. 1 Bq = 1 dezintegrare/s; 1 Ci = 3,7·10¹⁰ Bq.</p>
<h3>Exemple</h3>
<p>Dintr-o probă cu T = 8 zile, după 24 de zile (3 perioade) rămâne 1/8 din cantitatea inițială, adică s-au dezintegrat 87,5%.</p>
<p><b>Datarea cu carbon-14</b> (T = 5730 de ani): un obiect în care activitatea ¹⁴C a scăzut la un sfert are aproximativ 11 460 de ani.</p>` },
{ id:'n-reactii', g:'nrea', t:'Reacții nucleare, fisiune, fuziune și particule', d:'Legi de conservare, energia de reacție, reactorul, dozimetrie',
  brief:['Într-o reacție nucleară se conservă numărul de nucleoni, sarcina, energia și impulsul.','Q = (m_inițial − m_final)·c²; dacă Q > 0, reacția eliberează energie.','Fisiunea rupe nuclee grele; fuziunea unește nuclee ușoare.'], html:`
<h3>Reacții nucleare</h3>
<p>Un nucleu țintă X este lovit de o particulă a și rezultă un nucleu Y și o particulă b: a + X → Y + b. Exemplu (Rutherford, 1919): ⁴₂He + ¹⁴₇N → ¹⁷₈O + ¹₁H.</p>
<p><b>Legi de conservare:</b> suma numerelor de masă A, suma sarcinilor Z, energia totală și impulsul sunt aceleași înainte și după.</p>
<div class="fx big">Q = (m<sub>inițial</sub> − m<sub>final</sub>)·c²</div>
<p>Q &gt; 0: reacție exoenergetică. Q &lt; 0: reacție endoenergetică, care are nevoie de o energie de prag. Cu masele în u, Q (MeV) = Δm·931,5.</p>
<h3>Fisiunea nucleară</h3>
<p>Un nucleu greu (²³⁵U, ²³⁹Pu) absoarbe un neutron lent și se rupe în două fragmente, eliberând 2–3 neutroni și aproximativ 200 MeV. Neutronii eliberați pot produce alte fisiuni: <b>reacție în lanț</b>, posibilă peste <b>masa critică</b>.</p>
<p>În <b>reactorul nuclear</b> reacția este controlată: moderatorul (apă, apă grea, grafit) încetinește neutronii, iar barele de control (cadmiu, bor) îi absorb. Reactoarele de la Cernavodă folosesc uraniu natural și apă grea.</p>
<h3>Fuziunea nucleară</h3>
<p>Nuclee ușoare se unesc într-unul mai greu: ²₁H + ³₁H → ⁴₂He + ¹₀n + 17,6 MeV. Are nevoie de temperaturi de ordinul 10⁸ K, ca nucleele să învingă respingerea electrică. Este sursa de energie a stelelor.</p>
<h3>Particule elementare</h3>
<div class="tw"><table><thead><tr><th>Familie</th><th>Exemple</th></tr></thead><tbody>
<tr><td>Leptoni</td><td>electron, miuon, neutrin</td></tr>
<tr><td>Hadroni: barioni</td><td>proton, neutron (câte trei quarkuri)</td></tr>
<tr><td>Hadroni: mezoni</td><td>pioni (quark și antiquark)</td></tr>
<tr><td>Purtători de interacțiune</td><td>foton, gluoni, W și Z</td></tr>
</tbody></table></div>
<p>Cele patru interacțiuni fundamentale: tare, electromagnetică, slabă și gravitațională. Fiecare particulă are o antiparticulă; la întâlnire se anihilează.</p>
<h3>Dozimetrie și protecție</h3>
<p>Doza absorbită D se măsoară în gray (1 Gy = 1 J/kg), iar doza biologică în sievert (Sv). Protecția: timp de expunere scurt, distanță mare, ecrane potrivite.</p>` }

{ id:'m-arunc', g:'mext', nb:true, before:'m-circular', t:'Aruncarea pe orizontală și oblică', d:'Mișcarea în câmp gravitațional, bătaia, înălțimea maximă',
  brief:['Mișcarea se descompune: pe orizontală MRU, pe verticală cădere liberă.','Aruncare pe orizontală de la h: t = √(2h/g), bătaia b = v₀·t.','Aruncare oblică: b = v₀²·sin 2α/g, maximă la 45°.'], html:`
<p>Un corp aruncat în câmpul gravitațional, fără frecare cu aerul, descrie o <b>parabolă</b>. Trucul este să tratezi separat cele două direcții: pe orizontală nu acționează nicio forță, deci mișcarea e <b>uniformă</b>; pe verticală acționează greutatea, deci mișcarea e <b>uniform variată</b> cu a = g. Cele două mișcări se petrec în același timp și nu se influențează (principiul independenței mișcărilor).</p>
<h3>Aruncarea pe orizontală (de la înălțimea h, cu viteza v₀)</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Formula</th></tr></thead><tbody>
<tr><td>Coordonatele</td><td class="m">x = v₀·t ;  y = g·t²/2 (măsurat în jos)</td></tr>
<tr><td>Timpul de cădere</td><td class="m">t<sub>c</sub> = √(2h/g)</td></tr>
<tr><td>Bătaia (distanța pe orizontală)</td><td class="m">b = v₀·√(2h/g)</td></tr>
<tr><td>Viteza la sol</td><td class="m">v = √(v₀² + 2gh)</td></tr>
<tr><td>Unghiul vitezei cu orizontala</td><td class="m">tg β = g·t/v₀</td></tr>
<tr><td>Traiectoria</td><td class="m">y = g·x²/(2v₀²)</td></tr>
</tbody></table></div>
<p>Timpul de cădere nu depinde de v₀: o bilă aruncată orizontal și una lăsată liber de la aceeași înălțime ajung jos în același moment.</p>
<h3>Aruncarea oblică (de la sol, cu v₀ sub unghiul α)</h3>
<div class="fx">v<sub>x</sub> = v₀·cos α ;  v<sub>y</sub> = v₀·sin α − g·t ;  x = v₀·cos α·t ;  y = v₀·sin α·t − g·t²/2</div>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Formula</th></tr></thead><tbody>
<tr><td>Timpul de urcare</td><td class="m">t<sub>u</sub> = v₀·sin α/g</td></tr>
<tr><td>Timpul de zbor</td><td class="m">t<sub>z</sub> = 2v₀·sin α/g</td></tr>
<tr><td>Înălțimea maximă</td><td class="m">H = v₀²·sin²α/(2g)</td></tr>
<tr><td>Bătaia</td><td class="m">b = v₀²·sin 2α/g</td></tr>
</tbody></table></div>
<ul>
<li>În vârful traiectoriei v<sub>y</sub> = 0, dar viteza nu e zero: rămâne v<sub>x</sub> = v₀·cos α.</li>
<li>Bătaia e maximă la α = 45°: b<sub>max</sub> = v₀²/g.</li>
<li>Unghiurile complementare (de exemplu 30° și 60°) dau aceeași bătaie, dar înălțimi și timpi de zbor diferiți.</li>
<li>Energia mecanică se conservă: în vârf E<sub>c</sub> = m(v₀·cos α)²/2.</li>
</ul>
<div class="keep"><b>Exemplu:</b> v₀ = 20 m/s, α = 30°, g = 10 m/s². t<sub>z</sub> = 2·20·0,5/10 = 2 s ; H = 400·0,25/20 = 5 m ; b = 400·sin 60°/10 ≈ 34,6 m.</div>` },

{ id:'m-grav', g:'mext', nb:true, after:'m-circular', t:'Gravitația: Kepler, sateliți, viteze cosmice', d:'Câmpul gravitațional, orbite, imponderabilitate',
  brief:['g scade cu înălțimea: g_h = g₀·R²/(R + h)².','Satelit pe orbită circulară: v = √(KM/r), forța centripetă este atracția gravitațională.','Legea a III-a a lui Kepler: T²/r³ este aceeași pentru toate corpurile care orbitează același astru.'], html:`
<p>Forța de atracție universală ține Luna pe orbită, Pământul în jurul Soarelui și sateliții artificiali deasupra noastră. Toate problemele de aici pornesc din aceeași idee: <b>forța gravitațională joacă rolul de forță centripetă</b>.</p>
<h3>Câmpul gravitațional</h3>
<div class="fx big">g = K·M/r²  ;  la suprafață g₀ = K·M/R²  ;  la înălțimea h: g<sub>h</sub> = g₀·R²/(R + h)²</div>
<ul>
<li>K = 6,67·10⁻¹¹ N·m²/kg². Pentru Pământ: M ≈ 6·10²⁴ kg, R ≈ 6400 km, g₀ ≈ 9,8 m/s².</li>
<li>Relație utilă, fără K și M: <b>K·M = g₀·R²</b>.</li>
<li>La h = R (o rază deasupra solului) g scade de 4 ori.</li>
</ul>
<h3>Mișcarea sateliților</h3>
<div class="fx big">K·M·m/r² = m·v²/r  ⇒  v = √(K·M/r) = R·√(g₀/r)</div>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Formula</th><th>Pentru Pământ</th></tr></thead><tbody>
<tr><td>Prima viteză cosmică (orbită razantă)</td><td class="m">v₁ = √(g₀R)</td><td class="m">≈ 7,9 km/s</td></tr>
<tr><td>A doua viteză cosmică (evadare)</td><td class="m">v₂ = √(2g₀R) = v₁√2</td><td class="m">≈ 11,2 km/s</td></tr>
<tr><td>Perioada pe orbită</td><td class="m">T = 2πr/v = 2π·√(r³/(KM))</td><td class="m">razant ≈ 84 min</td></tr>
<tr><td>Satelit geostaționar</td><td class="m">T = 24 h, pe planul ecuatorului</td><td class="m">h ≈ 36 000 km</td></tr>
</tbody></table></div>
<p>Masa satelitului nu apare în formule: un satelit mare și unul mic pe aceeași orbită au aceeași viteză. Cu cât orbita e mai înaltă, cu atât viteza e mai mică și perioada mai mare.</p>
<h3>Legile lui Kepler</h3>
<ol>
<li>Planetele se mișcă pe <b>elipse</b>, cu Soarele într-unul din focare.</li>
<li>Raza vectoare mătură <b>arii egale în timpi egali</b>: planeta e mai rapidă aproape de Soare (periheliu).</li>
<li>Pătratul perioadei este proporțional cu cubul semiaxei mari: <b>T²/a³ = 4π²/(KM)</b>, aceeași valoare pentru toate planetele.</li>
</ol>
<h3>Energia potențială gravitațională și imponderabilitatea</h3>
<ul>
<li>La distanțe mari: E<sub>p</sub> = −K·M·m/r (zero la infinit). Aproape de sol rămâne valabil E<sub>p</sub> = mgh.</li>
<li><b>Imponderabilitatea:</b> într-o navă pe orbită corpurile cad liber împreună cu nava, deci nu apasă pe podea. Greutatea există; lipsește doar apăsarea.</li>
</ul>
<div class="keep"><b>Atenție:</b> r = R + h. Dacă problema dă înălțimea satelitului, adună raza planetei înainte să calculezi.</div>` },

{ id:'e-masurari', g:'ecirc', extra:true, after:'e-grupare', t:'Măsurări electrice: aparate, reostat, punte', d:'Șunt, rezistență adițională, montaj amonte/aval, potențiometru, puntea Wheatstone',
  brief:['Ampermetrul se leagă în serie și trebuie să aibă rezistență foarte mică; voltmetrul în paralel, cu rezistență foarte mare.','Șuntul R_s = R_A/(n − 1) mărește domeniul ampermetrului; rezistența adițională R_ad = (n − 1)R_V pe al voltmetrului.','Puntea Wheatstone e echilibrată când R₁·R₄ = R₂·R₃.'], html:`
<p>Aparatele de măsură reale au rezistență proprie și modifică puțin circuitul. Lecția arată cum le folosești corect și cum le extinzi domeniul.</p>
<h3>Ampermetrul și voltmetrul</h3>
<div class="tw"><table><thead><tr><th>Aparat</th><th>Cum se leagă</th><th>Ideal</th><th>Extinderea domeniului de n ori</th></tr></thead><tbody>
<tr><td>Ampermetru (R<sub>A</sub>)</td><td>în serie</td><td class="m">R<sub>A</sub> → 0</td><td class="m">șunt în paralel: R<sub>s</sub> = R<sub>A</sub>/(n − 1)</td></tr>
<tr><td>Voltmetru (R<sub>V</sub>)</td><td>în paralel</td><td class="m">R<sub>V</sub> → ∞</td><td class="m">rezistență în serie: R<sub>ad</sub> = (n − 1)·R<sub>V</sub></td></tr>
</tbody></table></div>
<p>Demonstrație pentru șunt: prin ampermetru trebuie să treacă I/n, iar restul (n − 1)I/n prin șunt. Tensiunea e aceeași: R<sub>A</sub>·I/n = R<sub>s</sub>·(n − 1)I/n.</p>
<h3>Metoda voltampermetrică (R = U/I)</h3>
<div class="tw"><table><thead><tr><th>Montaj</th><th>Ce rezultă</th><th>Bun pentru</th></tr></thead><tbody>
<tr><td>Aval (voltmetrul direct pe R)</td><td class="m">R<sub>măs</sub> = R·R<sub>V</sub>/(R + R<sub>V</sub>) &lt; R</td><td>rezistențe mici</td></tr>
<tr><td>Amonte (ampermetrul direct în serie cu R)</td><td class="m">R<sub>măs</sub> = R + R<sub>A</sub> &gt; R</td><td>rezistențe mari</td></tr>
</tbody></table></div>
<h3>Reostatul și potențiometrul</h3>
<ul>
<li><b>Reostatul</b> este un rezistor cu cursor, legat în serie: schimbă rezistența circuitului și deci intensitatea.</li>
<li><b>Potențiometrul</b> (divizor de tensiune) folosește toate trei bornele: din tensiunea U aplicată pe tot firul culegi o fracțiune. Fără consumator: U<sub>ieșire</sub> = U·x/l.</li>
</ul>
<h3>Puntea Wheatstone</h3>
<p>Patru rezistoare formează un pătrat, cu sursa pe o diagonală și un galvanometru pe cealaltă. Când galvanometrul arată zero, puntea este <b>echilibrată</b>:</p>
<div class="fx big">R₁·R₄ = R₂·R₃  ⇔  R₁/R₂ = R₃/R₄</div>
<p>La puntea cu fir: R<sub>x</sub> = R·l₁/l₂. Avantaj: rezultatul nu depinde de sursă și nici de rezistența galvanometrului.</p>
<h3>Aflarea lui E și r din măsurători</h3>
<p>Cu circuit deschis, un voltmetru ideal arată E. Din două perechi (U₁, I₁) și (U₂, I₂): r = (U₁ − U₂)/(I₂ − I₁), iar E = U₁ + I₁·r. Graficul U(I) este o dreaptă descendentă: tăietura cu axa U este E, panta este −r.</p>
<div class="keep"><b>Greșeală frecventă:</b> voltmetrul pus în serie. Fiind foarte rezistiv, aproape întrerupe circuitul și arată practic E.</div>` },

{ id:'os-sunet', g:'ound', after:'os-interf', t:'Sunetul: intensitate, nivel, efect Doppler', d:'Viteza sunetului, decibeli, Doppler, bătăi, ecou, tuburi',
  brief:['Nivelul sonor: L = 10·lg(I/I₀) dB; intensitatea de 10 ori mai mare înseamnă +10 dB.','Efect Doppler: când sursa și observatorul se apropie, frecvența percepută crește.','Bătăile au frecvența |ν₁ − ν₂|.'], html:`
<p>Sunetul este o undă mecanică longitudinală. Are nevoie de un mediu (nu se propagă în vid), iar viteza lui depinde de mediu.</p>
<h3>Viteza sunetului</h3>
<div class="tw"><table><thead><tr><th>Mediu</th><th>Formula</th><th>Valoare tipică</th></tr></thead><tbody>
<tr><td>Gaz</td><td class="m">v = √(γRT/μ)</td><td class="m">aer, 15 °C: ≈ 340 m/s</td></tr>
<tr><td>Bară solidă</td><td class="m">v = √(E/ρ)</td><td class="m">oțel: ≈ 5000 m/s</td></tr>
<tr><td>Lichid</td><td class="m">—</td><td class="m">apă: ≈ 1450 m/s</td></tr>
</tbody></table></div>
<p><b>Ecoul:</b> sunetul merge la obstacol și înapoi, deci d = v·t/2. Urechea separă ecoul de sunetul direct dacă întârzierea e de cel puțin 0,1 s (obstacol la peste 17 m).</p>
<h3>Intensitatea și nivelul sonor</h3>
<div class="fx big">I = P/S = P/(4πr²) ;  L = 10·lg(I/I₀) dB ,  I₀ = 10⁻¹² W/m²</div>
<ul>
<li>I₀ este pragul de audibilitate (0 dB); pragul de durere este în jur de 1 W/m² (120 dB).</li>
<li>Intensitatea dublă: +3 dB. De 10 ori mai mare: +10 dB. De 100 de ori: +20 dB.</li>
<li>Pentru o sursă punctiformă, la distanță dublă intensitatea scade de 4 ori (cu aproximativ 6 dB).</li>
</ul>
<h3>Efectul Doppler</h3>
<p>Când sursa și observatorul se mișcă unul față de altul, frecvența percepută diferă de cea emisă. La apropiere sunetul e mai înalt, la depărtare mai grav (sirena ambulanței).</p>
<div class="fx big">ν′ = ν·(v ± v<sub>O</sub>)/(v ∓ v<sub>S</sub>)</div>
<p>Semnele de sus se folosesc la <b>apropiere</b> (observatorul vine spre sursă: +v<sub>O</sub>; sursa vine spre observator: −v<sub>S</sub>), cele de jos la depărtare. v este viteza sunetului în aer.</p>
<h3>Bătăi</h3>
<p>Două sunete cu frecvențe apropiate se suprapun și se aude un sunet a cărui intensitate crește și scade periodic. Frecvența bătăilor:</p>
<div class="fx">ν<sub>b</sub> = |ν₁ − ν₂|</div>
<p>Așa se acordă o chitară după diapazon: bătăile încetinesc pe măsură ce frecvențele se apropie și dispar când sunt egale.</p>
<h3>Tuburi sonore</h3>
<div class="tw"><table><thead><tr><th>Tub</th><th>Frecvențe proprii</th><th>Armonici</th></tr></thead><tbody>
<tr><td>Deschis la ambele capete</td><td class="m">ν<sub>n</sub> = n·v/(2l)</td><td>toate</td></tr>
<tr><td>Închis la un capăt</td><td class="m">ν<sub>n</sub> = (2n − 1)·v/(4l)</td><td>doar cele impare</td></tr>
</tbody></table></div>
<div class="keep"><b>Exemplu Doppler:</b> o ambulanță emite 680 Hz și vine spre tine cu 20 m/s (v = 340 m/s). Auzi ν′ = 680·340/320 = 722,5 Hz. După ce trece: 680·340/360 ≈ 642 Hz.</div>` },

{ id:'q-termic', g:'qcu', before:'o-foto', t:'Radiația termică și ipoteza lui Planck', d:'Corpul negru, legile lui Wien și Stefan-Boltzmann, cuanta de energie',
  brief:['Orice corp cald emite radiație electromagnetică; corpul negru absoarbe tot ce primește.','Wien: λ_max·T = 2,9·10⁻³ m·K; Stefan-Boltzmann: puterea emisă pe unitatea de arie R = σT⁴.','Planck: energia se emite și se absoarbe în cuante ε = hν.'], html:`
<p>Fizica cuantică a pornit de la o problemă aparent simplă: cum strălucește un corp încălzit. Fizica clasică dădea un rezultat absurd, iar Max Planck l-a rezolvat în 1900 cu o ipoteză nouă.</p>
<h3>Corpul negru</h3>
<p>Un <b>corp negru</b> absoarbe toată radiația care cade pe el. Model practic: o cavitate cu un orificiu mic. Radiația pe care o emite depinde doar de temperatură, nu și de material.</p>
<h3>Legile radiației</h3>
<div class="tw"><table><thead><tr><th>Lege</th><th>Formula</th><th>Ce spune</th></tr></thead><tbody>
<tr><td>Stefan-Boltzmann</td><td class="m">R = σ·T⁴ , σ = 5,67·10⁻⁸ W/(m²·K⁴)</td><td>puterea emisă pe 1 m² crește foarte repede cu T</td></tr>
<tr><td>Deplasarea Wien</td><td class="m">λ<sub>max</sub>·T = b = 2,9·10⁻³ m·K</td><td>cu cât corpul e mai cald, cu atât maximul se mută spre λ mici</td></tr>
</tbody></table></div>
<ul>
<li>Soarele (T ≈ 5800 K) are maximul în jur de 500 nm, în vizibil.</li>
<li>Corpul omenesc (T ≈ 310 K) are maximul în jur de 9,4 µm, în infraroșu: așa funcționează camerele cu termoviziune.</li>
<li>Un fier încălzit trece de la roșu la galben și apoi la alb pe măsură ce T crește.</li>
<li>Dacă T se dublează, puterea emisă crește de 2⁴ = 16 ori.</li>
</ul>
<h3>„Catastrofa ultravioletă” și ipoteza lui Planck</h3>
<p>Teoria clasică prezicea că un corp negru ar emite o energie infinită spre lungimi de undă mici. Planck a presupus că energia nu se schimbă continuu, ci în porții numite <b>cuante</b>:</p>
<div class="fx big">ε = h·ν = h·c/λ ,  h = 6,63·10⁻³⁴ J·s</div>
<p>Cu această ipoteză formula lui Planck descrie exact spectrul măsurat. Einstein a mers mai departe (1905): lumina însăși e formată din cuante, numite <b>fotoni</b>, ceea ce explică efectul fotoelectric.</p>
<h3>Numărul de fotoni</h3>
<div class="fx">N/t = P/ε = P·λ/(h·c)</div>
<div class="keep"><b>Truc de calcul:</b> h·c ≈ 1240 eV·nm, deci ε(eV) = 1240/λ(nm). Un foton roșu de 620 nm are 2 eV, unul violet de 400 nm are 3,1 eV.</div>` }

function buildMenu(){
  const m = $('#menu');
  const col=(href,t,items)=>`<div><h5><a href="${href}">${t}</a></h5>${items.map(([h,n,x])=>`<a href="${h}"><span class="n">${n}</span><span><b>${x}</b></span></a>`).join('')}</div>`;
  const mega=CLASE.map(c=>col('#clasa-'+c.id,c.t,subjOfClass(c.id).map((s,k)=>['#materie-'+s.id,String(k+1).padStart(2,'0'),s.t]))).join('')+col('#bac','Bacalaureat',BACA.map(a=>['#bac-'+a.id,a.id,a.t]));
  m.innerHTML = `<a href="#acasa" data-r="acasa">Acasă</a>` + MENU.map(s=>`<div class="dd" data-dd="${s.id}"><button type="button" aria-expanded="false" aria-haspopup="true">${s.t}<span class="caret"></span></button>
   ${s.mega ? `<div class="panel mega" role="menu">${mega}</div>`
            : `<div class="panel" role="menu">${s.items.map(([h,t,d])=>`<a href="#${h}"><span class="n">›</span><span><b>${t}</b><small>${d}</small></span></a>`).join('')}</div>`}</div>`).join('');
  m.querySelectorAll('.dd > button').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const dd=b.parentElement, open=!dd.classList.contains('open'); closeDD(); if(open){dd.classList.add('open');b.setAttribute('aria-expanded','true');}
  }));
  m.querySelectorAll('.panel a').forEach(a=>a.addEventListener('click',closeDD));
  const mn = $('#mnav');
  mn.innerHTML = `<a href="#acasa">Acasă</a>` + CLASE.map(c=>`<details><summary>${c.t}<span class="caret"></span></summary><a href="#clasa-${c.id}"><b>Pagina clasei</b></a>${subjOfClass(c.id).map((s,k)=>`<a href="#materie-${s.id}"><span class="n">${String(k+1).padStart(2,'0')}</span>${s.t}</a>`).join('')}</details>`).join('')
    + `<details><summary>Bacalaureat<span class="caret"></span></summary><a href="#bac"><b>Pagina de BAC</b></a>${BACA.map(a=>`<a href="#bac-${a.id}"><span class="n">${a.id}</span>${a.t}</a>`).join('')}</details>`
    + `<details open><summary>Exersează și unelte<span class="caret"></span></summary>${MENU.slice(1).flatMap(s=>s.items).map(([h,t])=>`<a href="#${h}">${t}</a>`).join('')}</details>`;
  mn.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>toggleM(false)));
}
function closeDD(){ document.querySelectorAll('.dd.open').forEach(d=>{d.classList.remove('open');d.querySelector('button').setAttribute('aria-expanded','false');}); }
document.addEventListener('click',e=>{ if(!e.target.closest('.dd')) closeDD(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const o=document.querySelector('.dd.open button'); closeDD(); toggleM(false); o&&o.focus(); } });
function toggleM(force){ const mn=$('#mnav'), open = force ?? !mn.classList.contains('open'); mn.classList.toggle('open',open); $('#burger').setAttribute('aria-expanded',open); }
$('#burger').addEventListener('click',()=>toggleM());
function markMenu(r){
  buildSide();
  document.querySelectorAll('#menu > a').forEach(a=>a.dataset.r===r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.querySelectorAll('#menu .dd').forEach(d=>{ const s=MENU.find(x=>x.id===d.dataset.dd); d.classList.toggle('on', s.mega ? ['lectii','materie','clasa','bac','test','simbac'].includes(r) : s.items.some(i=>i[0]===r)); });
}

}
function prep(cv){
  const dpr=Math.max(1,window.devicePixelRatio||1), W=Math.max(200,cv.clientWidth||cv.parentElement.clientWidth-20), H=Math.round(Math.max(130,Math.min(W*(+cv.dataset.aspect||0.86),520)));
  cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); return {ctx,W,H};
}
function niceStep(max){ const raw=max/4, p=10**Math.floor(Math.log10(raw)), f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function tickTxt(v){ return Math.abs(v)>=1000? (v/1000).toFixed(v%1000?1:0).replace('.',',')+'k' : (Number.isInteger(v)?String(v):v.toFixed(v<1?2:1).replace('.',',')); }
function frame(cv,{xmin=0,xmax,ymin=0,ymax,xl,yl}){
  const {ctx,W,H}=prep(cv); const m={l:46,r:14,t:22,b:36};
  const sx=niceStep(xmax-xmin), sy=niceStep(ymax-ymin);
  xmax=Math.ceil(xmax/sx)*sx; ymax=Math.ceil(ymax/sy)*sy; if(xmin%sx) xmin=xmin-sx*0.15; if(ymin%sy) ymin=ymin-sy*0.15; const x0=Math.ceil(xmin/sx)*sx, y0=Math.ceil(ymin/sy)*sy;
  const X=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r), Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
  const ink=css('--ink'),muted=css('--muted'),grid=css('--line');
  ctx.font='11.5px "IBM Plex Mono", ui-monospace, monospace'; ctx.lineWidth=1;
  for(let v=x0;v<=xmax+1e-9;v+=sx){ ctx.strokeStyle=grid; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(X(v),m.t); ctx.lineTo(X(v),H-m.b); ctx.stroke(); ctx.globalAlpha=1; if(v>xmin+1e-9&&Math.abs(v)>1e-9){ctx.fillStyle=muted; ctx.textAlign='center'; ctx.fillText(tickTxt(+v.toFixed(6)),X(v),H-m.b+15);} }
  for(let v=y0;v<=ymax+1e-9;v+=sy){ ctx.strokeStyle=grid; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(m.l,Y(v)); ctx.lineTo(W-m.r,Y(v)); ctx.stroke(); ctx.globalAlpha=1; if(Math.abs(v)>1e-9||ymin<0){ctx.fillStyle=muted; ctx.textAlign='right'; ctx.fillText(tickTxt(+v.toFixed(6)),m.l-6,Y(v)+4);} }
  ctx.strokeStyle=muted; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(m.l,m.t-6); ctx.lineTo(m.l,H-m.b); ctx.lineTo(W-m.r+4,H-m.b); ctx.stroke();
  if(xmin===0){ctx.fillStyle=muted; ctx.textAlign=ymin===0?'right':'center'; ctx.fillText('0',ymin===0?m.l-6:m.l,H-m.b+15);}
  ctx.fillStyle=ink; ctx.font='600 12.5px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.textAlign='right'; ctx.fillText(xl,W-m.r,H-6); ctx.textAlign='left'; ctx.fillText(yl,4,12);
  return {ctx,X,Y,W,H,m};
}
function poly(ctx,pts,X,Y,xk,yk,color,w=3,dash){ ctx.strokeStyle=color; ctx.lineWidth=Math.min(w,2.6); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.setLineDash(dash||[]); ctx.beginPath(); pts.forEach((p,k)=>k?ctx.lineTo(X(p[xk]),Y(p[yk])):ctx.moveTo(X(p[xk]),Y(p[yk]))); ctx.stroke(); ctx.setLineDash([]); }
function arrowMid(ctx,pts,X,Y,xk,yk,color){ const n=pts.length; const a=pts[Math.floor(n*.42)],b=pts[Math.min(n-1,Math.floor(n*.58))]; const dx=X(b[xk])-X(a[xk]),dy=Y(b[yk])-Y(a[yk]); if(Math.hypot(dx,dy)<1)return; const cx=(X(a[xk])+X(b[xk]))/2, cy=(Y(a[yk])+Y(b[yk]))/2; ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(dy,dx)); ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,-3.5); ctx.lineTo(-5,3.5); ctx.closePath(); ctx.fill(); ctx.restore(); }
function dirAt(pts,X,Y,xk,yk,end){ const n=pts.length; const a=end?pts[Math.max(0,n-4)]:pts[0], b=end?pts[n-1]:pts[Math.min(n-1,3)]; let dx=X(b[xk])-X(a[xk]),dy=Y(b[yk])-Y(a[yk]); const L=Math.hypot(dx,dy)||1; return [dx/L,dy/L]; }
function pointLabel(f,x,y,text,dx,dy,placed){ const {ctx,W,H,m}=f; let lx=x+dx*16, ly=y+dy*16; lx=Math.min(Math.max(lx,m.l+8),W-m.r-8); ly=Math.min(Math.max(ly,m.t+8),H-m.b-8);
  if(placed){ let guard=0; while(placed.some(q=>Math.abs(q[0]-lx)<16&&Math.abs(q[1]-ly)<16)&&guard++<6){ ly+= (ly>H/2?-16:16); } placed.push([lx,ly]); }
  ctx.font='700 13px "Plus Jakarta Sans", system-ui, sans-serif'; const w=ctx.measureText(text).width; ctx.fillStyle=css('--sheet2'); ctx.globalAlpha=.85; ctx.fillRect(lx-w/2-3,ly-9,w+6,16); ctx.globalAlpha=1; ctx.fillStyle=css('--ink'); ctx.textAlign='center'; ctx.fillText(text,lx,ly+4); }
function dot(ctx,x,y,c){ ctx.fillStyle=css('--sheet'); ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=1.6; ctx.stroke(); }
function range(sets,k){ let mx=-Infinity; sets.forEach(s=>s.forEach(p=>{ if(p[k]>mx) mx=p[k]; })); return mx; }
/* un proces 1→2 */
function plotProcess(cv,pts,xk,yk,xl,yl,o={}){
  const sets=[pts].concat(o.ghost?[o.ghost]:[]);
  const f=frame(cv,{xmax:range(sets,xk)*1.12,ymax:range(sets,yk)*1.12,xl,yl}); const {ctx,X,Y}=f;
  const c=css('--c1'),pen=css('--pen'),muted=css('--muted');
  if(o.area){ ctx.fillStyle=c; ctx.globalAlpha=.16; ctx.beginPath(); ctx.moveTo(X(pts[0][xk]),Y(0)); pts.forEach(p=>ctx.lineTo(X(p[xk]),Y(p[yk]))); ctx.lineTo(X(pts.at(-1)[xk]),Y(0)); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
  if(o.ghost) poly(ctx,o.ghost,X,Y,xk,yk,muted,1.6,[6,5]);
  if(o.origin) poly(ctx,[{[xk]:0,[yk]:0},pts[0]],X,Y,xk,yk,muted,1.4,[4,4]);
  poly(ctx,pts,X,Y,xk,yk,c,3.2); arrowMid(ctx,pts,X,Y,xk,yk,c);
  const p0=pts[0],p1=pts.at(-1);
  if(Math.hypot(X(p1[xk])-X(p0[xk]),Y(p1[yk])-Y(p0[yk]))<2){ dot(ctx,X(p0[xk]),Y(p0[yk]),pen); pointLabel(f,X(p0[xk]),Y(p0[yk]),'1 = 2',0,-1); return; }
  const [ax,ay]=dirAt(pts,X,Y,xk,yk,false), [bx,by]=dirAt(pts,X,Y,xk,yk,true);
  dot(ctx,X(p0[xk]),Y(p0[yk]),pen); dot(ctx,X(p1[xk]),Y(p1[yk]),pen);
  pointLabel(f,X(p0[xk]),Y(p0[yk]),'1',-ax,-ay); pointLabel(f,X(p1[xk]),Y(p1[yk]),'2',bx,by);
}
/* mai multe curbe colorate */
function plotMulti(cv,sets,colors,xk,yk,xl,yl){
  const f=frame(cv,{xmax:range(sets,xk)*1.12,ymax:range(sets,yk)*1.12,xl,yl}); const {ctx,X,Y}=f;
  sets.forEach((s,k)=>{ poly(ctx,s,X,Y,xk,yk,colors[k],3); arrowMid(ctx,s,X,Y,xk,yk,colors[k]); });
}
/* ciclu: segmente în ordine, cu stări etichetate */
function plotCycle(cv,segs,labels,xk,yk,xl,yl,o={}){
  const all=segs.map(s=>s.pts); const f=frame(cv,{xmax:range(all,xk)*1.12,ymax:range(all,yk)*1.15,xl,yl}); const {ctx,X,Y}=f;
  const flat=all.flat(); ctx.fillStyle=css('--c1'); ctx.globalAlpha=.1; ctx.beginPath(); flat.forEach((p,k)=>k?ctx.lineTo(X(p[xk]),Y(p[yk])):ctx.moveTo(X(p[xk]),Y(p[yk]))); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  segs.forEach(s=>{ poly(ctx,s.pts,X,Y,xk,yk,s.color,3); arrowMid(ctx,s.pts,X,Y,xk,yk,s.color);
    if(s.note){ const mp=s.pts[Math.floor(s.pts.length/2)]; const [dx,dy]=dirAt(s.pts.slice(Math.floor(s.pts.length/2)-2),X,Y,xk,yk,false); ctx.font='600 12px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.fillStyle=s.color; ctx.textAlign='center'; ctx.fillText(s.note,X(mp[xk])-dy*18*(s.side||1),Y(mp[yk])+dx*18*(s.side||1)+4); } });
  const cx=flat.reduce((a,p)=>a+X(p[xk]),0)/flat.length, cy=flat.reduce((a,p)=>a+Y(p[yk]),0)/flat.length;
  const placed=[]; segs.forEach(s=>{ const p=s.pts[0]; dot(ctx,X(p[xk]),Y(p[yk]),css('--pen')); }); segs.forEach((s,k)=>{ const p=s.pts[0], x=X(p[xk]), y=Y(p[yk]); let dx=x-cx, dy=y-cy; const Lh=Math.hypot(dx,dy)||1; pointLabel(f,x,y,labels[k],dx/Lh,dy/Lh,placed); });
  if(o.center){ ctx.font='700 13px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.fillStyle=css('--ink'); ctx.textAlign='center'; ctx.fillText(o.center,cx,cy+4); }
}

/* ===== MODEL FIZIC ===== */
function state(type,i,nu,p1,V1,r){
  const g=(i+2)/i, T1=p1*V1/(nu*R), N=60;
  const path=f=>Array.from({length:N+1},(_,k)=>f(k/N));
  let p2,V2,T2,curve;
  if(type==='izocora'){V2=V1;T2=T1*r;p2=p1*r;curve=path(s=>[V1,p1*(1+(r-1)*s)]);}
  if(type==='izobara'){p2=p1;V2=V1*r;T2=T1*r;curve=path(s=>[V1*(1+(r-1)*s),p1]);}
  if(type==='izoterma'){V2=V1*r;p2=p1/r;T2=T1;curve=path(s=>{const v=V1*(1+(r-1)*s);return[v,p1*V1/v];});}
  if(type==='adiabatica'){V2=V1*r;p2=p1*Math.pow(r,-g);T2=T1*Math.pow(r,1-g);curve=path(s=>{const v=V1*(1+(r-1)*s);return[v,p1*Math.pow(V1/v,g)];});}
  if(type==='pav'){V2=V1*r;p2=p1*r;T2=T1*r*r;curve=path(s=>{const v=V1*(1+(r-1)*s);return[v,p1*v/V1];});}
  const dU=nu*(i/2)*R*(T2-T1); let Lm;
  if(type==='izocora')Lm=0; if(type==='izobara')Lm=p1*(V2-V1); if(type==='izoterma')Lm=nu*R*T1*Math.log(r); if(type==='adiabatica')Lm=-dU; if(type==='pav')Lm=(p1+p2)*(V2-V1)/2;
  const Qh=type==='adiabatica'?0:dU+Lm;
  const ghost=type==='adiabatica'?path(s=>{const v=V1*(1+(r-1)*s);return[v,p1*V1/v];}):null;
  const toPt=([v,p])=>({V:v*1e3,p:p/1e3,T:p*v/(nu*R)});
  return {g,T1,T2,p2,V2,dU,L:Lm,Q:Qh,curve:curve.map(toPt),ghost:ghost&&ghost.map(toPt)};
}
/* cicluri: puncte în L și kPa, ν = 1 */
function carnotCycle(Tc,Tr,g=5/3,VA=5){
  const k=Math.pow(Tc/Tr,1/(g-1)), VB=VA*4, VC=VB*k, VD=VA*k, N=40, nu=1;
  const P=(V,T)=>nu*R*T/(V*1e-3)/1e3;
  const iso=(V0,V1,T)=>Array.from({length:N+1},(_,j)=>{const V=V0+(V1-V0)*j/N;return{V,p:P(V,T),T};});
  const adi=(V0,V1,T0)=>Array.from({length:N+1},(_,j)=>{const V=V0+(V1-V0)*j/N, T=T0*Math.pow(V0/V,g-1);return{V,p:P(V,T),T};});
  const Qp=nu*R*Tc*Math.log(VB/VA), Qc=nu*R*Tr*Math.log(VD/VC);
  return {segs:[{pts:iso(VA,VB,Tc)},{pts:adi(VB,VC,Tc)},{pts:iso(VC,VD,Tr)},{pts:adi(VD,VA,Tr)}],Qp,Qc,L:Qp+Qc,eta:1-Tr/Tc};
}
function ottoCycle(eps,g=1.4,T1=300,Tmax=1800,V1=40){
  const V2=V1/eps, nu=1, N=40, P=(V,T)=>nu*R*T/(V*1e-3)/1e3, Cv=R/(g-1);
  const T2=T1*Math.pow(eps,g-1), T3=Math.max(Tmax,T2*1.2), T4=T3/Math.pow(eps,g-1);
  const adi=(Va,Vb,Ta)=>Array.from({length:N+1},(_,j)=>{const V=Va+(Vb-Va)*j/N,T=Ta*Math.pow(Va/V,g-1);return{V,p:P(V,T),T};});
  const isoV=(V,Ta,Tb)=>Array.from({length:N+1},(_,j)=>{const T=Ta+(Tb-Ta)*j/N;return{V,p:P(V,T),T};});
  const Qp=nu*Cv*(T3-T2), Qc=nu*Cv*(T1-T4);
  return {segs:[{pts:adi(V1,V2,T1)},{pts:isoV(V2,T2,T3)},{pts:adi(V2,V1,T3)},{pts:isoV(V1,T4,T1)}],Qp,Qc,L:Qp+Qc,eta:1-1/Math.pow(eps,g-1),T:[T1,T2,T3,T4]};
}

  else if(k==='g'){ const g=grp(v); if(g){ const gs=groupsOf(g.m,true); o={key:'g:'+g.id,kind:'Testul modulului',t:g.t,ids:L.filter(l=>l.g===g.id).map(l=>l.id),n:12,back:['#materie-'+g.m,'Înapoi la capitol'],

  else if(k==='m'){ const s=subj(v); if(s){ const ss=subjOfClass(s.cls), nx=ss[ss.indexOf(s)+1]; o={key:'m:'+s.id,kind:'Testul final al capitolului',t:s.t,ids:lessonsOf(s.id).map(l=>l.id),n:20,back:['#materie-'+s.id,'Înapoi la capitol'],
       next: nx ? ['#materie-'+nx.id,'Capitolul următor →'] : ['#test-c'+s.cls,'Testul final al clasei →']}; } }
  else if(k==='c'){ const c=klass(v); if(c) o={key:'c:'+c.id,kind:'Testul final',t:c.t,ids:lessonsOfClass(c.id).map(l=>l.id),n:30,back:['#clasa-'+c.id,'Înapoi la clasă'],next:null}; }
  else if(k==='b'){ const a=BACA.find(x=>x.id===v); if(a) o={key:'b:'+a.id,kind:'Testul ariei '+a.id,t:a.t,ids:a.ls().map(l=>l.id),n:20,back:['#bac-'+a.id,'Înapoi la arie'],next:null};
    else if(v==='X') o={key:'b:X',kind:'Simulare BAC',t:'toate cele patru arii',ids:bacLessons().map(l=>l.id),n:40,back:['#bac','Înapoi la BAC'],next:null}; }
  return o;
}
function pickQ(ids,n){
  const pools=ids.map(id=>shuffle(Q.filter(q=>q[0]===id))).filter(p=>p.length), out=[];
  while(out.length<n&&pools.some(p=>p.length)) for(const p of shuffle(pools.slice())){ if(p.length&&out.length<n) out.push(p.pop()); }
  return shuffle(out);
}

function miniQuiz(box,qs){
  box.innerHTML=qs.map((q,qi)=>`<div style="margin-bottom:16px"><div class="qtext" style="font-size:17px">${qi+1}. ${esc(q[1])}</div><div class="opts">${q[2].map((o,k)=>`<button class="opt" type="button" data-q="${qi}" data-k="${k}"><span class="L">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="ex" data-q="${qi}"></div></div>`).join('');
  box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const qi=+b.dataset.q,k=+b.dataset.k,q=qs[qi];
    box.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.k===q[3])x.classList.add('right');});

    addPlot(box,'Ciclul Otto (ε = 8)',cv=>plotCycle(cv,o.segs.map((s,k)=>({...s,color:[css('--c1'),css('--pen'),css('--c1'),css('--c3')][k]})),['1','2','3','4'],'V','p','V (L)','p (kPa)',{center:'η ≈ 56%'}),0.75);
    $('#lgleg').innerHTML=legend([['--pen','Căldură primită'],['--c3','Căldură cedată'],['--c1','Adiabate']]);
  }
  if(kind==='heating'){
    const pts=[{Q:0,t:-20}];
    const add=(dQ,dt)=>{const l=pts.at(-1);pts.push({Q:l.Q+dQ,t:l.t+dt});};
    add(42,20); add(334,0); add(418,100); add(500,0);
    addPlot(box,'1 kg de gheață încălzit de la −20 °C',cv=>{
      const f=frame(cv,{xmax:1350,ymin:-20,ymax:110,xl:'Q (kJ)',yl:'t (°C)'}); const {ctx,X,Y}=f;
      poly(ctx,pts,X,Y,'Q','t',css('--c1'),3);
      const labs=[['gheață',0],['topire, Q = mλ',1],['apă',2],['fierbere',3]];
      ctx.font='600 12px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.fillStyle=css('--ink');
      labs.forEach(([t,k])=>{const a=pts[k],b=pts[k+1];let dx=X(b.Q)-X(a.Q),dy=Y(b.t)-Y(a.t);const Ln=Math.hypot(dx,dy)||1;const nx=dy/Ln,ny=-dx/Ln;const mx=(X(a.Q)+X(b.Q))/2+nx*14,my=(Y(a.t)+Y(b.t))/2+ny*14;ctx.textAlign=nx<-0.3?'right':nx>0.3?'left':'center';ctx.fillText(t,k===0?X(b.Q)+8:mx,k===0?(Y(a.t)+Y(b.t))/2+4:my+4);if(k===0)ctx.textAlign='left';});

  }
  if(kind==='ui'){
    addPlot(box,'Caracteristica U(I): E = 12 V, r = 2 Ω',cv=>plotUI(cv,12,2,4),0.6);

  }
  if(kind==='lens'){

    addPlot(box,'Divergentă: f = −20 cm, obiect la 30 cm',cv=>drawLens(cv,{f:-20,d:30}),0.55);
    $('#lgleg').innerHTML=legend([['--accent','Obiect'],['--c3','Imagine'],['--c1','Raze de lumină']]);
  }
  if(kind==='young'){
    addPlot(box,'Franje de interferență: λ = 600 nm, i = 1,2 mm',cv=>drawYoung(cv,600,1.2),0.3);
    $('#lgleg').innerHTML='<p class="hint">Maximele sunt echidistante; distanța dintre două maxime vecine este interfranja.</p>';
  }
  if(kind==='foto'){
    addPlot(box,'E_c(ν) pentru L = 2 eV',cv=>plotFoto(cv,2,400),0.6);
    $('#lgleg').innerHTML='<p class="hint">Sub frecvența de prag nu se emit electroni. Peste prag, E_c crește liniar, cu panta h.</p>';
  }
}

/* --- Optică --- */
function lensCalc(f,d){ const x1=-d; if(Math.abs(f+x1)<1e-9) return {x1,x2:Infinity,beta:Infinity}; const x2=f*x1/(f+x1); return {x1,x2,beta:x2/x1}; }
function lensNature(c){ if(!isFinite(c.x2)) return 'la infinit (obiectul este în focar)'; return (c.x2>0?'reală':'virtuală')+', '+(c.beta<0?'răsturnată':'dreaptă')+', '+(Math.abs(Math.abs(c.beta)-1)<1e-6?'egală cu obiectul':Math.abs(c.beta)>1?'mărită':'micșorată'); }
function drawLens(cv,o){
  const {ctx,W,H}=prep(cv); const c=lensCalc(o.f,o.d), y1=10, cx=W/2, cy=H/2, inf=!isFinite(c.x2);
  const ext=Math.max(o.d,Math.abs(o.f)*1.25,inf?0:Math.min(Math.abs(c.x2),240))*1.12, kx=(W/2-14)/ext;
  const y2=inf?0:c.beta*y1, ky=(H/2-24)/Math.max(y1,Math.min(Math.abs(y2),45))/1.15;
  const X=x=>cx+x*kx, Y=y=>cy-y*ky;
  ctx.strokeStyle=css('--muted'); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(8,cy); ctx.lineTo(W-8,cy); ctx.stroke();
  const top=14, bot=H-14, conv=o.f>0; ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(cx,top); ctx.lineTo(cx,bot); ctx.stroke();
  const head=(y,dir)=>{ ctx.beginPath(); ctx.moveTo(cx-7,y+dir*8); ctx.lineTo(cx,y); ctx.lineTo(cx+7,y+dir*8); ctx.stroke(); };
  head(top,conv?1:-1); head(bot,conv?-1:1);
  ctx.fillStyle=css('--ink'); ctx.font='600 12px "Plus Jakarta Sans", system-ui, sans-serif'; ctx.textAlign='center';
  [-1,1].forEach(sg=>{ const fx=X(sg*Math.abs(o.f)); ctx.beginPath(); ctx.arc(fx,cy,3,0,7); ctx.fill(); ctx.fillText('F',fx,cy+17); });
  const ray=css('--c1'); ctx.strokeStyle=ray; ctx.lineWidth=1.2;
  const seg=(x1,yA,x2,yB,dash)=>{ ctx.setLineDash(dash?[5,4]:[]); ctx.beginPath(); ctx.moveTo(X(x1),Y(yA)); ctx.lineTo(X(x2),Y(yB)); ctx.stroke(); ctx.setLineDash([]); };
  seg(-o.d,y1,0,y1); seg(-o.d,y1,0,0);
  [y1,0].forEach(hh=>{ const slope=inf?(-y1/o.d):(y2-hh)/c.x2; seg(0,hh,ext,hh+slope*ext); if(!inf&&c.x2<0) seg(0,hh,c.x2,y2,true); });
  arrowLine(ctx,X(-o.d),cy,X(-o.d),Y(y1),css('--accent'),'',1.8);
  if(!inf){ ctx.globalAlpha=c.x2<0?.65:1; arrowLine(ctx,X(c.x2),cy,X(c.x2),Y(y2),css('--c3'),'',1.8); ctx.globalAlpha=1; }
}
function wl2rgb(w){ let r=0,g=0,b=0; if(w<440){r=(440-w)/60;b=1;} else if(w<490){g=(w-440)/50;b=1;} else if(w<510){g=1;b=(510-w)/20;} else if(w<580){r=(w-510)/70;g=1;} else if(w<645){r=1;g=(645-w)/65;} else {r=1;} return [Math.min(1,r),g,b]; }
function drawYoung(cv,lam,i){
  const {ctx,W,H}=prep(cv); const [r,g,b]=wl2rgb(lam), ph=H-24, half=6;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,ph);
  for(let px=0;px<W;px++){ const x=(px-W/2)/(W/2)*half, I=Math.cos(Math.PI*x/i)**2; ctx.fillStyle='rgb('+Math.round(255*r*I)+','+Math.round(255*g*I)+','+Math.round(255*b*I)+')'; ctx.fillRect(px,0,1,ph); }
  ctx.fillStyle=css('--muted'); ctx.font='11.5px "IBM Plex Mono", ui-monospace, monospace'; ctx.textAlign='center';
  [-6,-4,-2,0,2,4,6].forEach(v=>{ const px=W/2+v/half*(W/2); ctx.fillText(v===0?'0':v+' mm',Math.min(Math.max(px,22),W-22),H-7); });
}

function simulator(arg){
  if(SIMOF[arg]) simSubj=SIMOF[arg]; else if(LABS.some(x=>x.id===arg)) simSubj=arg;
  view.innerHTML=`<h1>Simulator</h1><p class="lead">Șapte laboratoare, din clasa a IX-a până într-a XII-a. Mută cursoarele: animațiile, graficele și rezultatele se recalculează pe loc.</p>
  <div class="seg" role="group" aria-label="Laborator">${LABS.map(s=>`<a href="#simulator-${s.id}" ${s.id===simSubj?'aria-current="page"':''}>${s.t}</a>`).join('')}</div><div id="simhost"></div>`;
  LABS.find(x=>x.id===simSubj).fn();
}
const wide=cv=>{ cv.parentElement.style.gridColumn='1/-1'; return cv; };
const mono=(ctx,sz=12.5)=>{ ctx.font=sz+'px "IBM Plex Mono", ui-monospace, monospace'; };
function liveAnim(host,title,draw,aspect){ let t=0; const cv=wide(addPlot(host,title,c=>draw(c,t),aspect)); startLoop(dt=>{ t+=dt; if(cv.isConnected) draw(cv,t); }); return cv; }

  liveAnim($('#ou-plots'),'Undă progresivă (sus) și undă staționară (jos)',(cv,t)=>{ const v=sval('ou-v'),nu=sval('ou-n'),lam=v/nu; const {ctx,W,H}=prep(cv); const ink=css('--ink'), span=12, ts=t*0.25, y1=H*0.27, y2=H*0.73, A=Math.min(26,H*0.17), X=x=>20+x/span*(W-40);

    mono(ctx,12); ctx.textAlign='left'; ctx.fillText('λ = '+fmt(lam)+' m · fereastra are 12 m',20,14); ctx.fillText('noduri (•) la λ/2',20,H-8); },0.46);
  liveAnim($('#ol2-plots'),'Schimbul de energie dintre condensator și bobină (încetinit)',(cv,t)=>{ const {ctx,W,H}=prep(cv); const ink=css('--ink'), ph=t*1.6, we=Math.cos(ph)**2, wm=1-we, bw=Math.min(90,W*0.22), base=H-34, top=26, hmax=base-top;
    [[W*0.32,we,css('--c1'),'W electric (C)'],[W*0.68,wm,css('--amber'),'W magnetic (L)']].forEach(([x,f,col,lab])=>{ ctx.fillStyle=css('--sheet2'); ctx.fillRect(x-bw/2,top,bw,hmax); ctx.fillStyle=col; ctx.fillRect(x-bw/2,base-hmax*f,bw,hmax*f); ctx.fillStyle=ink; mono(ctx,12); ctx.textAlign='center'; ctx.fillText(lab,x,base+18); ctx.fillText(fmt(f*100,0)+' %',x,top-8); }); },0.42);
