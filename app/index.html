<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe2">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fizică BAC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fizică BAC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- fonturile sunt incluse local (www/fonts), ca aplicația să meargă și fără internet -->
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* Caiet de laborator: hârtie milimetrică discretă, cerneală albastră, pix roșu pentru ce trebuie reținut.
   Bară de sus cu meniuri derulante; pe telefon, meniu pliabil. Conținut pe o coloană lată, cu cuprins lateral la lecții. */
:root{
  --paper:#f4f6fa; --sheet:#ffffff; --sheet2:#f8fafc; --grid:#e3e9f2; --ink:#111c33; --muted:#566480;
  --accent:#1d4fd8; --accent-ink:#ffffff; --pen:#c4372c; --good:#18805a; --warn:#a86a12; --line:#d3dbe8;
  --c1:#1d4fd8; --c2:#d9782b; --c3:#18805a; --c4:#8a3ffc;
  --shadow:0 1px 2px rgba(17,28,51,.06),0 8px 24px rgba(17,28,51,.08);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c1220; --sheet:#141c2e; --sheet2:#182136; --grid:#1b2539; --ink:#e6ecf7; --muted:#9aa8c2;
    --accent:#7aa2ff; --accent-ink:#0c1220; --pen:#ff7b6b; --good:#4fd39a; --warn:#f2b85c; --line:#2a3650;
    --c1:#7aa2ff; --c2:#f2a65a; --c3:#4fd39a; --c4:#b892ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1220; --sheet:#141c2e; --sheet2:#182136; --grid:#1b2539; --ink:#e6ecf7; --muted:#9aa8c2;
  --accent:#7aa2ff; --accent-ink:#0c1220; --pen:#ff7b6b; --good:#4fd39a; --warn:#f2b85c; --line:#2a3650;
  --c1:#7aa2ff; --c2:#f2a65a; --c3:#4fd39a; --c4:#b892ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;min-height:100vh}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
#view:focus,#view:focus-visible{outline:none}

/* ---------- bara de sus ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--sheet) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px}
.menu{display:flex;align-items:center;gap:2px;margin-left:8px}
.menu > a,.menu > .dd > button{font:inherit;font-weight:600;font-size:15.5px;color:var(--ink);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
.menu > a:hover,.menu > .dd > button:hover,.menu > .dd > button[aria-expanded="true"]{background:var(--sheet2)}
.menu > a[aria-current="page"],.menu > .dd.on > button{color:var(--accent)}
.caret{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
button[aria-expanded="true"] .caret{transform:rotate(-135deg) translate(-2px,0)}
.dd{position:relative}
.panel{position:absolute;top:calc(100% + 8px);left:0;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;min-width:300px;display:none}
.dd.open .panel{display:block}
.panel.mega{width:min(880px,92vw);display:none;grid-template-columns:repeat(4,1fr);gap:16px;left:-120px}
.dd.open .panel.mega{display:grid}
.panel h5{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 8px 6px}
.panel a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink)}
.panel a:hover,.panel a:focus-visible{background:var(--sheet2)}
.panel a .n{font-family:var(--mono);font-size:12.5px;color:var(--pen);font-weight:600;padding-top:2px}
.panel a b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.panel a small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.panel a.done .n::after{content:" ✓";color:var(--good)}
.spacer{flex:1}
.iconbtn{font:inherit;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.burger{display:none}
.mnav{display:none}
@media (max-width:900px){
  .menu{display:none}
  .burger{display:grid}
  .mnav{display:none;border-top:1px solid var(--line);max-height:calc(100vh - 62px);overflow:auto;padding:8px 16px 18px;background:var(--sheet)}
  .mnav.open{display:block}
  .mnav details{border-bottom:1px solid var(--line)}
  .mnav summary{list-style:none;cursor:pointer;font-weight:700;font-family:var(--display);padding:12px 4px;display:flex;justify-content:space-between;align-items:center}
  .mnav summary::-webkit-details-marker{display:none}
  .mnav details[open] summary .caret{transform:rotate(-135deg)}
  .mnav a{display:block;padding:8px 10px;text-decoration:none;color:var(--ink);border-radius:8px}
  .mnav a .n{font-family:var(--mono);color:var(--pen);font-size:13px;margin-right:6px}
  .mnav > a{font-weight:700;font-family:var(--display);padding:12px 4px;border-bottom:1px solid var(--line);border-radius:0}
}

/* ---------- pagină ---------- */
main{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:22px 0 8px}
.lead{color:var(--muted);margin:0 0 22px;max-width:70ch;font-size:17.5px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(17,28,51,.04)}
.stack{display:grid;gap:16px}
.badge{display:inline-block;align-self:flex-start;width:fit-content;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);text-decoration:none}
.badge.extra{background:color-mix(in srgb,var(--c4) 15%,transparent);color:var(--c4)}
.badge.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}

/* acasă */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch;margin-bottom:28px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .sheet{display:flex;flex-direction:column;gap:14px;justify-content:center}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:96px;height:96px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--sheet2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.group{margin-bottom:26px}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group-h h2{margin:0}
.group-h span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s}
.ch:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.ch .num{font-family:var(--mono);font-size:13px;color:var(--pen);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ch .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25}
.ch .d{font-size:14.5px;color:var(--muted)}
.ch .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:6px}
.meter{flex:1;height:6px;background:var(--sheet2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
@media (prefers-reduced-motion:reduce){.ch{transition:none}.ch:hover{transform:none}}

/* lecție */
.lessonwrap{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
@media (max-width:1000px){.lessonwrap{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:84px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px}
.toc h5{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.35}
.toc a .n{font-family:var(--mono);font-size:12.5px;color:var(--pen);padding-top:1px;min-width:20px}
.toc a:hover{background:var(--sheet2)}
.toc a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.toc a[aria-current="page"] .n{color:var(--accent-ink)}
.toc a.done:not([aria-current]) .n{color:var(--good)}
.brief{border-radius:14px;padding:16px 18px;background:color-mix(in srgb,var(--accent) 7%,var(--sheet));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.brief h2{font-size:16px;margin:0 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display)}
.brief ul{margin:0;padding-left:20px}
.lesson p,.lesson li{max-width:76ch}
.lesson ul,.lesson ol{padding-left:22px;margin:6px 0}
.lesson li{margin:3px 0}
.fx{font-family:var(--mono);font-size:15px;background:var(--sheet2);border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:0 10px 10px 0;padding:9px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.fx.big{font-size:17px;padding:13px 16px}
.keep{border:1px dashed var(--pen);border-radius:12px;padding:12px 16px;background:color-mix(in srgb,var(--pen) 6%,var(--sheet));margin:12px 0}
.keep b:first-child{color:var(--pen)}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--muted);background:var(--sheet2)}
td.m{font-family:var(--mono);font-size:14px;white-space:nowrap}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:18px;align-items:center}
.pager a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pager a:hover{border-color:var(--accent)}
.pager a small{color:var(--muted);font-size:13px}
.pager a.next{text-align:right}
@media (max-width:640px){.pager{grid-template-columns:1fr}.pager a.next{text-align:left}}

/* controale */
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field{margin-bottom:12px}
select,input[type=number],input[type=search]{font:inherit;color:var(--ink);background:var(--sheet2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%}
input[type=number]{font-family:var(--mono);font-size:15px}
input[type=range]{width:100%;accent-color:var(--pen)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}

/* grafice */
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.plot{background:var(--sheet2);border:1px solid var(--line);border-radius:12px;padding:10px}
.plot h4{font-family:var(--display);font-size:14.5px;margin:0 0 6px;font-weight:700}
.plot canvas{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--sheet)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;font-weight:600}
.tile.hi{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 6%,var(--sheet))}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:3px}
.chip.plus{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.minus{background:color-mix(in srgb,var(--pen) 16%,transparent);color:var(--pen)}
.chip.zero{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}

/* quiz, carduri, pași */
.qtext{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px}
.opt .L{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--sheet))}
.opt.wrong{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 10%,var(--sheet))}
.opt:disabled{cursor:default}
.explain{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--sheet2);border:1px dashed var(--line)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mono{font-family:var(--mono);font-size:14px;color:var(--muted)}
.card{perspective:1400px;cursor:pointer;max-width:640px}
.card-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;background:var(--sheet2)}
.face.back{transform:rotateY(180deg);background:var(--sheet);border:2px solid var(--pen)}
.face .tagl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.face .big{font-size:22px;font-weight:700;line-height:1.35}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet2)}
.step .n{font-family:var(--mono);font-weight:600;color:var(--pen)}
.step .f{font-family:var(--mono);font-size:14px;overflow-x:auto}
.step .r{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.step .what{font-size:14px;color:var(--muted);font-weight:600}
.data{font-family:var(--mono);font-size:14.5px;background:var(--sheet2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.empty{color:var(--muted);font-style:italic}
mark{background:color-mix(in srgb,var(--warn) 32%,transparent);color:inherit;border-radius:3px}
.note{font-size:13.5px;color:var(--muted)}
footer{max-width:1200px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:13.5px}
.stack>*,.lessonwrap>*,.grid2>*,.hero>*{min-width:0}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:30px}
.subj{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:16px;padding:18px;transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.subj .let{width:38px;height:38px;border-radius:10px;background:var(--sc);color:var(--sheet);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.subj .t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}
.subj .d{color:var(--muted);font-size:15px}
.subj .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
@media (prefers-reduced-motion:reduce){.subj{transition:none}.subj:hover{transform:none}}
.seg a{font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);border-radius:999px;padding:6px 13px;text-decoration:none}
.seg a:hover{border-color:var(--accent)}
.seg a[aria-current="page"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.panel.mega{position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(1060px,94vw);max-height:calc(100vh - 84px);overflow:auto}
.panel.mega a{padding:5px 8px}
.panel.mega a b{font-size:14px}
.panel h5 a{display:inline;padding:0;color:inherit;text-decoration:none}
.panel h5 a:hover{background:none;text-decoration:underline}
.panel a.done .n::after{content:""}
.panel a.done .n{color:var(--good)}
.plots:empty{display:none}
.tile .v.txt{font-family:var(--body);font-size:15px}
/* ===== Redesign: manual de fizică pe hârtie milimetrică ===== */
:root{--paper:#f4efe2;--sheet:#fbf8ef;--sheet2:#f0ead9;--grid:#e6dfcc;--grid2:#d8ceb4;--ink:#1c2230;--muted:#5f5b52;--accent:#cf3f1b;--accent-ink:#fffaf0;--pen:#cf3f1b;--good:#3d6b4f;--warn:#9a6a14;--line:#b9b09a;--c1:#1f3a5f;--c2:#cf3f1b;--c3:#3d6b4f;--c4:#5b4a78;--shadow:none;
 --display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a1916;--sheet:#211f1b;--sheet2:#2a2721;--grid:#24221d;--grid2:#33302a;--ink:#ece5d3;--muted:#a8a192;--accent:#ff6b3d;--accent-ink:#1a1916;--pen:#ff6b3d;--good:#8fc0a0;--warn:#e0b25a;--line:#4d493f;--c1:#9db8dc;--c2:#ff6b3d;--c3:#8fc0a0;--c4:#b9a6d6;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1a1916;--sheet:#211f1b;--sheet2:#2a2721;--grid:#24221d;--grid2:#33302a;--ink:#ece5d3;--muted:#a8a192;--accent:#ff6b3d;--accent-ink:#1a1916;--pen:#ff6b3d;--good:#8fc0a0;--warn:#e0b25a;--line:#4d493f;--c1:#9db8dc;--c2:#ff6b3d;--c3:#8fc0a0;--c4:#b9a6d6;--shadow:none;color-scheme:dark}
body{font-size:17.5px;line-height:1.55;background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px}
:focus-visible{outline:2px solid var(--accent);border-radius:0}
.topbar{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:3px double var(--ink)}
.bar{max-width:1160px;padding:0 24px}
.logo{font-weight:600;font-size:20px;letter-spacing:-.01em}
.logo .mark{border-radius:0;background:var(--ink);color:var(--paper);font-family:var(--mono);width:30px;height:30px}
.menu > a,.menu > .dd > button{border-radius:0;font-family:var(--body);font-weight:600;font-size:16px;padding:8px 10px}
.menu > a:hover,.menu > .dd > button:hover,.menu > .dd > button[aria-expanded="true"]{background:none;text-decoration:underline;text-underline-offset:6px}
.menu > a[aria-current="page"],.menu > .dd.on > button{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--accent);text-underline-offset:6px}
.panel{border-radius:0;border:1px solid var(--ink);box-shadow:5px 5px 0 var(--grid2);background:var(--sheet)}
.panel h5{font-family:var(--mono);font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:2px 4px 6px}
.panel a{border-radius:0}.panel a:hover,.panel a:focus-visible{background:var(--sheet2)}
.panel a .n{color:var(--muted);font-weight:400}
.iconbtn{border-radius:0;border-color:var(--ink);background:none}
.mnav{background:var(--paper)}.mnav a{border-radius:0}
main{max-width:1160px;padding:40px 24px 88px}
h1{font-weight:600;letter-spacing:-.02em;font-size:clamp(32px,4.6vw,52px);line-height:1.02;margin-bottom:12px}
h2{font-weight:600;font-size:23px;letter-spacing:-.01em}
h3{font-family:var(--body);font-style:italic;font-weight:600;font-size:19px;margin-top:26px}
.lead{font-size:19px;max-width:58ch;color:var(--muted)}
.crumbs{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sheet{border-radius:0;border:1px solid var(--line);border-top:2px solid var(--ink);box-shadow:none;padding:22px 24px}
.badge{border-radius:0;background:none;border:1px solid currentColor;color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px}
.badge.extra{background:none;color:var(--muted)}.badge.good{background:none;color:var(--good)}
/* formule: elementul principal */
.fx{background:none;border:0;border-radius:0;padding:8px 52px 8px 0;margin:12px 0;font-size:19px;color:var(--ink);position:relative}
.fx.big{font-size:clamp(19px,2.5vw,25px);padding:14px 52px 14px 0;font-weight:500}
.lesson{counter-reset:eq}
.lesson .fx::after{counter-increment:eq;content:"(" counter(eq) ")";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:400;background:var(--sheet);padding-left:10px}
.lesson li .fx{padding-right:0}.lesson li .fx::after{content:none;counter-increment:none}
.lesson p,.lesson li{max-width:66ch}
.keep{border:0;border-left:3px solid var(--accent);border-radius:0;background:none;padding:4px 0 4px 18px;margin:18px 0}
.brief{border-radius:0;background:none;border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0}
.brief h2{color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500}
table{font-size:16px}thead th{background:none;font-family:var(--mono);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--ink)}
td.m{font-size:14.5px}
/* liste ca un cuprins */
.cards{display:block;max-width:900px;border-top:1px solid var(--ink)}
.ch{display:grid;grid-template-columns:56px 1fr auto;column-gap:10px;align-items:baseline;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 6px;transition:none}
.ch:hover{transform:none;box-shadow:none;border-color:var(--line);background:var(--sheet)}
.ch:hover .t{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.ch .no{font-family:var(--mono);font-size:13px;color:var(--muted);grid-row:1/3}
.ch .t{grid-column:2;font-size:20px;font-weight:600;letter-spacing:-.01em}
.ch .d{grid-column:2;font-size:15.5px}
.ch .st{grid-column:3;grid-row:1/3;align-self:center;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:620px){.ch{grid-template-columns:40px 1fr}.ch .st{grid-column:2;grid-row:auto;margin-top:4px}}
.group-h{border-bottom:0;margin-bottom:8px}.group-h span{font-family:var(--mono);font-size:12.5px}
.meter{border-radius:0;height:5px;border:0;background:var(--grid2);min-width:60px}.meter i{border-radius:0;background:var(--ink)}
/* prima pagină */
.front{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);column-gap:64px;align-items:start}
@media (max-width:900px){.front{grid-template-columns:1fr}.front-side{margin-top:40px!important;position:static!important}}
.over{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 14px}
.title{font-size:clamp(44px,7.4vw,88px);line-height:.94;font-weight:600;letter-spacing:-.03em;margin:0 0 20px;max-width:10ch}
.title em{font-style:italic;font-weight:400}
.rule{font-family:var(--mono);font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:6px;margin:44px 0 0}
.contents{list-style:none;margin:0;padding:0}
.contents a{display:grid;grid-template-columns:44px auto 1fr auto;column-gap:10px;align-items:baseline;padding:14px 4px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.contents a:hover{background:var(--sheet)}.contents a:hover .nm{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
.contents .let{font-family:var(--mono);font-size:15px;color:var(--muted)}
.contents .nm{font-family:var(--display);font-size:clamp(24px,3.2vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.contents .dots{border-bottom:2px dotted var(--line);transform:translateY(-6px);min-width:16px}
.contents .meta{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.contents .sub{grid-column:2/5;color:var(--muted);font-size:16px}
@media (max-width:560px){.contents a{grid-template-columns:30px 1fr}.contents .dots{display:none}.contents .meta{grid-column:2}.contents .sub{grid-column:2}}
.front-side{margin-top:96px;position:sticky;top:92px}
.daily{border-top:2px solid var(--ink);padding-top:12px}
.daily .f{font-family:var(--mono);font-size:clamp(20px,2.2vw,26px);font-weight:500;line-height:1.35;margin:10px 0 8px;overflow-wrap:anywhere}
.daily a{color:var(--muted);font-size:15px}
.ptable{margin-top:36px;font-size:15px}.ptable td,.ptable th{padding:6px 4px}.ptable td:not(:first-child),.ptable th:not(:first-child){text-align:right;font-family:var(--mono);font-size:13.5px}
/* instrumente */
label{font-family:var(--body);font-size:15px;font-weight:600;color:var(--ink)}
select,input[type=number],input[type=search]{border-radius:0;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 2px}
.btn{border-radius:0;font-family:var(--mono);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--ink);color:var(--ink)}.btn.ghost:hover{background:var(--sheet2)}
.seg{gap:0}.seg button,.seg a{border-radius:0;font-family:var(--mono);font-size:12.5px;font-weight:500;border-color:var(--ink);background:none;margin:0 -1px -1px 0;padding:7px 12px}
.seg button:hover,.seg a:hover{background:var(--sheet2)}
.seg button[aria-pressed="true"],.seg a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.inst-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.inst-h output{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.inst-s{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.field .mono{color:var(--ink);font-size:15px;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:2px 0 0;background:linear-gradient(var(--ink),var(--ink)) 0 100%/100% 1.5px no-repeat,repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) 0 100%/100% 9px no-repeat,repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 2%) 0 100%/100% 5px no-repeat;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{background:none;height:30px}
input[type=range]::-moz-range-track{background:none;height:30px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:26px;margin-top:2px;background:var(--accent);border:0;border-radius:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
input[type=range]::-moz-range-thumb{width:14px;height:26px;background:var(--accent);border:0;border-radius:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.plot{border-radius:0;background:var(--sheet);border:1px solid var(--line);padding:12px}
.plot h4{font-family:var(--body);font-style:italic;font-weight:600;font-size:15.5px}
.legend{font-family:var(--mono);font-size:12.5px}.legend i{height:2px}
.results{gap:14px 0;margin-top:18px}
.tile{border-radius:0;border:0;border-left:1px solid var(--line);background:none;padding:2px 14px}
.tile .k{font-size:13.5px}.tile .v{font-size:19px}
.tile.hi{border-left:3px solid var(--accent);background:none}.tile.hi .v{color:var(--accent)}
.chip{border-radius:0;font-family:var(--mono);font-weight:500;background:none!important;padding:0}
.hint{font-size:15px;font-style:italic}
.note{font-size:14px}
/* exersare */
.qtext{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.opt{border-radius:0;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px}
.opt:hover:not(:disabled){background:var(--sheet2)}
.opt.right{background:none;border-bottom:2px solid var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:none;border-bottom:2px solid var(--accent);text-decoration:line-through;text-decoration-color:var(--accent)}
.explain{border-radius:0;background:none;border:0;border-left:3px solid var(--ink);padding:4px 0 4px 16px}
.face{border-radius:2px;border:1px solid var(--ink);background:var(--sheet)}.face.back{border:1px solid var(--ink);box-shadow:5px 5px 0 var(--accent)}
.face .big{font-family:var(--display)}
.step{border-radius:0;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.step .n{color:var(--muted)}.step .f{font-size:15.5px}.step .r{color:var(--accent);font-size:17px;margin-top:2px}
.data{border-radius:0;background:none;border:0;border-left:1px solid var(--ink);padding:2px 0 2px 14px}
.toc{border-radius:0;border:0;border-left:1px solid var(--ink);background:none;padding:0 0 0 10px}
.toc h5{font-family:var(--mono);font-weight:500}.toc a{border-radius:0}
.toc a[aria-current="page"]{background:var(--ink);color:var(--paper)}.toc a[aria-current="page"] .n{color:var(--paper)}
.toc a .n{color:var(--muted)}
.pager a{border-radius:0;background:none;border-color:var(--ink)}
footer{max-width:1160px;font-family:var(--mono);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
/* ===== v3: viu, colorat pe materii, cu mișcare ===== */
:root{--paper:#fbf6ec;--sheet:#ffffff;--sheet2:#f6efe2;--grid:#efe6d6;--grid2:#eee4d2;--ink:#1d2333;--muted:#666b7a;--line:#e9dfcd;--accent:#e4572e;--accent-ink:#ffffff;--pen:#e4572e;--good:#1f9d6b;--warn:#b7791f;--c1:#2f6fed;--c2:#e4572e;--c3:#12a594;--c4:#8b5cf6;--amber:#d9930d;
 --shadow:0 2px 0 rgba(29,35,51,.03),0 14px 34px rgba(29,35,51,.08);--body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14151b;--sheet:#1d1f28;--sheet2:#272a36;--grid:#22242e;--grid2:#2c2f3c;--ink:#f1ede4;--muted:#a3a7b5;--line:#323645;--accent:#ff7a52;--accent-ink:#14151b;--pen:#ff7a52;--good:#4ed6a0;--warn:#f0c060;--c1:#7aa7ff;--c2:#ff7a52;--c3:#4fd1c1;--c4:#b79bff;--amber:#f2c14e;--shadow:0 2px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14151b;--sheet:#1d1f28;--sheet2:#272a36;--grid:#22242e;--grid2:#2c2f3c;--ink:#f1ede4;--muted:#a3a7b5;--line:#323645;--accent:#ff7a52;--accent-ink:#14151b;--pen:#ff7a52;--good:#4ed6a0;--warn:#f0c060;--c1:#7aa7ff;--c2:#ff7a52;--c3:#4fd1c1;--c4:#b79bff;--amber:#f2c14e;--shadow:0 2px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="ocean"]{--paper:#eef6fb;--sheet:#ffffff;--sheet2:#e3f0f8;--grid:#d9e9f3;--grid2:#cfe2ee;--ink:#0f2a3d;--muted:#567086;--line:#cfe0ec;--accent:#0a84c6;--accent-ink:#ffffff;--pen:#0a84c6;--good:#138a63;--warn:#b7791f;--c1:#0a84c6;--c2:#f0643a;--c3:#10a39a;--c4:#7c5cf0;--amber:#d9930d;--shadow:0 2px 0 rgba(20,30,50,.03),0 14px 34px rgba(20,30,50,.08);color-scheme:light}
:root[data-theme="padure"]{--paper:#f1f6ee;--sheet:#ffffff;--sheet2:#e6efe0;--grid:#dde8d5;--grid2:#d2e0c9;--ink:#1b2a1e;--muted:#5d6f5f;--line:#d6e3cd;--accent:#2e8b57;--accent-ink:#ffffff;--pen:#2e8b57;--good:#1f8a52;--warn:#b7791f;--c1:#2f6fed;--c2:#d9622b;--c3:#2e8b57;--c4:#8b5cf6;--amber:#d9930d;--shadow:0 2px 0 rgba(20,30,50,.03),0 14px 34px rgba(20,30,50,.08);color-scheme:light}
:root[data-theme="apus"]{--paper:#fff3ee;--sheet:#ffffff;--sheet2:#ffe8de;--grid:#fbe0d3;--grid2:#f6d3c2;--ink:#3a1f1a;--muted:#82625a;--line:#f3d6c8;--accent:#e8456b;--accent-ink:#ffffff;--pen:#e8456b;--good:#1f9d6b;--warn:#c27a12;--c1:#3b6fe0;--c2:#e8456b;--c3:#f08a24;--c4:#9b4fd1;--amber:#e0a21a;--shadow:0 2px 0 rgba(20,30,50,.03),0 14px 34px rgba(20,30,50,.08);color-scheme:light}
:root[data-theme="lavanda"]{--paper:#f5f2fc;--sheet:#ffffff;--sheet2:#ece6fa;--grid:#e4dcf6;--grid2:#d9cff1;--ink:#241c3a;--muted:#6b6385;--line:#e0d8f3;--accent:#7c4dff;--accent-ink:#ffffff;--pen:#7c4dff;--good:#1f9d6b;--warn:#b7791f;--c1:#3d7bf0;--c2:#e0567a;--c3:#14a39a;--c4:#7c4dff;--amber:#d9930d;--shadow:0 2px 0 rgba(20,30,50,.03),0 14px 34px rgba(20,30,50,.08);color-scheme:light}
:root[data-theme="noapte"]{--paper:#0c1424;--sheet:#131e33;--sheet2:#1b2944;--grid:#17233b;--grid2:#22304d;--ink:#e6eefc;--muted:#93a3c0;--line:#263656;--accent:#4da3ff;--accent-ink:#0c1424;--pen:#4da3ff;--good:#48d597;--warn:#f2c14e;--c1:#4da3ff;--c2:#ff8a5c;--c3:#3ddbc7;--c4:#b59bff;--amber:#f2c14e;--shadow:0 2px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="neon"]{--paper:#0f0b1a;--sheet:#181228;--sheet2:#221a38;--grid:#1c1530;--grid2:#2a2045;--ink:#f3eaff;--muted:#a99cc6;--line:#31264f;--accent:#ff3ea5;--accent-ink:#0f0b1a;--pen:#ff3ea5;--good:#3dffa8;--warn:#ffd23f;--c1:#3ec5ff;--c2:#ff3ea5;--c3:#3dffa8;--c4:#b98bff;--amber:#ffd23f;--shadow:0 2px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="cafea"]{--paper:#1b1410;--sheet:#241b16;--sheet2:#2e231c;--grid:#281e18;--grid2:#362a21;--ink:#f1e4d6;--muted:#b39f8b;--line:#3d2f25;--accent:#e3a14a;--accent-ink:#1b1410;--pen:#e3a14a;--good:#8fcf8a;--warn:#f0c060;--c1:#7fb2ff;--c2:#e3a14a;--c3:#6fd1b5;--c4:#c49bff;--amber:#f0c060;--shadow:0 2px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="noapte"] .daily .f,:root[data-theme="neon"] .daily .f,:root[data-theme="cafea"] .daily .f{color:var(--paper)}
.tpanel{position:fixed;top:64px;right:14px;z-index:60;width:min(330px,calc(100vw - 28px));background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:14px;animation:tpin .2s ease}
.tpanel h3{margin:2px 4px 10px;font-size:15px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--sheet2);border:2px solid transparent;border-radius:14px;padding:8px 6px 7px;cursor:pointer;display:grid;gap:6px;justify-items:center;transition:transform .15s,border-color .15s}
.tgrid button:hover{transform:translateY(-2px)}
.tgrid button[aria-pressed="true"]{border-color:var(--accent)}
.tgrid .sw{width:100%;height:34px;border-radius:9px;border:1px solid rgba(127,127,127,.25)}
@keyframes tpin{from{opacity:0;transform:translateY(-6px)}}
@media (max-width:560px){.tpanel{top:58px}}
body{background-image:none;font-size:17px;line-height:1.6}
#view{--sc:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:8px}
.topbar{border-bottom:0;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.rp{position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.logo .mark{border-radius:11px;background:var(--accent);color:#fff;width:34px;height:34px;font-family:var(--display);font-weight:600;font-size:17px}

/* mișcare */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%)}}
.panel:not(.mega){animation-name:drop2}@keyframes drop2{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes pist{from{transform:translateY(-8px)}to{transform:translateY(14px)}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes wave{to{transform:translateX(-40px)}}
#view.enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter > *:nth-child(2){animation-delay:.05s}#view.enter > *:nth-child(3){animation-delay:.1s}#view.enter > *:nth-child(4){animation-delay:.15s}#view.enter > *:nth-child(n+5){animation-delay:.2s}
#view.enter .subj,#view.enter .cards .ch{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter .subj:nth-child(1),#view.enter .cards .ch:nth-child(1){animation-delay:.12s}#view.enter .subj:nth-child(2),#view.enter .cards .ch:nth-child(2){animation-delay:.17s}#view.enter .subj:nth-child(3),#view.enter .cards .ch:nth-child(3){animation-delay:.22s}#view.enter .subj:nth-child(4),#view.enter .cards .ch:nth-child(4){animation-delay:.27s}#view.enter .cards .ch:nth-child(5){animation-delay:.31s}#view.enter .cards .ch:nth-child(6){animation-delay:.35s}#view.enter .cards .ch:nth-child(n+7){animation-delay:.39s}

/* ---------- mod aplicație (Android / iOS) ----------
   Zonele sigure: bara de stare, „notch”-ul și bara de gesturi. Capacitor pe Android
   pune și variabilele --safe-area-inset-*, pentru WebView-uri vechi unde env() dă 0. */
:root{
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));
  --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.btn,.iconbtn,summary,.ch,.panel a,.mnav a{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.topbar{padding-top:var(--sat)}
.bar{padding-left:max(20px,var(--sal));padding-right:max(20px,var(--sar))}
main{padding-left:max(20px,var(--sal));padding-right:max(20px,var(--sar));padding-bottom:calc(80px + var(--sab))}
footer{padding-bottom:calc(30px + var(--sab))}
.toc{top:calc(84px + var(--sat))}
.front-side{top:calc(92px + var(--sat))}
.panel.mega{top:calc(66px + var(--sat));max-height:calc(100vh - 84px - var(--sat))}
.tpanel{top:calc(64px + var(--sat));max-height:calc(100vh - 80px - var(--sat) - var(--sab));overflow:auto}
.sbtop{top:calc(64px + var(--sat))}
#lock{padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab))}
@media (max-width:900px){.mnav{max-height:calc(100vh - 62px - var(--sat));max-height:calc(100dvh - 62px - var(--sat));padding-bottom:calc(18px + var(--sab));overscroll-behavior:contain}}
@media (max-width:560px){.tpanel{top:calc(58px + var(--sat))}.sbtop{top:calc(58px + var(--sat))}}

.nt-chips button[aria-pressed="true"]{background:var(--sc,var(--accent));border-color:transparent;color:#fff}
.nt-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.nt-hero{grid-template-columns:minmax(0,1fr)}}
.nt-frame{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.nt-num{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.nt-num b{font-family:var(--mono);font-size:30px;line-height:1;color:var(--pen)}
.nt-num span{color:var(--muted)}
.nt-calc label{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.nt-calc label b{font-family:var(--mono);color:var(--accent)}
.nt-out{font-size:17.5px;margin:12px 0 0;min-height:26px}
.nt-out b{font-family:var(--mono);color:var(--pen)}
.nt-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,290px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.nt-row .nt-card{scroll-snap-align:start}
.nt-daily{display:block;margin-top:16px;text-decoration:none;color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sheet)}
.nt-daily span{display:block;padding:10px 14px 2px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.nt-daily b{display:block;padding:0 14px 12px;font-family:var(--display);font-size:18px}
.pm-b.nat{opacity:1}
.pm-b.nat .nt-frame{max-width:min(100%,72cqi);margin:0 auto}
/* animațiile scenelor */
.nt-svg .nt-rain{animation:ntRain .7s linear infinite}
@keyframes ntRain{from{transform:translate(4px,-24px)}to{transform:translate(-6px,30px)}}
.nt-svg .nt-pulse{animation:ntPulse 3s ease-in-out infinite alternate}
@keyframes ntPulse{to{transform:scale(1.07)}}
.nt-svg .nt-twinkle{animation:ntTw 2.4s ease-in-out infinite alternate}
@keyframes ntTw{from{opacity:.25}to{opacity:1}}
.nt-svg .nt-dive{animation:ntDive 2.8s linear infinite}
@keyframes ntDive{from{transform:translate(-40px,-40px)}to{transform:translate(380px,290px)}}
.nt-svg .nt-swim{animation:ntSwim 7s linear infinite}
@keyframes ntSwim{from{transform:translateX(150px)}to{transform:translateX(-230px)}}
.nt-svg .nt-wig{animation:ntWig .5s ease-in-out infinite alternate}
@keyframes ntWig{from{transform:translateY(-1.6px)}to{transform:translateY(1.6px)}}
.nt-svg .nt-jet{transform-box:fill-box;animation:ntJet .75s linear infinite}
@keyframes ntJet{from{transform:translateX(0);opacity:1}to{transform:translateX(46px);opacity:0}}
.nt-svg .nt-flow{animation:ntFlow 5s linear infinite}
@keyframes ntFlow{to{stroke-dashoffset:-240}}
.nt-svg .nt-down{animation:ntDown .55s linear infinite}
@keyframes ntDown{to{stroke-dashoffset:-44}}
.nt-svg .nt-down2{animation:ntDown2 .6s linear infinite}
@keyframes ntDown2{to{stroke-dashoffset:-26}}
.nt-svg .nt-slide{animation:ntSlide 2.8s ease-in infinite}
@keyframes ntSlide{0%{transform:translate(0,0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translate(-220px,94px);opacity:0}}
.nt-svg .nt-ripple{transform-box:fill-box;transform-origin:center!important;animation:ntRip 2s ease-out infinite}
.nt-svg .nt-ripple2{transform-box:fill-box;transform-origin:center;animation:ntRip 3s ease-out infinite}
@keyframes ntRip{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}
.nt-svg .nt-mist{transform-box:fill-box;transform-origin:center;animation:ntMist 2s ease-out infinite}
@keyframes ntMist{from{transform:translateY(0) scale(.6);opacity:.8}to{transform:translateY(-26px) scale(1.6);opacity:0}}
.nt-svg .nt-orbit{animation:ntSpin 14s linear infinite}
.nt-svg .nt-spin{animation:ntSpin 24s linear infinite}
.nt-svg .nt-spin2{transform-box:fill-box;transform-origin:center;animation:ntSpin 1.4s linear infinite}
@keyframes ntSpin{to{transform:rotate(360deg)}}
.nt-svg .nt-sway{animation:ntSway 3s ease-in-out infinite alternate}
@keyframes ntSway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.nt-svg .nt-zig{animation:ntZig0 7s linear infinite}
.nt-svg .nt-zig1{animation-name:ntZig1}.nt-svg .nt-zig2{animation-name:ntZig2}
@keyframes ntZig0{0%{transform:translate(0,0);opacity:0}8%{opacity:1}20%{transform:translate(30px,-14px)}40%{transform:translate(44px,18px)}60%{transform:translate(96px,-6px)}80%{transform:translate(130px,24px)}95%{opacity:1}100%{transform:translate(200px,4px);opacity:0}}
@keyframes ntZig1{0%{transform:translate(0,0);opacity:0}8%{opacity:1}25%{transform:translate(22px,20px)}45%{transform:translate(70px,-4px)}65%{transform:translate(84px,-30px)}85%{transform:translate(150px,-16px)}95%{opacity:1}100%{transform:translate(210px,-34px);opacity:0}}
@keyframes ntZig2{0%{transform:translate(0,0);opacity:0}8%{opacity:1}15%{transform:translate(18px,-26px)}35%{transform:translate(60px,-40px)}55%{transform:translate(70px,10px)}75%{transform:translate(124px,30px)}95%{opacity:1}100%{transform:translate(190px,40px);opacity:0}}
.nt-svg .nt-rise{transform-box:fill-box;transform-origin:center;animation:ntRise 4s linear infinite}
@keyframes ntRise{from{transform:translateY(0) scale(1);opacity:.95}to{transform:translateY(-162px) scale(2.4);opacity:.5}}
.nt-svg .nt-rise2{animation:ntRise2 6s linear infinite}
@keyframes ntRise2{from{transform:translateY(20px);opacity:0}15%{opacity:1}to{transform:translateY(-190px);opacity:0}}
.nt-svg .nt-swim2{animation:ntSwim2 4s ease-in-out infinite alternate}
@keyframes ntSwim2{from{transform:translateX(0)}to{transform:translateX(-46px)}}
.nt-svg .nt-cap{animation:ntCap 6s ease-in-out infinite}
@keyframes ntCap{0%,20%{opacity:0}45%,80%{opacity:1}100%{opacity:0}}
.nt-svg .nt-parcel{transform-box:fill-box;transform-origin:center;animation:ntParcel 6s ease-in-out infinite}
@keyframes ntParcel{0%{transform:translate(0,0) scale(.8)}30%{transform:translate(110px,-116px) scale(1.15)}50%{transform:translate(136px,-142px) scale(1.4)}70%{transform:translate(172px,-106px) scale(1.15)}100%{transform:translate(276px,-2px) scale(.8)}}
.nt-svg .nt-snow{animation:ntSnow 5s linear infinite}
@keyframes ntSnow{from{transform:translate(0,-10px)}to{transform:translate(14px,60px)}}
.nt-svg .nt-flash{animation:ntFlash 4s linear infinite}
.nt-svg .nt-flash2{animation:ntFlash2 4s linear infinite}
@keyframes ntFlash{0%,100%{opacity:0}3%{opacity:1}6%{opacity:.15}9%{opacity:1}15%{opacity:0}}
@keyframes ntFlash2{0%,100%{opacity:0}3%{opacity:.3}6%{opacity:0}9%{opacity:.22}14%{opacity:0}}
.nt-svg .nt-wig2{animation:ntWig2 1.4s ease-in-out infinite alternate}
@keyframes ntWig2{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.nt-svg .nt-flee{animation:ntFlee 4s ease-in infinite}
@keyframes ntFlee{0%,10%{transform:translateX(0);opacity:1}100%{transform:translateX(50px);opacity:0}}
.nt-svg .nt-fly{animation:ntFly 9s linear infinite}
@keyframes ntFly{from{transform:translateX(-90px)}to{transform:translateX(150px)}}
.nt-svg .nt-needle{transform-box:fill-box;transform-origin:center;animation:ntNeedle 6s ease-out infinite}
@keyframes ntNeedle{0%{transform:rotate(50deg)}15%{transform:rotate(-30deg)}30%{transform:rotate(18deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(4deg)}75%,100%{transform:rotate(0)}}
.nt-svg .nt-wing{transform-box:fill-box;transform-origin:center bottom;animation:ntWing .12s linear infinite alternate}
@keyframes ntWing{to{transform:scaleY(.35)}}
.nt-svg .nt-tsu{transform-box:fill-box;transform-origin:center bottom;animation:ntTsu 7s ease-in infinite}
@keyframes ntTsu{0%{transform:translateX(0) scaleY(1);opacity:1}65%{transform:translateX(220px) scaleY(1.4)}92%{transform:translateX(286px) scaleY(3.4);opacity:1}100%{transform:translateX(300px) scaleY(3.6);opacity:0}}
.nt-svg .nt-pend{animation:ntPend 1.3s ease-in-out infinite alternate}
@keyframes ntPend{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.nt-svg .nt-photon{animation:ntPhoton 2.4s linear infinite}
@keyframes ntPhoton{0%{transform:translate(0,0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(140px,96px);opacity:0}}
.nt-svg .nt-flare{animation:ntFlare 3s ease-in-out infinite alternate}
@keyframes ntFlare{from{opacity:.35}to{opacity:1}}
.nt-svg .nt-fuseL{transform-box:fill-box;transform-origin:center;animation:ntFuseL 3s ease-in infinite}
.nt-svg .nt-fuseR{transform-box:fill-box;transform-origin:center;animation:ntFuseR 3s ease-in infinite}
@keyframes ntFuseL{0%{transform:translateX(-34px);opacity:1}55%{transform:translateX(-4px);opacity:1}60%,100%{transform:translateX(0);opacity:0}}
@keyframes ntFuseR{0%{transform:translateX(34px);opacity:1}55%{transform:translateX(4px);opacity:1}60%,100%{transform:translateX(0);opacity:0}}
.nt-svg .nt-boom{transform-box:fill-box;transform-origin:center;animation:ntBoom 3s ease-out infinite}
@keyframes ntBoom{0%,55%{transform:scale(0);opacity:0}62%{transform:scale(1);opacity:1}85%,100%{transform:scale(1.8);opacity:0}}
.nt-svg .nt-decay{animation:ntDecay 8s linear infinite}
@keyframes ntDecay{0%,55%{opacity:1}58%{opacity:1;fill:#fff}64%,100%{opacity:0}}
.nt-svg .nt-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ntDraw 6s ease-out infinite}
@keyframes ntDraw{0%{stroke-dashoffset:1}45%,100%{stroke-dashoffset:0}}
.nt-svg .nt-shimmer{animation:ntShim 1.4s ease-in-out infinite alternate}
@keyframes ntShim{from{transform:scaleX(.88);opacity:.45}to{transform:scaleX(1.1);opacity:.9}}
.nt-svg .nt-bob{animation:ntBob 2.2s ease-in-out infinite alternate}
@keyframes ntBob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.nt-svg .nt-aurora{animation:ntAur 7s ease-in-out infinite alternate}
@keyframes ntAur{0%{transform:skewX(-8deg) translateX(-10px);opacity:.55}50%{opacity:1}100%{transform:skewX(8deg) translateX(10px);opacity:.7}}
@media (prefers-reduced-motion:reduce){.nt-svg *{animation:none!important}.nt-card{transition:none}}

/* ---------- PREMIUM: lecții video și audio ---------- */
:root[data-theme="dark"],:root[data-theme="noapte"],:root[data-theme="neon"],:root[data-theme="cafea"]{--gold:#f2c14e}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--gold:#f2c14e}}
:root{--gold:#c8902a}
.pm-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pm-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pm-strip .btn{display:inline-flex;align-items:center;gap:8px}
.pm-strip svg{width:18px;height:18px;flex:none}
.pm-lockcard{display:flex;align-items:center;gap:12px;width:100%;text-decoration:none;color:var(--ink);border:1.5px dashed color-mix(in srgb,var(--gold) 60%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--sheet));border-radius:14px;padding:12px 16px}
.pm-lockcard b{display:block;font-family:var(--display)}
.pm-lockcard small{color:var(--muted)}
.pm-lockcard .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--gold);color:#fff;flex:none;font-size:18px}
.pm-unlock{max-width:520px}
.pm-unlock .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pm-unlock input{flex:1;min-width:0;font:600 18px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet2);color:var(--ink)}
.pm-unlock input:focus{outline:none;border-color:var(--gold)}
.pm-unlock .err{min-height:22px;color:var(--pen);font-size:14.5px;margin-top:8px}
.pm-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}
.pm-feat{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pm-feat b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.pm-feat span{color:var(--muted);font-size:14.5px}
.pm-list{display:grid;gap:8px}
.pm-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pm-item .no{font-family:var(--mono);font-weight:600;color:var(--pen);font-size:13px;text-align:center}
.pm-item .t{font-weight:700;line-height:1.3}
.pm-item .d{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.pm-item .acts{display:flex;gap:6px}
.pm-item .acts a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px;padding:7px 11px;border-radius:10px;background:var(--sheet2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pm-item .acts a.v{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pm-item .acts svg{width:15px;height:15px}
@media (max-width:560px){.pm-item{grid-template-columns:1fr;gap:6px}.pm-item .no{text-align:left}.pm-item .acts a{flex:1;justify-content:center}}

/* playerul video */
.pm-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);container-type:inline-size;isolation:isolate;user-select:none;-webkit-user-select:none}
@media (max-width:700px){.pm-video{aspect-ratio:4/5}}
.pm-video:fullscreen,.pm-video.fs{aspect-ratio:auto;width:100vw;height:100vh;height:100dvh;border-radius:0;border:0}
.pm-video.fs{position:fixed;inset:0;z-index:200}
.pm-bg{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 10%,color-mix(in srgb,var(--sc,var(--accent)) 22%,transparent),transparent 55%),radial-gradient(circle at 0% 100%,color-mix(in srgb,var(--sc,var(--accent)) 14%,transparent),transparent 50%),var(--sheet)}
.pm-bg::after{content:none}
@keyframes pmdrift{to{background-position:4cqi 4cqi}}
.pm-stage{position:absolute;inset:0;padding:5cqi 6cqi 13cqi;overflow:auto;scrollbar-width:none;font-size:clamp(13px,2.1cqi,24px);line-height:1.45}
@container (max-width:700px){.pm-stage{font-size:clamp(13px,3.6cqi,20px);padding:6cqi 6cqi 22cqi}}
.pm-stage::-webkit-scrollbar{display:none}
.pm-slide{animation:pmin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes pmin{from{opacity:0;transform:translateY(2.5cqi) scale(.985)}}
.pm-kick{font-family:var(--mono);font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--sc,var(--accent));font-weight:600;margin-bottom:.6em;display:flex;gap:.8em;align-items:center}
.pm-kick i{flex:1;height:2px;background:color-mix(in srgb,var(--sc,var(--accent)) 35%,transparent);border-radius:2px}
.pm-h{font-family:var(--display);font-weight:700;font-size:2em;line-height:1.08;margin:0 0 .6em;text-wrap:balance}
.pm-b{opacity:.18;transform:translateY(.5em);transition:opacity .45s,transform .45s,background .3s,box-shadow .3s;margin:0 0 .55em;border-radius:.5em}
.pm-b.on{opacity:1;transform:none}
.pm-b.now{background:color-mix(in srgb,var(--sc,var(--accent)) 9%,transparent);box-shadow:0 0 0 .35em color-mix(in srgb,var(--sc,var(--accent)) 9%,transparent)}
.pm-b.li{padding-left:1.3em;position:relative}
.pm-b.li::before{content:"";position:absolute;left:.25em;top:.62em;width:.45em;height:.45em;border-radius:50%;background:var(--sc,var(--accent))}
.pm-b.fx{font-family:var(--mono);font-size:1.18em;font-weight:600;background:var(--sheet2);border:1px solid var(--line);border-left:.25em solid var(--pen);border-radius:0 .5em .5em 0;padding:.45em .8em;overflow-x:auto}
.pm-b.fx.now{box-shadow:0 0 0 .3em color-mix(in srgb,var(--pen) 16%,transparent)}
.pm-b.keep{border:2px dashed var(--pen);padding:.5em .8em;background:color-mix(in srgb,var(--pen) 6%,transparent)}
.pm-b.tbl table{font-size:.8em}
.pm-b.tbl th,.pm-b.tbl td{padding:.3em .6em}
.pm-b.pic svg{max-width:100%;height:auto;max-height:38cqi}
.pm-title{display:grid;place-items:center;text-align:center;min-height:100%;align-content:center;gap:.4em}
.pm-title .ill{width:26cqi;height:auto;color:var(--sc,var(--accent))}
.pm-title .pm-h{font-size:2.6em;margin:0}
.pm-title p{color:var(--muted);margin:0;font-size:1.1em}
.pm-title .pm-kick{justify-content:center}
.pm-end .pm-check{list-style:none;padding:0;margin:0;display:grid;gap:.5em}
.pm-cap{position:absolute;left:50%;bottom:3.2cqi;transform:translateX(-50%);width:min(92%,80ch);text-align:center;font-size:clamp(13px,1.9cqi,21px);line-height:1.35;background:rgba(10,12,18,.82);color:#fff;padding:.45em .9em;border-radius:.6em;pointer-events:none;transition:opacity .25s}
@container (max-width:700px){.pm-cap{font-size:clamp(12.5px,3.4cqi,17px);bottom:4cqi}}
.pm-cap:empty,.pm-video.nocap .pm-cap{opacity:0}
.pm-big{position:absolute;inset:0;margin:auto;width:18cqi;height:18cqi;max-width:110px;max-height:110px;min-width:64px;min-height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:transform .15s,opacity .2s}
.pm-big svg{width:42%;height:42%;margin-left:6%}
.pm-big:hover{transform:scale(1.05)}
.pm-video.playing .pm-big,.pm-video.started .pm-big{opacity:0;pointer-events:none}
.pm-tap{position:absolute;inset:0;z-index:1;background:transparent;border:0;cursor:pointer}
.pm-video .pm-stage{z-index:0}
.pm-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pm-ctrl .pbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.pm-ctrl .pbtn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;width:52px;height:52px;border-radius:50%}
.pm-ctrl .pbtn svg{width:20px;height:20px}
.pm-ctrl .pbtn[aria-pressed="true"]{background:var(--sheet2);border-color:var(--accent);color:var(--accent)}
.pm-bar{flex:1;min-width:160px;height:30px;position:relative;cursor:pointer;touch-action:none}
.pm-bar .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:99px;background:var(--sheet2);border:1px solid var(--line)}
.pm-bar .fi{position:absolute;left:0;top:12px;height:6px;border-radius:99px;background:var(--accent);width:0;transition:width .3s}
.pm-bar .tk{position:absolute;top:9px;width:2px;height:12px;background:var(--muted);opacity:.45;border-radius:1px}
.pm-bar .kn{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--sheet);transition:left .3s}
.pm-time{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;min-width:84px;text-align:center}
.pm-speed{width:auto!important;flex:none;font:600 14px var(--mono);height:44px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.pm-note{font-size:14px;color:var(--muted);margin-top:10px}
.pm-note:empty{display:none}
@media (max-width:560px){.pm-ctrl .pm-bar{order:-2;flex-basis:100%}.pm-ctrl .pm-time{order:-1;flex-basis:100%;text-align:right;margin-top:-6px;min-width:0}.pm-ctrl .pm-speed{margin-left:auto}}

/* panoul de voce */
.pm-vp{margin-top:12px}
.vp{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.vp-lab{display:block;font-weight:700;font-size:14px;margin:4px 0 6px}
.vp-sel{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);margin-bottom:10px}
.vp .seg{display:flex;flex-wrap:wrap;gap:6px}
.vp .seg button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet2);color:var(--ink);cursor:pointer}
.vp .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.vp-warn{border:1.5px dashed var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.vp ol{margin:8px 0 0;padding-left:20px}
.vp li{margin:4px 0}
.vp-more{margin-top:12px;font-size:14.5px;color:var(--muted)}
.vp-more summary{cursor:pointer;font-weight:600}
.pm-ctrl #pmvo{font-size:19px}
/* playerul audio */
.pm-audio{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
@media (max-width:620px){.pm-audio{grid-template-columns:1fr;text-align:center}}
.pm-cover{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--sc,var(--accent)) 40%,var(--sheet)),color-mix(in srgb,var(--sc,var(--accent)) 12%,var(--sheet)));border:1px solid var(--line);position:relative;overflow:hidden;max-width:220px;width:100%;margin:0 auto}
.pm-cover .ill{width:80%;color:var(--ink)}
.pm-eq{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:4px;justify-content:center;height:22px;align-items:flex-end;opacity:0;transition:opacity .3s}
.pm-eq i{width:4px;background:var(--accent);border-radius:2px;height:30%;animation:pmeq 1s ease-in-out infinite}
.pm-eq i:nth-child(2){animation-delay:-.3s}.pm-eq i:nth-child(3){animation-delay:-.6s}.pm-eq i:nth-child(4){animation-delay:-.15s}.pm-eq i:nth-child(5){animation-delay:-.45s}
@keyframes pmeq{50%{height:100%}}
.playing .pm-eq{opacity:1}
.pm-audio h2{margin:2px 0 4px;font-size:24px}
.pm-audio .sub{color:var(--muted);margin:0}
.pm-tr{max-height:60vh;overflow:auto;line-height:1.7;font-size:17px}
.pm-tr h3{margin:16px 0 4px;font-size:16px;color:var(--sc,var(--accent));text-transform:uppercase;letter-spacing:.05em}
.pm-tr h3:first-child{margin-top:0}
.pm-tr span{cursor:pointer;border-radius:5px;padding:1px 2px;transition:background .2s,color .2s}
.pm-tr span:hover{background:var(--sheet2)}
.pm-tr span.done{color:var(--muted)}
.pm-tr span.now{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.pm-slide,.pm-b{animation:none;transition:none}.pm-bg::after,.pm-eq i{animation:none}}

/* =====================================================================
   v6: viu, fără linii și pătrățele. Suprafețe moi cu umbre, fundal cu lumini
   colorate care se mișcă lent, butoane de minim 44 px, mod desktop cu bară laterală.
   ===================================================================== */
:root{--r-lg:24px;--r-md:18px;--r-sm:13px;
 --soft:0 1px 2px color-mix(in srgb,var(--ink) 5%,transparent),0 10px 30px -8px color-mix(in srgb,var(--ink) 14%,transparent);
 --lift:0 2px 4px color-mix(in srgb,var(--ink) 6%,transparent),0 22px 44px -12px color-mix(in srgb,var(--sc,var(--accent)) 38%,transparent);
 --glass:color-mix(in srgb,var(--sheet) 82%,transparent);--side:0px}
html{scroll-behavior:smooth}
body{background:var(--paper);background-image:none!important;isolation:isolate}
/* fundal: trei lumini colorate, estompate, care plutesc încet */
.aura{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.17;will-change:transform}
.aura i:nth-child(1){left:-6vmax;top:-10vmax;background:var(--accent);animation:aur1 26s ease-in-out infinite alternate}
.aura i:nth-child(2){right:-14vmax;top:8vmax;background:var(--c1);animation:aur2 32s ease-in-out infinite alternate}
.aura i:nth-child(3){left:22vmax;bottom:-22vmax;background:var(--c3);opacity:.13;animation:aur3 38s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes aur2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes aur3{to{transform:translate(12vmax,-16vmax) scale(1.1)}}
:root[data-theme="dark"] .aura i,:root[data-theme="noapte"] .aura i,:root[data-theme="neon"] .aura i,:root[data-theme="cafea"] .aura i{opacity:.20}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .aura i{opacity:.20}}

/* bara de sus: sticlă, fără linie */
.topbar{background:var(--glass);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 6px 24px -14px color-mix(in srgb,var(--ink) 30%,transparent);border:0}
.logo .mark{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--c4)));box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.iconbtn{width:44px;height:44px;border:0;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.iconbtn:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.panel{border:0;box-shadow:0 24px 60px -16px color-mix(in srgb,var(--ink) 35%,transparent)}
.menu > a,.menu > .dd > button{min-height:44px}
.mnav{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mnav details{border:0}.mnav > a{border:0}
.mnav a,.mnav summary{min-height:44px;display:flex;align-items:center;border-radius:12px}
.mnav summary{justify-content:space-between}

/* suprafețe: fără chenare, cu umbre moi */
.sheet,.ch,.plot,.toc,.pager a,.pm-item,.pm-feat,.nt-card,.nt-num,.nt-daily,.vp,.kpi,.pickarea button,.face,.tpanel,.pm-unlock,.pm-video,.nt-frame{border:0!important;box-shadow:var(--soft)}
.sheet{border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ch{border-radius:var(--r-md);background:var(--sheet);min-height:64px}
.ch:hover{box-shadow:var(--lift);transform:translateY(-3px)}
.ch .no{border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 24%,transparent),color-mix(in srgb,var(--sc) 10%,transparent))}
.ch.test{border:0!important;background:linear-gradient(135deg,color-mix(in srgb,var(--sc,var(--accent)) 16%,var(--sheet)),var(--sheet));box-shadow:var(--soft),inset 0 0 0 2px color-mix(in srgb,var(--sc,var(--accent)) 30%,transparent)}
.tile{border:0;background:color-mix(in srgb,var(--sc,var(--accent)) 7%,var(--sheet));border-radius:var(--r-sm)}
.plot{border-radius:var(--r-md);background:var(--sheet)}
.toc{border-radius:var(--r-md);background:var(--glass)}
.toc a{min-height:40px;align-items:center}
.brief,.keep{border:0;box-shadow:inset 4px 0 0 color-mix(in srgb,var(--sc,var(--accent)) 70%,transparent)}
.fx{border:0;box-shadow:inset 4px 0 0 var(--sc,var(--accent));background:color-mix(in srgb,var(--sc,var(--accent)) 7%,var(--sheet))}
.explain{border:0;background:color-mix(in srgb,var(--sc,var(--accent)) 8%,var(--sheet))}
.rule{border:0!important;display:flex;align-items:center;gap:12px}
.rule::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sc,var(--accent));box-shadow:0 0 0 5px color-mix(in srgb,var(--sc,var(--accent)) 20%,transparent);flex:none}
.contents .dots{display:none}
.group-h{border:0}
/* tabele: rânduri alternate în loc de linii */
table{border-collapse:separate;border-spacing:0 4px}
th,td{border:0!important}
thead th{background:none;color:var(--muted)}
tbody tr td{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 6%,transparent)}
tbody tr td:first-child{border-radius:10px 0 0 10px}tbody tr td:last-child{border-radius:0 10px 10px 0}
tbody tr td:only-child{border-radius:10px}

/* cardurile mari (clase, BAC, capitole) */
.subjects{gap:16px}
.subj{border:0!important;border-radius:28px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--sc) 34%,var(--sheet)) 0%,color-mix(in srgb,var(--sc) 12%,var(--sheet)) 55%,var(--sheet) 100%);box-shadow:var(--soft);min-height:210px}
.subj::after{content:"";position:absolute;width:180px;height:180px;right:-60px;bottom:-70px;border-radius:50%;background:color-mix(in srgb,var(--sc) 22%,transparent);filter:blur(4px);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:0}
.subj>*{position:relative;z-index:1}
.subj:hover{transform:translateY(-6px);box-shadow:var(--lift)}
.subj:hover::after{transform:scale(1.35)}
.subj .let{background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 60%,var(--c4)));box-shadow:0 8px 18px -6px color-mix(in srgb,var(--sc) 70%,transparent)}
.subj .ill{width:150px;height:100px;opacity:.9}
.subjects.five>.klass:last-child{background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--accent) 40%,var(--sheet)),color-mix(in srgb,var(--c4) 14%,var(--sheet)) 60%,var(--sheet))}
.chips i{background:color-mix(in srgb,var(--sheet) 70%,transparent)}
.final{box-shadow:var(--soft);background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--sc,var(--accent)) 30%,var(--sheet)),var(--sheet) 75%)}
.daily{background:linear-gradient(145deg,#1f2440,#2c1f3d 60%,color-mix(in srgb,var(--accent) 35%,#2c1f3d));color:#fff;box-shadow:var(--soft)}.daily .f,:root .daily .f{color:#fff!important}.daily a{color:#fff}

/* bare de progres */
.meter{height:10px;border:0!important;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.meter i{background:linear-gradient(90deg,var(--sc,var(--accent)),color-mix(in srgb,var(--sc,var(--accent)) 55%,var(--c3)));box-shadow:0 0 12px color-mix(in srgb,var(--sc,var(--accent)) 50%,transparent)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:0 0 26px}
.prog .pc{background:var(--glass);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--soft);display:grid;gap:8px}
.prog .pc b{font-family:var(--display);font-size:26px;line-height:1}
.prog .pc span{color:var(--muted);font-size:14px}
.prog .pc .meter{height:12px}

/* butoane și controale: minim 44 px, apăsare vizibilă */
.btn{min-height:44px;border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--c4)))}
.btn.ghost{background:var(--sheet);box-shadow:var(--soft);border:0}
.seg{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg button,.seg a{min-height:44px;display:inline-flex;align-items:center}
.opt{min-height:52px;border:0!important;background:var(--sheet);box-shadow:var(--soft),inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 8%,transparent)}
.opt:hover:not(:disabled){box-shadow:var(--soft),inset 0 0 0 2px var(--accent)}
.opt.right{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent),inset 0 0 0 2px var(--good);background:color-mix(in srgb,var(--good) 14%,var(--sheet))}
.opt.right .L{background:var(--good);color:#fff}
.opt.wrong{box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 30%,transparent),inset 0 0 0 2px var(--pen)}
.opt.wrong .L{background:var(--pen);color:#fff}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.fbk{position:fixed;left:50%;bottom:calc(26px + var(--sab));z-index:90;transform:translateX(-50%);font-weight:800;padding:10px 20px;border-radius:999px;color:#fff;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:fbk 1.1s cubic-bezier(.2,.8,.2,1) both;pointer-events:none}
.fbk.ok{background:var(--good)}.fbk.no{background:var(--pen)}
@keyframes fbk{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.04)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
select,input[type=number],input[type=search],input[type=text],.pm-unlock input{min-height:46px;border:0!important;background:var(--sheet);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 10%,transparent)}
select:focus,input:focus{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)!important}
input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--pen)!important}
.err-msg{margin:4px 0 12px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--pen) 12%,var(--sheet));color:var(--ink);font-size:15px;font-weight:600}
.step{border:0;box-shadow:var(--soft);background:var(--sheet)}
.badge{min-height:24px;display:inline-flex;align-items:center}
.crumbs a{padding:6px 2px;display:inline-block}
.tgrid button{min-height:76px;border:0;box-shadow:var(--soft);background:var(--sheet)}
.tgrid button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.tpanel .tinst{margin-top:12px;width:100%;justify-content:center}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-weight:700}
.pm-lockcard{border:0;box-shadow:var(--soft),inset 0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.pm-item .acts a{min-height:44px;border:0;box-shadow:var(--soft)}
footer{border:0}

/* ---------- MOD DESKTOP: bară laterală fixă, conținut lat ---------- */
.side{display:none}
@media (min-width:1200px){
  :root{--side:272px}
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;z-index:55;left:0;top:0;bottom:0;width:var(--side);padding:calc(18px + var(--sat)) 14px 18px;background:var(--glass);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);box-shadow:8px 0 40px -24px color-mix(in srgb,var(--ink) 35%,transparent);overflow-y:auto;scrollbar-width:thin}
  .side .logo{padding:6px 10px 14px}
  .side h6{margin:14px 12px 4px;font:800 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .side a.si{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;transition:background .18s,transform .18s}
  .side a.si:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);transform:translateX(3px)}
  .side a.si[aria-current="page"]{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--accent) 6%,transparent));color:var(--accent)}
  .side .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font:800 12px var(--body);color:#fff;background:var(--k,var(--accent))}
  .side .sm{display:grid;flex:1;min-width:0}
  .side .sm small{color:var(--muted);font-weight:500;font-size:12px}
  .side .mini{height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin-top:4px}
  .side .mini i{display:block;height:100%;background:var(--k,var(--accent));border-radius:9px}
  .side .sfoot{margin-top:auto;padding-top:14px;display:grid;gap:8px}
  .topbar,main,footer{margin-left:var(--side)}
  .topbar .logo,.topbar .menu,.topbar .burger{display:none!important}
  .topbar .bar{justify-content:flex-end}
  main{max-width:1240px;padding-left:44px;padding-right:44px}
  .panel.mega{left:calc(50% + var(--side)/2)}
  .front{grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr)}
  .subjects.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subjects.five>.klass:last-child{grid-column:1/-1}
  .tpanel{right:24px}
}
@media (min-width:1600px){main{max-width:1380px}}
@media (max-width:1199px){.side{display:none!important}}

(() => {

const fmt = (x,d=2) => { if(!isFinite(x)) return '—'; const a=Math.abs(x); if(a!==0&&(a>=1e5||a<1e-2)){let e=Math.floor(Math.log10(a)), mt=(x/10**e).toFixed(2); if(Math.abs(+mt)>=10){e++; mt=(x/10**e).toFixed(2);} return mt.replace('.',',')+'·10'+sup(e);} const r=x.toFixed(d); return (/^-0[.,]?0*$/.test(r)?r.slice(1):r).replace('.',','); };

/* ===== stocare ===== */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('tbac:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },

};

/* ===== temă ===== */
const savedTheme = store.get('theme',null);

const L_TERMO = [
{ id:'intro', g:'baze', extra:true, t:'Noțiuni introductive', d:'Sistem, parametri de stare, temperatură, unități',
  brief:['Starea unui gaz se descrie prin p, V, T și ν.','T(K) = t(°C) + 273,15; diferențele de temperatură sunt aceleași în K și °C.','Totul se calculează în SI: Pa, m³, K, kg/mol.'], html:`
<p>Termodinamica studiază sistemele formate dintr-un număr foarte mare de particule și schimburile lor de energie sub formă de lucru mecanic și căldură.</p>
<h3>Sistem și parametri de stare</h3>
<ul>
<li><b>Sistem termodinamic:</b> corpul sau corpurile studiate (de obicei, gazul din cilindru). Tot restul este <b>mediul exterior</b>.</li>
<li><b>Parametri de stare:</b> mărimi care descriu starea: presiunea p, volumul V, temperatura T, cantitatea de substanță ν.</li>
<li><b>Stare de echilibru:</b> parametrii nu se mai schimbă în timp, dacă exteriorul nu se schimbă.</li>
<li><b>Transformare (proces):</b> trecerea dintr-o stare în alta. Poate fi <b>cvasistatică</b> (printr-un șir de stări de echilibru, se poate desena pe grafic), <b>reversibilă</b> sau <b>ireversibilă</b>, <b>ciclică</b> (starea finală = starea inițială).</li>
</ul>
<h3>Temperatura</h3>
<ul>
<li><b>Principiul zero:</b> două corpuri în echilibru termic cu un al treilea sunt în echilibru termic între ele. Temperatura este mărimea care are aceeași valoare la corpurile în echilibru termic.</li>
<li>Scara absolută (Kelvin): <b>T = t + 273,15</b> (la BAC se folosește de obicei 273). ΔT(K) = Δt(°C).</li>
</ul>
<h3>Mărimi legate de cantitatea de substanță</h3>
<div class="tw"><table><thead><tr><th>Mărime</th><th>Formula</th><th>Unitate</th></tr></thead><tbody>
<tr><td>Cantitate de substanță</td><td class="m">ν = m/μ = N/N<sub>A</sub></td><td class="m">mol</td></tr>
<tr><td>Masa molară</td><td class="m">μ = m/ν</td><td class="m">kg/mol</td></tr>
<tr><td>Masa unei molecule</td><td class="m">m₀ = μ/N<sub>A</sub></td><td class="m">kg</td></tr>
<tr><td>Volum molar</td><td class="m">V<sub>μ</sub> = V/ν</td><td class="m">m³/mol</td></tr>
<tr><td>Concentrația</td><td class="m">n = N/V</td><td class="m">m⁻³</td></tr>
<tr><td>Densitatea</td><td class="m">ρ = m/V</td><td class="m">kg/m³</td></tr>
</tbody></table></div>
<p><b>Condiții normale:</b> p₀ = 1,013·10⁵ Pa, T₀ = 273,15 K. Volumul molar normal: V<sub>μ0</sub> = 22,42·10⁻³ m³/mol pentru orice gaz ideal.</p>
<h3>Transformări de unități</h3>
<div class="tw"><table><thead><tr><th>Din</th><th>În SI</th></tr></thead><tbody>
<tr><td class="m">1 L = 1 dm³</td><td class="m">10⁻³ m³</td></tr>
<tr><td class="m">1 cm³</td><td class="m">10⁻⁶ m³</td></tr>
<tr><td class="m">1 atm</td><td class="m">1,013·10⁵ Pa</td></tr>
<tr><td class="m">1 bar</td><td class="m">10⁵ Pa</td></tr>
<tr><td class="m">1 g/mol</td><td class="m">10⁻³ kg/mol</td></tr>
<tr><td class="m">27 °C</td><td class="m">300 K</td></tr>
</tbody></table></div>
<div class="keep"><b>Greșeala cea mai frecventă:</b> μ lăsat în g/mol. Pentru O₂ scrii μ = 32·10⁻³ kg/mol, nu 32.</div>` },
{ id:'stare', g:'baze', t:'Ecuația de stare', d:'pV = νRT, densitate, amestecuri, Dalton, disociere',
